<style>
/* Renkler: tokens/colors.css (resmi Valeo paleti) — degistirilmedi, tasindi. */
:root {
  --valeo-blue:#041b3c; --valeo-green:#76ff03; --valeo-mid:#0072ce; --valeo-dark:#003d9b;
  --surface:#ffffff; --surface-dim:#f1f5f9;
  --neutral-100:#e4eaf0; --neutral-300:#9aaab8; --neutral-600:#4a6070; --neutral-900:#1a2f3f;
  --blue-50:#ddeef9; --blue-200:#7ab8e0; --blue-500:#2e7fc0; --blue-800:#0d3d6e;
  --success:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --text:var(--neutral-900); --text-dim:var(--neutral-600); --border:var(--neutral-100);
  --bg:var(--surface-dim); --card:var(--surface);
}
/* Koyu mod — kontrastlari WCAG AA'ya gore elle secildi (bkz. docs/karar-gecmisi.md) */
body.dark-mode {
  --surface:#0f1b2d; --surface-dim:#0a1422;
  --neutral-100:#1e3048; --neutral-300:#6b8299; --neutral-600:#a8bccd; --neutral-900:#eaf1f7;
  --blue-50:#12283f; --valeo-green:#8dff3a;
  --text:#eaf1f7; --text-dim:#a8bccd; --border:#1e3048;
  --bg:#0a1422; --card:#0f1b2d;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45; min-height:100dvh;
}
:focus-visible { outline:2px solid var(--valeo-green); outline-offset:2px; border-radius:3px; }
body.dark-mode :focus-visible, .topbar :focus-visible { outline-color:#fff; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; animation-duration:.01ms!important; } }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* --- Ust bar --- */
.topbar {
  background:var(--valeo-blue); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
.topbar h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
.topbar .spacer { flex:1 1 auto; }
.icon-btn {
  background:rgba(255,255,255,.12); color:#fff; border:none; cursor:pointer;
  min-width:44px; min-height:44px; border-radius:var(--radius-md); font-size:16px;
  display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover { background:rgba(255,255,255,.22); }

/* --- Filtre barI --- */
.filters {
  background:var(--card); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;
  position:sticky; top:52px; z-index:40;
}
.fgroup { display:flex; flex-direction:column; gap:4px; }
.fgroup > label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
.seg button {
  background:var(--card); color:var(--text); border:none; cursor:pointer;
  padding:0 14px; min-height:44px; font-size:14px; font-family:inherit;
}
.seg button + button { border-left:1px solid var(--border); }
.seg button[aria-pressed="true"] { background:var(--valeo-dark); color:#fff; font-weight:600; }
select.ctl {
  min-height:44px; padding:0 10px; font-size:14px; font-family:inherit;
  border:1px solid var(--border); border-radius:var(--radius-md);
  background:var(--card); color:var(--text);
}

/* --- Icerik --- */
main { padding:16px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); max-width:1400px; margin:0 auto; }
.crumb { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:14px; color:var(--text-dim); flex-wrap:wrap; }
.crumb button { background:none; border:none; color:var(--valeo-mid); cursor:pointer; font:inherit; padding:6px 4px; min-height:44px; }
.crumb b { color:var(--text); }

/* --- KPI seridi --- */
.kpis { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin-bottom:16px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; }
.kpi-label { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); }
.kpi-value { font-size:clamp(22px,4.2vw,30px); font-weight:700; line-height:1.15; margin-top:4px; }
.kpi-sub { font-size:13px; color:var(--text-dim); margin-top:2px; }
.kpi.good .kpi-value { color:var(--success); }
.kpi.bad .kpi-value { color:var(--danger); }

/* --- Kartlar --- */
.cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:14px 16px; text-align:left; font:inherit; color:inherit; cursor:pointer; width:100%;
}
.card:hover { border-color:var(--valeo-mid); }
.card h3 { margin:0 0 2px; font-size:16px; }
.card .sub { font-size:12px; color:var(--text-dim); margin-bottom:10px; }
.rowline { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:3px 0; font-size:14px; }
.rowline .v { font-variant-numeric:tabular-nums; font-weight:600; }

.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
.badge.good { background:var(--blue-50); color:#166534; }
body.dark-mode .badge.good { background:#14331f; color:#8ef0ae; }
.badge.bad { background:#fee2e2; color:#991b1b; }
body.dark-mode .badge.bad { background:#3a1618; color:#ffb4b4; }
.badge.warn { background:#fef3c7; color:#92400e; }
body.dark-mode .badge.warn { background:#3a2c10; color:#f5cf7a; }
.badge.mute { background:var(--neutral-100); color:var(--text-dim); }

/* --- Tablo (mobilde karta doner) --- */
.tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); }
table { border-collapse:collapse; width:100%; font-size:14px; }
th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
th { background:var(--surface-dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
tbody tr:hover { background:var(--blue-50); }
tbody tr { cursor:pointer; }

.chartcard { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; margin-top:16px; }
.chart-canvas-wrap { position:relative; width:100%; height:260px; }
.chart-canvas-wrap canvas { display:block; max-width:100%!important; }

.notice { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--warning); border-radius:var(--radius-md); padding:12px 14px; margin-top:16px; font-size:13px; color:var(--text-dim); }
.err { border-left-color:var(--danger); color:var(--text); }
.spinner { text-align:center; padding:48px 16px; color:var(--text-dim); }

/* --- Ayarlar --- */
dialog.panel { border:none; border-radius:var(--radius-lg); padding:0; max-width:min(560px,92vw); background:var(--card); color:var(--text); }
dialog.panel::backdrop { background:rgba(4,27,60,.55); }
.panel-head { background:var(--valeo-blue); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
.panel-head h2 { margin:0; font-size:16px; flex:1; }
.panel-body { padding:16px; display:flex; flex-direction:column; gap:14px; }
.panel-body input[type=text] { width:100%; min-height:48px; padding:0 12px; font:inherit; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card); color:var(--text); }
.btn { background:var(--valeo-dark); color:#fff; border:none; border-radius:var(--radius-md); min-height:44px; padding:0 16px; font:inherit; cursor:pointer; }
.btn.ghost { background:transparent; color:var(--valeo-mid); border:1px solid var(--border); }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }
.log { font-size:13px; color:var(--text-dim); white-space:pre-wrap; max-height:180px; overflow:auto; }

/* --- Mobil --- */
@media (max-width:768px) {
  .filters { top:auto; position:static; gap:12px; }
  .kpis { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .cards { grid-template-columns:1fr; }
  table.m-cards, table.m-cards thead, table.m-cards tbody, table.m-cards th,
  table.m-cards td, table.m-cards tr { display:block; }
  table.m-cards thead { display:none; }
  table.m-cards tr { border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; padding:6px 10px; }
  table.m-cards td { border:none; display:flex; justify-content:space-between; gap:12px; white-space:normal; padding:6px 0; }
  table.m-cards td::before { content:attr(data-label); font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); }
  .tablewrap { border:none; background:transparent; }
}
/* Telefon yatay: dikey alan az — serit tek satira sikissin */
@media (max-height:520px) and (orientation:landscape) {
  .kpis { grid-template-columns:repeat(4,1fr); }
  .kpi-value { font-size:20px; }
  .chart-canvas-wrap { height:180px; }
}
@media print {
  .topbar,.filters,.crumb button,.icon-btn { display:none!important; }
  body { background:#fff; }
  .card,.kpi,.tablewrap { break-inside:avoid; }
}
</style>
