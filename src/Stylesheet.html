<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   Renk temeli: tokens/colors.css (resmi Valeo paleti) — marka
   renkleri degistirilmedi. Kategorik RO paleti dataviz skill'inin
   referans paletinden alindi, 1. slot Valeo mavisiyle degistirilip
   validate_palette.js ile dogrulandi (bkz. karar notu commit'te).
   Tipografi: Inter. Durum renkleri WCAG AA icin koyulastirildi.
   ============================================================ */
:root {
  /* marka — tokens/colors.css */
  --valeo-blue:#041b3c; --valeo-green:#76ff03; --valeo-mid:#0072ce; --valeo-dark:#003d9b;
  /* Kucuk buyuk-harf etiketler icin marka mavisinin OKUNUR tonu. --valeo-mid
     10px'lik bir etikette sinirda kaliyordu (olculdu: beyazda 4.89:1 ama
     --sunken uzerinde 4.35:1, AA alti); bu ton her iki yuzeyde de >=5:1.
     Koyu modda ayni mavi kartin uzerinde 3.57:1 kaliyor, orada acik ton. */
  --label-accent:#0068bd;

  /* yuzey / notr */
  --bg:#f2f5f9; --bg-2:#e9eef6;
  --card:#ffffff; --card-2:#fafbfe; --sunken:#eef2f8;
  --border:#e4eaf3; --border-strong:#cfdaea;
  --text:#0c1626; --text-dim:#51637a; --text-mute:#8195ad;

  /* durum */
  --good:#12803c; --good-bg:#e6f6ec; --good-line:#1fa855;
  --bad:#c22a2a;  --bad-bg:#fdeaea;  --bad-line:#e04a4a;
  /* Isi haritasi hucrelerinde alfa gerekiyor; color-mix yerine ham RGB
     tutuluyor ki rgba() ile dogrudan kullanilabilsin. */
  --good-rgb:31,168,85; --bad-rgb:224,74,74;
  /* "raporlamadi" ne iyi ne kotu: ucuncu bir durum rengi gerekiyor. */
  --warn:#8a5a00; --warn-bg:#fdf4e3; --warn-line:#d9a441;
  --warn:#a85a08; --warn-bg:#fdf0dd; --warn-line:#e08a1e;
  --track:#e8edf5;

  /* Kategorik RO paleti (identity). dataviz/scripts/validate_palette.js ile
     dogrulandi: acik modda 7 slot ALL CHECKS PASS (en kotu komsu cift
     yellow<->aqua CVD dE 9.1, normal-gorus dE 19.6). aqua/yellow/magenta
     yuzeye karsi 3:1'in altinda -> "relief" kurali geregi her satirda
     GORUNUR metin etiketi var (RO kodu + adi), renk tek basina kimlik
     tasimiyor. */
  --ro-PDE:#0072ce; --ro-PAS:#eb6834; --ro-PDA:#1baf7a; --ro-PDC:#eda100;
  --ro-PTC:#e87ba4; --ro-PTE:#008300; --ro-PTA:#4a3aa7;

  /* olcu */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(12,22,38,.04), 0 1px 3px rgba(12,22,38,.06);
  --sh-2:0 4px 10px -2px rgba(12,22,38,.07), 0 12px 26px -8px rgba(12,22,38,.13);
  --sh-3:0 8px 16px -4px rgba(12,22,38,.10), 0 20px 42px -12px rgba(12,22,38,.20);
  --ring:0 0 0 3px rgba(0,114,206,.28);
  /* Icerik ekrani DOLDURUR: 1320px'te 1920'lik bir ekranda iki yanda genis
     bos serit kaliyordu (kullanici tespiti). Ust sinir yalnizca cok genis
     monitorlerde satirlarin asiri uzamasini engelliyor. */
  --maxw:2200px;
  /* Ray acikken 232px'te RO adlari kesiliyordu ("Power Drive Ameri...");
     268px'te en uzun ad ("Power Thermal Europe") tam siginiyor. */
  --rail-w:64px; --rail-open:268px; --rail-inner:252px; --topbar-h:62px;
}
body.dark-mode {
  --bg:#070d18; --bg-2:#0a1220;
  --card:#101a2b; --card-2:#142034; --sunken:#0c1626;
  --border:#1d2b42; --border-strong:#2a3c5a;
  --text:#eaf1f9; --text-dim:#a2b4ca; --text-mute:#76899f;
  --good:#5fd68a; --good-bg:#0f2c1c; --good-line:#3fbf6d;
  --bad:#ff8f8f;  --bad-bg:#361518;  --bad-line:#e06565;
  --good-rgb:63,191,109; --bad-rgb:224,101,101;
  --warn:#f0c26b; --warn-bg:#33270f; --warn-line:#8a6a28;
  --warn:#f0c274; --warn-bg:#33270f; --warn-line:#d8a03e;
  --track:#1b2841;
  --label-accent:#5aa9ef;   /* koyu kart uzerinde 6.94:1 (olculdu) */
  /* Koyu mod adimlari ayrica dogrulandi (surface #101a2b): 7 slot ALL PASS. */
  --ro-PDE:#3987e5; --ro-PAS:#d95926; --ro-PDA:#199e70; --ro-PDC:#c98500;
  --ro-PTC:#d55181; --ro-PTE:#008300; --ro-PTA:#9085e9;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 6px 16px -4px rgba(0,0,0,.5);
  --sh-3:0 10px 30px -6px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(122,184,224,.34);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter','Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  font-size:15px; line-height:1.5; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 12% -8%, rgba(0,114,206,.07), transparent 60%),
                   radial-gradient(900px 500px at 96% 0%, rgba(123,92,224,.06), transparent 55%);
  background-attachment:fixed;
}
/* Kolon halinde hizalanmasi gereken sayilar tabular; buyuk tek sayilar
   (hero figur) oransal rakam kullanir — dataviz/marks-and-anatomy.md */
.num,td.num,.stat-v,.tbl-v{font-variant-numeric:tabular-nums}
:focus-visible{outline:none; box-shadow:var(--ring); border-radius:8px}
.topbar :focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.6)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* [hidden] HER ZAMAN kazanir. display:flex/grid/inline-flex veren kurallar
   tarayicinin [hidden] kuralini eziyor ve gizli ogeler gorunur kaliyordu —
   bu tuzaga uc kez dusuldu (dil menusu, sag panel, gorsel temizleme dugmesi).
   Tek yerden cozulduğu icin bir daha tekrarlanmiyor. */
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-9999px;top:0;z-index:200;background:var(--card);color:var(--text);padding:10px 16px;border-radius:0 0 var(--r-sm) 0;font-weight:600}
.skip-link:focus{left:0}

/* ---------- sol gezinme rayi ----------
   SAPMA NOTU: docs/sidebar.md genisleyip daralan sidebar'i kaldirip sabit
   ikon + flyout desenini benimsemis. Kullanici acikca "mouse uzerine gelince
   acilsin, cekilince kapansin" istedigi icin hover-genisleme uygulandi.

   Icerik KAYMAZ: body dolgusu 64px'te sabit, ray genisleyince icerigin
   uzerine biniyor. Aksi halde her hover'da tum sayfa saga kayardi.
   Dugmeler sabit genislikte (216px) ve ray overflow-x:hidden — boylece
   genisleme sirasinda metin yeniden akmiyor, sadece gorunur oluyor. */
body.has-rail{padding-left:var(--rail-w); transition:padding-left .18s ease}
/* Icerik tam genislige yayilinca ray ACILDIGINDA ustune biniyor ve soldaki
   ~200px'i kapatiyordu. Onceki karar "icerik kaymasin, ray ustune binsin"di;
   o zaman icerik 1320px'te ortali oldugu icin ray hicbir seyi ortmuyordu.
   Artik icerik kenara kadar geldiginden ray acilinca icerik de kayiyor.
   :has() desteklenmeyen tarayicida kural hic uygulanmaz, davranis eskisi
   gibi (ustune binme) kalir -- bozulma olmaz. */
body.has-rail:has(.rail:hover),
body.has-rail:has(.rail:focus-within){padding-left:var(--rail-open)}
@media (prefers-reduced-motion:reduce){ body.has-rail{transition:none} }
.rail{
  position:fixed; left:0; top:0; bottom:0; width:var(--rail-w); z-index:70;
  background:linear-gradient(180deg,#041b3c,#062a5c);
  border-right:1px solid rgba(255,255,255,.08);
  display:flex; flex-direction:column; align-items:flex-start;
  padding:0 0 14px; gap:4px;
  overflow-x:hidden; overflow-y:auto; scrollbar-width:none;
  transition:width .18s ease, box-shadow .18s ease;
}
.rail::-webkit-scrollbar{display:none}
/* focus-within: klavyeyle gezende de acilsin (hover'a bagli islev birakilmaz —
   jenerik-desenler.md) */
.rail:hover,.rail:focus-within{
  width:var(--rail-open); box-shadow:12px 0 40px -16px rgba(4,27,60,.55);
}
/* Marka: ray genisleyince logo buyur, kapaninca kucul (kullanici talebi).
   docs/logo.md: koyu zeminde logo KENDI renginde kalir (Valeo yesili),
   beyaza cevrilmez — ust bardaki kullanim ayri, orasi metinle ayni satirda. */
/* Kapali: 64px'lik seride kenardan kenara logo, dikey ortali, ust bar
   satiriyla ayni yukseklikte. Acik: logo ve alt basligin ikisi de YATAY
   ORTALI ve daha genis bir blok icinde (referans uygulamayla ayni hiza) --
   sola yaslanmis kucuk logo + sagda genis bosluk goze hos gorunmuyordu. */
.rail-brand{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0; width:100%; margin:0 0 10px; padding:0; flex:none;
  min-height:var(--topbar-h);
  border-bottom:1px solid rgba(255,255,255,.10);
}
.rail:hover .rail-brand,.rail:focus-within .rail-brand{gap:11px; padding:20px 0 15px}
/* Kapaliyken logo 64px'lik seridin TAMAMINI doldurur (kenardan kenara) ve
   blogun icinde DIKEY ORTALI durur. Onemli: alttaki .rail-title kapaliyken
   yalniz opacity:0 idi, yani YERINI KORUYORDU -- logonun altinda ~19px'lik
   olu bir band birakiyordu. Kapaliyken yuksekligi de sifirlaniyor, boylece
   logo blogun tamamini kullanir. Logonun kendi orani 2.3:1 oldugu icin 64px
   genislikte yuksekligi ~28px'i gecemez; daha buyugu ya orani bozar ya da
   marka isaretini kirpar -- ikisi de docs/logo.md'ye aykiri. */
.rail-logo{
  width:var(--rail-w); height:auto; object-fit:contain; display:block;
  transition:width .18s ease;
}
.rail:hover .rail-logo,.rail:focus-within .rail-logo{width:188px}
.rail-title{
  font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:rgba(255,255,255,.62); white-space:nowrap; text-align:center;
  opacity:0; height:0; overflow:hidden; transition:opacity .14s ease;
}
.rail:hover .rail-title,.rail:focus-within .rail-title{opacity:1; height:auto}
/* Alt bolum (Help / Feedback / Settings) her zaman en altta */
.rail-foot{
  margin-top:auto; padding-top:12px; width:100%; flex:none;
  display:flex; flex-direction:column; gap:4px;
  border-top:1px solid rgba(255,255,255,.12);
}
.rail-items{display:flex; flex-direction:column; gap:4px; width:100%}
.rail-btn{
  display:flex; align-items:center; gap:9px; flex:none;
  width:var(--rail-inner); margin:0 8px; min-height:44px; padding:0 13px;
  background:transparent; border:none; border-radius:11px; cursor:pointer;
  color:rgba(255,255,255,.68); font:inherit; text-align:left;
  transition:background .15s ease, color .15s ease;
}
.rail-btn:hover{background:rgba(255,255,255,.12); color:#fff}
.rail-btn[aria-current="true"]{background:rgba(255,255,255,.16); color:#fff}
.rail-ico{
  width:22px; height:22px; border-radius:7px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--rail-color,#fff) 26%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rail-color,#fff) 55%,transparent);
}
.rail-ico .flag{border-radius:2px; width:15px; height:11px}
.rail-ico .flag svg{width:100%; height:100%}
.rail-ico svg{display:block}
.rail-btn svg{flex:none; display:block}
/* Kapaliyken ray YALNIZ ikon gosterir (kullanici talebi): RO kodu ve ad
   gizli, ikon 64px'lik seride ortali durur. Acilinca ikisi de gorunur. */
.rail-code{
  font-size:11px; font-weight:800; letter-spacing:.04em; flex:none; width:26px;
  opacity:0; transition:opacity .14s ease;
}
.rail:hover .rail-code,.rail:focus-within .rail-code{opacity:1}
.rail-name{
  flex:1 1 auto; min-width:0; font-size:12.5px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transition:opacity .14s ease;
}
.rail-chev{
  flex:none; opacity:0; transition:opacity .14s ease, transform .15s ease;
  color:rgba(255,255,255,.5);
}
.rail:hover .rail-name,.rail:focus-within .rail-name,
.rail:hover .rail-chev,.rail:focus-within .rail-chev{opacity:1}
.rail-btn[aria-expanded="true"] .rail-chev{transform:rotate(90deg)}
.rail-sep{width:30px; height:1px; background:rgba(255,255,255,.14); margin:6px 0 6px 19px; flex:none}

/* ---------- iki kademeli ray ----------
   Ust baslik (Dashboard / Monthly Report) + alt sayfalar. Ray KAPALIYKEN
   yalniz ust baslik ikonlari gorunur: 64px'lik seritte alt sayfa adlari
   okunamazdi. Ikona tiklamak o grubun ilk sayfasini acar; ray acilinca
   alt sayfalar gorunur ve dogrudan secilir. */
.rail-grp{display:flex; flex-direction:column; width:100%; margin-bottom:4px}
.rail-head .rail-name{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase}
.rail-kids{display:none; flex-direction:column; gap:2px; margin:2px 8px 4px; width:var(--rail-inner)}
.rail:hover .rail-kids,.rail:focus-within .rail-kids{display:flex}
.rail-kid{
  display:flex; align-items:center; gap:9px; min-height:34px; padding:0 13px 0 22px;
  background:transparent; border:none; border-radius:9px; cursor:pointer;
  color:rgba(255,255,255,.62); font:inherit; font-size:12.5px; font-weight:600;
  text-align:left; white-space:nowrap;
  transition:background .15s ease, color .15s ease;
}
.rail-kid:hover{background:rgba(255,255,255,.10); color:#fff}
.rail-kid[aria-current="true"]{background:rgba(255,255,255,.16); color:#fff; font-weight:700}
.rk-dot{
  width:6px; height:6px; border-radius:50%; flex:none;
  background:rgba(255,255,255,.35); transition:background .15s ease, box-shadow .15s ease;
}
.rail-kid[aria-current="true"] .rk-dot{
  background:var(--valeo-green); box-shadow:0 0 0 3px rgba(118,255,3,.18);
}
@media (prefers-reduced-motion:reduce){ .rail-kid,.rk-dot{transition:none} }

/* Bir RO acilinca site'lari satir ICINDE listelenir (flyout yerine) —
   yalniz ray genisken gorunur. */
.rail-sites{display:none; flex-direction:column; width:var(--rail-inner); margin:0 8px 4px; flex:none}
.rail:hover .rail-sites,.rail:focus-within .rail-sites{display:flex}
.rail-sites button{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  background:none; border:none; font:inherit; font-size:12px; color:rgba(255,255,255,.72);
  padding:7px 11px 7px 30px; border-radius:9px; cursor:pointer; min-height:34px;
}
.rail-sites button:hover{background:rgba(255,255,255,.12); color:#fff}
.rail-sites .rs-name{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rail-sites .rs-v{flex:none; font-size:11px; font-weight:700; color:rgba(255,255,255,.5)}
.rail-sites .flag{box-shadow:0 0 0 1px rgba(255,255,255,.25)}

/* ---------- sag detay paneli (docs/detay-panel.md) ---------- */
.drawer-scrim{
  position:fixed; inset:0; z-index:88; background:rgba(4,27,60,.35);
  backdrop-filter:blur(1px); animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:89;
  width:min(520px,94vw); display:flex; flex-direction:column;
  background:var(--card); border-left:1px solid var(--border);
  box-shadow:-24px 0 60px -30px rgba(4,27,60,.5);
  animation:sheetIn .22s ease;
}
@keyframes sheetIn{from{transform:translateX(24px); opacity:.4} to{transform:none; opacity:1}}
.drawer-head{
  background:linear-gradient(100deg,#041b3c,#062a5c); color:#fff;
  padding:16px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.drawer-head h2{margin:0; font-size:16px; font-weight:700; flex:1 1 auto; letter-spacing:-.01em;
  display:flex; align-items:center; gap:9px; min-width:0}
.drawer-eyebrow{
  flex:0 0 100%; font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.11em; color:rgba(255,255,255,.62);
  display:flex; align-items:center; gap:7px; order:-1;
}
.drawer-body{padding:18px; overflow:auto; flex:1 1 auto; display:flex; flex-direction:column; gap:18px}
/* Site panelinde alt serit yok (o dugme kaldirildi); yardim paneli
   hala kullaniyor. */
.drawer-foot{
  padding:13px 18px; border-top:1px solid var(--border); background:var(--sunken);
  display:flex; justify-content:flex-end;
}
.dk{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.dk-cell{
  background:var(--sunken); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:11px 13px;
}
.dk-l{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text-mute)}
.dk-v{font-size:21px; font-weight:800; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums}
.dk-v .cur{font-size:.5em; font-weight:700; color:var(--text-dim); margin-left:2px}
.dk-s{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:2px}
.drawer h3{margin:0 0 11px; font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.11em; color:var(--text-dim)}
/* Dar panelde Segment sutunu cikarilir — basliktaki hucre de gizlenmeli,
   yoksa baslik 5 sutun / satir 4 sutun olup O.I alt satira kayiyor. */
.drawer .tops-row,.drawer .tops-head{grid-template-columns:minmax(0,1fr) 76px 76px 62px; gap:9px}
.drawer .tops-row .dim,.drawer .tops-row .ok{font-size:12px}
.drawer .tp-seg,.drawer .tops-head span:nth-child(2){display:none}

/* ---------- yardim paneli / geri bildirim penceresi ---------- */
.help-ico{
  width:34px; height:34px; border-radius:10px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--valeo-green,#78be20); color:#06230a;
}
.drawer-head h2,.panel-head h2{display:flex; flex-direction:column; gap:2px; min-width:0}
.drawer-head h2 i,.panel-head h2 i{
  font-style:normal; font-size:11.5px; font-weight:500; color:rgba(255,255,255,.66);
}
.help-drawer .drawer-body{gap:14px}
.help-search input{padding-left:38px}
.help-chips{display:flex; flex-wrap:wrap; gap:7px}
.help-chips button{
  font:inherit; font-size:12px; font-weight:600; cursor:pointer;
  padding:6px 11px; border-radius:999px; min-height:32px;
  background:var(--sunken); border:1px solid var(--border-strong); color:var(--text-dim);
}
.help-chips button:hover{border-color:var(--valeo-mid); color:var(--valeo-mid)}
.help-sec{margin-bottom:18px}
.help-sec h3{
  display:flex; align-items:center; gap:8px; margin:0 0 10px;
  font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.11em;
  color:var(--valeo-mid);
}
.help-step{
  display:flex; gap:12px; padding:12px 14px; margin-bottom:8px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);
}
.help-step .hs-n{
  width:22px; height:22px; border-radius:7px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--sunken); color:var(--valeo-mid); font-size:11px; font-weight:800;
}
.help-step .hs-b{min-width:0}
.help-step b{display:block; font-size:13.5px; font-weight:700; margin-bottom:3px}
.help-step span{font-size:12.5px; color:var(--text-dim); line-height:1.5}
.help-step .src{display:block; margin-top:6px; font-size:11px; color:var(--text-mute)}
.help-empty{font-size:13px; color:var(--text-mute); padding:10px 2px}
.help-foot{justify-content:space-between; align-items:center; gap:12px; font-size:12.5px; color:var(--text-dim)}

.panelx.fb{max-width:600px; width:min(600px,94vw)}
.panelx.fb .panel-body{gap:18px}
.panel-foot{
  padding:14px 20px; border-top:1px solid var(--border); background:var(--sunken);
  display:flex; justify-content:flex-end; gap:10px;
}
.flabel .req{color:var(--bad); font-weight:800}
.flabel .opt{font-style:normal; font-weight:500; text-transform:none; letter-spacing:0; color:var(--text-mute)}
.pickrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.pickrow button{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:46px; padding:0 14px; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600;
  background:var(--card); border:1px solid var(--border-strong); border-radius:var(--r-sm);
  color:var(--text); transition:border-color .15s ease, background .15s ease;
}
.pickrow button:hover{border-color:var(--valeo-mid)}
.pickrow button[aria-checked="true"]{
  border-color:var(--valeo-mid); background:rgba(0,114,206,.08); color:var(--valeo-mid); font-weight:700;
}
.pickrow .pk-dot{width:9px; height:9px; border-radius:50%; background:var(--pk,var(--text-mute)); flex:none}
.pickrow svg{flex:none}
.panel-body textarea{
  width:100%; min-height:110px; padding:11px 13px; font:inherit; font-size:14px; resize:vertical;
  border:1px solid var(--border-strong); border-radius:var(--r-sm);
  background:var(--card); color:var(--text);
}
.panel-body textarea:hover{border-color:var(--valeo-mid)}
.dropzone{
  border:1.5px dashed var(--border-strong); border-radius:var(--r-sm);
  min-height:78px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:var(--sunken); transition:border-color .15s ease, background .15s ease;
}
.dropzone:hover,.dropzone.over{border-color:var(--valeo-mid); background:rgba(0,114,206,.06)}
.dz-empty{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-dim); font-weight:600}
.dz-empty em{font-style:normal; color:var(--text-mute); font-weight:500}
.dz-preview{position:relative; display:inline-flex; padding:8px}
.dz-preview img{max-height:130px; max-width:100%; border-radius:8px; display:block; box-shadow:var(--sh-2)}
.dz-preview button{
  position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%;
  border:none; cursor:pointer; background:rgba(4,27,60,.78); color:#fff; font-size:16px; line-height:1;
}
.fb-msg{font-size:13px; font-weight:600; padding:10px 13px; border-radius:var(--r-sm)}
.fb-msg.err{background:var(--bad-bg); color:var(--bad)}
.fb-msg.ok{background:var(--good-bg); color:var(--good)}

/* ---------- ust bar ---------- */
.topbar{
  background:linear-gradient(100deg,#041b3c 0%,#062a5c 55%,#003d9b 130%);
  color:#fff; position:sticky; top:0; z-index:60;
  box-shadow:0 1px 0 rgba(255,255,255,.06), 0 8px 24px -12px rgba(4,27,60,.6);
}
/* Ust bar icerigi --maxw ile SINIRLANMAZ: dil, tema ve kullanici cipi
   pencerenin gercek sag kenarina yaslansin (kullanici talebi). Alttaki
   filtreler ve main yine --maxw ile ortali kalir. */
/* Yukseklik --topbar-h'de SABIT tutuluyor: kullanici cipi uc satira cikinca
   bar buyuyup altindaki yapiskan filtre seridinin top:62px offsetini
   kaydirmasin diye min-height + dolgu toplami tam 62px. */
.topbar-inner{
  max-width:none; margin:0; padding:8px 24px;
  min-height:var(--topbar-h);  /* box-sizing:border-box — dolgu dahil */
  display:flex; align-items:center; gap:12px;
}
.topbar img.logo{height:26px; width:auto; object-fit:contain; filter:brightness(0) invert(1)}
.topbar .spacer{flex:1 1 auto}
.tbtn{
  background:rgba(255,255,255,.10); color:#fff; border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm); min-height:38px; padding:0 13px; font:inherit; font-size:13px;
  font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
  backdrop-filter:blur(4px);
}
.tbtn:hover{background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.38); transform:translateY(-1px)}
.tbtn.icon{min-width:38px; padding:0; justify-content:center}
/* docs/ikonlar.md: Lucide, currentColor, 20px yaninda-metin / 16px ikon-only */
.tbtn svg{display:block; flex:none}

/* ---------- yonetim ekrani: cevap onde ----------
   Benchmark kurallari (ThoughtSpot/Sigma/Omni/Microsoft Learn): plan-gerceklesen
   kiyasi UZUNLUKLA (cubuk), parca-butun HALKAYLA ve en fazla ~5 dilimle;
   ekranda 4-6 gorsel, 5-6 KPI. Bu blok o duzeni tasiyor. */
.exb.good .exb-v{color:var(--good)} .exb.bad .exb-v{color:var(--bad)} .exb.flat .exb-v{color:var(--text-mute)}

/* Raporlama satiri: buyuk sapma sayisinin ne kadari "geride", ne kadari
   "bilinmiyor" -- ikisi ayni sey degil, ust yonetime oyle gitmesin. */
.ex-rep-nr.on .ex-rep-ch{transform:rotate(90deg)}

/* ---------- grafik kart basligi ---------- */
/* Kart basligi UC KADEMELI okunur: kapsam (eyebrow) -> OLCU (h3) -> seriler.
   Onceki halinde olcu 10px'lik soluk bir rozet, seriler de 11.5px gri bir
   satirdi; grafigin NEYI anlattigini soyleyen ogeler goze carpmiyordu. */
.bc-head{margin-bottom:14px}
/* Ust satir: kapsam/anahtar solda, efsane veya gorunum secici sagda. */
.bc-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:5px}
.bc-top>.ex-view{margin-left:auto}
.bc-keywrap{display:flex; justify-content:center; margin-top:10px}
.bc-title{min-width:0}
.bc-eyebrow{
  display:block; font-size:11px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--label-accent); margin-bottom:5px;
}
.bc-panel .bc-head h3{
  margin:0; font-size:clamp(19px,1.5vw,25px); font-weight:800; letter-spacing:-.015em;
  line-height:1.14; color:var(--text);
}
.bc-sub{margin:5px 0 0; font-size:12.5px; font-weight:600; color:var(--text-dim); line-height:1.35}
/* Efsane artik "kucuk gri yazi" degil: kendi yuzeyinde, metin murekkebiyle. */
.bc-key{
  display:inline-flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 11px; border-radius:11px;
  background:var(--sunken); border:1px solid var(--border);
}
.bc-kk{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--text)}
.bc-kk i{width:11px; height:11px; border-radius:3px; display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
/* Seri anahtari ile yigin (P1/P10/TTM) ton anahtarini ayiran ince cizgi. */

/* RO bayrak satiri — SVG'nin ALTINDA, ayni sutun genisliginde */
.bc-labels{display:flex; width:100%; margin-top:2px}
.bc-lb{
  display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;
  background:none; border:none; font:inherit; cursor:pointer; padding:6px 7px 2px;
  border-radius:10px; color:var(--text);
}
.bc-lb:hover{background:var(--sunken)}
.bc-lb-f{display:flex; align-items:center; justify-content:center; height:18px}
.bc-lb-c{font-size:14px; font-weight:800; letter-spacing:.03em}
/* .xro onceki olu-CSS temizliginde silinmisti; aile grafigindeki uye RO
   cipleri duz metin gorunuyordu. */
.xro{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 6px 2px 4px; border-radius:5px;
  color:var(--rc,var(--text-mute)); background:color-mix(in srgb,var(--rc,#888) 14%,transparent);
  white-space:nowrap;
}
.xro .flag{border-radius:2px}
.bc-lb-ros{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-top:2px}
/* RO adi ONCE tek satira sikistirilip ucu kesiliyordu: "Power Asia" tam,
   "Power Thermal A..." yarim goruyordu -- ayni turden yedi etiket birbirinden
   farkli duruyordu. Artik SARIYOR (kesilmiyor) ve iki satirlik yer her
   sutunda ayrilmis durumda, boylece hepsi ayni yuksekligi kapliyor; yan
   sutunlarla arayi acmak icin etiketin kendi yan boslugu da buyutuldu. */
.bc-lb-n{font-size:10.5px; font-weight:600; color:var(--text-mute); text-align:center;
         white-space:normal; overflow-wrap:anywhere; line-height:1.3;
         min-height:2.6em; max-width:100%}

/* sag paneldeki proje tipi tablosu */
.dk-types{margin-top:14px}
.dkt{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.dkt th,.dkt td{padding:7px 8px; font-size:12.5px; text-align:right}
.dkt thead th{font-size:9.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--text-mute)}
.dkt tbody th{text-align:left; font-weight:800}
.dkt td.good{color:var(--good); font-weight:700}
.dkt td.bad{color:var(--bad); font-weight:700}
.dkt-sum{border-top:1px solid var(--border)}
.dkt-sum th,.dkt-sum td{font-weight:800}

/* ---------- RO cubuk grafigi (saf SVG) ----------
   Kap sabit oranli; Chart.js kullanilmadigi icin docs/grafikler.md'deki
   "maintainAspectRatio sonsuz dongusu" tuzagi burada yok, ama yine de
   yukseklik CSS'ten veriliyor ve SVG viewBox'a sigiyor. */
/* Panel basligi ile notu ayni satirda dursun: kural yoktu, not alt satira
   dusuyordu (TOP projeler, proje tipi tablosu vb.). */
.panel-h{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap}
.bc-panel{margin-bottom:18px}
.bc-panel .panel-h{display:flex; align-items:center; justify-content:space-between; gap:16px}
/* Sabit yukseklik + preserveAspectRatio:none yazilari yatayda geriyordu.
   Oranla verilince SVG kendi olceginde kaliyor. */
/* Oran artik SATIR ICI olarak SVG'nin viewBox'indan geliyor (Script.html);
   buradaki deger yalnizca yedek. */
.bc-wrap{width:100%; aspect-ratio:1180/260; max-width:100%}
/* Aile grafigi: iki birim yan yana. Iki AYRI grafik -- ayni eksene iki olcek
   koymak (cift eksen) veriyi yanlis okutur. */
/* Sutun sayisi uyarlamali. Aile grafiginde 2 kategori var, dar yerde de
   rahat; RO grafiginde 7 kategori x 3 cubuk var, yari genislik ~1560px'in
   altinda sikisiyor -- orada alt alta dusuyorlar. */
/* Ornek (gercek olmayan) deger rozeti. Uydurma bir sayinin gercek sanilmasi
   yasak; deger nerede gecerse gecsin bu etiketi tasir. */
.demo-tag{
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px;
  font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line);
  vertical-align:1px; cursor:help;
}

/* ---------- gorunum secici (Grafik / Tablo) ---------- */
.scope-sw .ex-view{margin-left:auto}
.ex-view{display:inline-flex; background:var(--sunken); border:1px solid var(--border);
  border-radius:11px; padding:3px; gap:3px}
.ex-view button{
  background:transparent; color:var(--text-dim); border:none; cursor:pointer;
  padding:0 13px; min-height:30px; font:inherit; font-size:12px; font-weight:700;
  border-radius:8px; white-space:nowrap; transition:background .15s ease, color .15s ease;
}
.ex-view button:hover{background:var(--card); color:var(--text)}
.ex-view button[aria-pressed="true"]{
  background:linear-gradient(180deg,#0a7ddb,#0060b4); color:#fff;
  box-shadow:0 1px 2px rgba(0,61,155,.4);
}

/* ---------- sapma matrisi (gap matrix) ----------
   Ayrisan (diverging) olcek: iki uc + NOTR gri orta, kol basina esit adim.
   Tonlar ACIK tutuldu ki hucre yazisi tek murekkeple okunsun; olculdu:
   en dusuk metin kontrasti acikta 9.43:1, gecede 5.47:1 (WCAG AA 4.5).
   Renk TEK kanal degil -- her hucrede sapmanin isaretli sayisi yaziyor. */
:root{
  --gp0:#f6a6a6; --gp1:#fac7c7; --gp2:#fde4e4; --gp3:#eef2f8;
  --gp4:#dcf3e5; --gp5:#b6e7c9; --gp6:#8ddcae;
}
body.dark-mode{
  --gp0:#7a2430; --gp1:#5a1e28; --gp2:#3a1820; --gp3:#1b2841;
  --gp4:#12301f; --gp5:#1a4a2c; --gp6:#236e3e;
}
.gp-t0{background:var(--gp0)} .gp-t1{background:var(--gp1)} .gp-t2{background:var(--gp2)}
.gp-t3{background:var(--gp3)} .gp-t4{background:var(--gp4)} .gp-t5{background:var(--gp5)}
.gp-t6{background:var(--gp6)}
.gp-wrap{display:flex; flex-direction:column; gap:18px}
.gp-u{font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--label-accent);
  vertical-align:3px; margin-left:8px; text-transform:none}
.bc-top>.ex-unit{margin-left:auto}
.bc-top>.ex-unit ~ .ex-view{margin-left:0}
.gp-bh{
  font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase;
  color:var(--label-accent); margin-bottom:7px;
}
.gp-grid{
  display:grid; gap:3px;
  grid-template-columns:54px 66px repeat(var(--gp-cols),minmax(52px,1fr)) minmax(150px,1.5fr);
  align-items:stretch;
}
.gp-h{
  font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-mute); display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:4px;
}
.gp-hc{color:var(--text); font-size:12px; letter-spacing:.04em}
.gp-ht{justify-content:flex-start; padding-left:6px}
.gp-r1{font-size:12px; font-weight:800; color:var(--text); display:flex; align-items:center}
.gp-r2{font-size:11px; font-weight:700; color:var(--text-dim); display:flex; align-items:center}
.gp-c{
  display:flex; align-items:center; justify-content:center; min-height:38px;
  border-radius:8px; font-size:13px; font-weight:800; color:var(--text);
  font-variant-numeric:tabular-nums; cursor:help;
  transition:transform .12s ease, box-shadow .12s ease;
}
.gp-c:hover{transform:scale(1.04); box-shadow:0 0 0 2px var(--card), 0 2px 8px rgba(12,22,38,.2)}
/* Satir toplami: uzunluk kanali. Cubuk = gerceklesen, cizgi = plan. */
.gp-tot{display:flex; align-items:center; gap:9px; padding-left:6px}
.gp-bar{
  position:relative; flex:1 1 auto; height:9px; border-radius:999px;
  background:var(--track); min-width:60px;
}
.gp-bar i{
  position:absolute; left:0; top:0; bottom:0; border-radius:999px; min-width:3px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--valeo-mid) 55%,#fff),var(--valeo-mid));
}
.gp-bar u{
  position:absolute; top:-4px; bottom:-4px; width:2px; border-radius:2px;
  background:var(--text); opacity:.6;
}
.gp-tv{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; min-width:52px; text-align:right}
.gp-pos{color:var(--good-line)} .gp-neg{color:var(--bad-line)}
.gp-legend{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:16px;
  font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-mute);
}
.gp-scale{display:inline-flex; gap:2px}
.gp-scale i{width:22px; height:11px; border-radius:3px; display:inline-block}
.gp-note{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:600}
@media (max-width:900px){
  .gp-grid{grid-template-columns:44px 56px repeat(var(--gp-cols),minmax(40px,1fr)); }
  .gp-ht,.gp-tot{display:none}
  .gp-c{font-size:12px; min-height:34px}
}
@media (prefers-reduced-motion:reduce){ .gp-c{transition:none} }

/* ---------- yonetim matrisi ----------
   24 deger sutunu var; dar ekranda yatay kayar, satir basliklari yapisik
   kalir ki hangi satira baktigin kaybolmasin. */
.mx-panel{margin-bottom:22px}
/* Yatay kaydirma kabi: yapisik sutunlar kabin SOL KENARINA yapisir, o
   yuzden kapta yan bosluk olmamali -- negatif margin + padding denemesinde
   kayan hucreler yapisik sutunun solundan sizip goruluyordu. */
.mx-wrap{overflow-x:auto}
.mx{border-collapse:separate; border-spacing:0; width:100%; font-variant-numeric:tabular-nums}
.mx th,.mx td{white-space:nowrap}
.mx-corner{background:var(--card); position:sticky; left:0; z-index:3}
.mx-ro{
  font-size:13px; font-weight:800; letter-spacing:.06em; color:var(--text);
  padding:7px 10px; text-align:center;
  background:var(--sunken); border-bottom:1px solid var(--border);
  border-left:2px solid var(--card);
}
.mx-sub{
  font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--label-accent); padding:5px 10px; text-align:right;
  background:var(--sunken); border-bottom:1px solid var(--border-strong);
}
.mx-ro.mx-tot,.mx-sub.mx-tot{background:color-mix(in srgb,var(--valeo-mid) 12%,var(--sunken))}
/* Yapisik hucrelerin ARDI SAYDAM OLMAMALI: kayan degerler altindan
   goruluyordu. */
.mx-band th{
  text-align:left; font-size:10.5px; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:var(--label-accent);
  padding:13px 8px 6px; position:sticky; left:0; background:var(--card); z-index:2;
}
.mx-band{background:var(--card)}
.mx-rh,.mx-rh2,.mx-corner{background:var(--card)}
/* Yapisik blogun bittigi yer gorunsun. */
.mx-rh2,.mx-rh[colspan="2"]{box-shadow:1px 0 0 var(--border)}
.mx-unit{font-weight:700; color:var(--text-mute); letter-spacing:.04em; text-transform:none}
/* Iki baslik sutununun genisligi SABIT: yapisik (sticky) ikinci sutunun
   sol konumu birincinin genisligine esit olmali, yoksa uzun bir etiket
   (ornegin "OI") ikinci sutunu ilk deger hucresinin uzerine bindiriyordu
   ("16.81" -> ".6.81" olarak goruldu). */
.mx-rh{
  width:62px; min-width:62px; box-sizing:border-box;
  font-size:12px; font-weight:800; color:var(--text); text-align:left;
  padding:6px 8px; position:sticky; left:0; background:var(--card); z-index:2;
}
.mx-rh2{
  width:74px; min-width:74px; box-sizing:border-box;
  font-size:11.5px; font-weight:700; color:var(--text-dim); text-align:left;
  padding:6px 10px 6px 0; position:sticky; left:62px; background:var(--card); z-index:2;
}
.mx-corner{width:136px; min-width:136px}
.mx-v{
  font-size:12.5px; font-weight:700; color:var(--text); text-align:right;
  padding:6px 10px; border-top:1px solid var(--border);
}
.mx-dim{color:var(--text-mute); font-weight:600}
/* Slayttaki kirmizi: YTD Real, B1 YTD'nin altinda. Renk tek isaret degil --
   hucrenin title'i de "B1 YTD'nin gerisinde" diyor. */
.mx-late{
  background:var(--bad-bg); color:var(--bad); font-weight:800;
  box-shadow:inset 0 0 0 1px var(--bad-line);
}
.mx-grp .mx-v,.mx-grp .mx-rh,.mx-grp .mx-rh2{border-top:1px solid var(--border-strong)}
.mx-sum .mx-v{font-weight:800; background:var(--sunken)}
/* Tipi girilmemis satiri: kaynaktaki tutarsizligi gosterir, "normal" bir
   kategori degil -- bu yuzden soluk ve italik. */
.mx-un .mx-v,.mx-un .mx-rh{color:var(--text-mute); font-style:italic; font-weight:600}
.mx-sum .mx-rh{font-weight:800}
.mx tbody tr:hover .mx-v{background:color-mix(in srgb,var(--valeo-mid) 7%,transparent)}
.mx tbody tr:hover .mx-late{background:var(--bad-bg)}

/* ---------- kirilim anahtari (is kolu <-> RO) ----------
   Ayri bir satir degil: ilk kartin UST ETIKETININ yerinde duruyor -- o
   etiket zaten kirilim adiydi. Iki ucunda da kirilim adi yazili (aktif olan
   vurgulu) ve yanindaki kisa cumle neye gecilecegini soyluyor. */
.scope-sw{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.scope-l{
  font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-mute); transition:color .15s ease;
}
.scope-l.on{color:var(--label-accent)}
.scope-hint{font-size:10.5px; font-weight:600; color:var(--text-mute); letter-spacing:.02em}
.scope-hint b{font-weight:800; color:var(--text-dim)}
.sw{
  position:relative; width:40px; height:22px; flex:none; cursor:pointer; padding:0;
  border-radius:999px; border:1px solid var(--border-strong); background:var(--sunken);
  transition:background .18s ease, border-color .18s ease;
}
.sw:hover{border-color:var(--label-accent)}
.sw:focus-visible{outline:none; box-shadow:var(--ring)}
.sw-k{
  position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(12,22,38,.35);
  transition:transform .18s ease;
}
.sw[aria-checked="true"]{background:linear-gradient(180deg,#0a7ddb,#0060b4); border-color:#0060b4}
.sw[aria-checked="true"] .sw-k{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){ .sw,.sw-k,.scope-l{transition:none} }

/* Iki OLCU = iki KART. Tek cercevede "OI (M€)" ve "Project Qty" ayni
   baslik altinda duruyordu; birim farki ancak kucuk bir alt etiketten
   okunuyordu. Benchmark (PatternFly, stan.vision, DataCamp): bir kart bir
   kavram; farkli olcekli seriler ayri panellere bolunur. */
.bc-pair{display:grid; gap:22px; margin-bottom:22px}
.bc-pair-family{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.bc-pair-ro{grid-template-columns:repeat(auto-fit,minmax(min(100%,720px),1fr))}
.bc-pair>*{min-width:0}
/* Izgara icinde kartin kendi alt bosluguna gerek yok; ikisi ayni yukseklikte. */
.bc-pair .bc-panel{margin-bottom:0; height:100%; display:flex; flex-direction:column;
  container-type:inline-size}
.bc-pair .bc-wrap{aspect-ratio:620/265}
/* Izgara tek sutuna dustugunde kart tum satiri kapliyor ve ayni oranla
   grafik ~550px'e uzuyordu. Kap sorgusu, medya sorgusunun bilemedigi
   sutun sayisini bilir: genis kartta cizim alani sinirlanip ortalaniyor.
   (Oran SVG viewBox'iyla ayni kalmali; degistirilirse SVG mektup-kutusuna
   dusup cubuklar ortada daraliyor -- onizlemede goruldu.) */
/* width:100% SART: margin:0 auto bir esnek ogede otomatik kenar bosluguyla
   birlikte "germe"yi iptal ediyor ve kutu icerige gore daraliyordu -- genis
   kartta cizim alani 1388px yerine 792px kaliyor, cubuklar inceliyordu
   (olculdu). */
.bc-body{min-width:0; width:100%}
@container (min-width:1000px){ .bc-body{max-width:980px; margin:0 auto} }
.bc-wrap svg{width:100%; height:100%; display:block; overflow:visible}
.bc-ax{font-size:11px; fill:var(--text-mute); font-weight:600}
.bc-grid{stroke:var(--border); stroke-width:1}
.bc-track{fill:var(--sunken); fill-opacity:.55}
.bc-hit{fill:transparent}
.bc-v{font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums}
/* Yazi seri rengini GIYMEZ: deger etiketleri metin tokeninde kalir,
   kimligi yanlarindaki renkli cubuk tasir. Seri rengine boyanmislardi. */
.bc-v0,.bc-v1,.bc-v2{fill:var(--text-mute)}
.bc-v2{fill:var(--text)}
.bc-g{cursor:pointer}
.bc-g:hover rect:not(.bc-hit){filter:brightness(1.08)}
.bc-g:hover .bc-hit{fill:var(--sunken); fill-opacity:.55}

/* halka listesindeki TOPLAM satiri (referans panodaki gibi) */

/* uc halka — hepsi tiklanabilir filtre */

/* ---------- ust yonetim gorunumu ----------
   Mudurun uc slaytinin ekran karsiligi. Slayttaki 24 sutunluk matris yerine
   RO basina TEK hucre (GAP) + hucre icinde kucuk "gerceklesen/plan" satiri:
   "nerede sorun var" sorusu bakisla cevaplaniyor, renk yogunlugu da sapmanin
   buyuklugunu tasiyor. Renk TEK basina anlam tasimiyor (WCAG): isaret ve
   sayi da hucrede. */
.xg-v.good{color:var(--good)} .xg-v.bad{color:var(--bad)}
