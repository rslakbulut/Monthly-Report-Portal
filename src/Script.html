/* Asya/Amerika icin resmi bir bayrak yok — o bolgeler icin, acilis
   ekranindaki ayni kara verisinden (WORLD_MAP) uretilen minik bolge
   haritasi kullaniliyor. Avrupa AB bayragini, Cin kendi bayragini alir. */
var REGION_BOX={ ASIA:[55,150,58,-12], AMERICAS:[-170,-32,72,-56] };
function regionChip(reg,color,w){
  var box=REGION_BOX[reg]; if(!box||!window.WORLD_MAP) return '';
  var lon0=box[0],lon1=box[1],lat1=box[2],lat0=box[3];
  var s='<rect width="20" height="14" rx="0" fill="#0c2140"/>';
  var c0=Math.max(0,Math.round((lon0-WORLD_MAP.lon0)/WORLD_MAP.step));
  var c1=Math.min(WORLD_MAP.cols-1,Math.round((lon1-WORLD_MAP.lon0)/WORLD_MAP.step));
  var r0=Math.max(0,Math.round((WORLD_MAP.lat0-lat1)/WORLD_MAP.step));
  var r1=Math.min(WORLD_MAP.rows-1,Math.round((WORLD_MAP.lat0-lat0)/WORLD_MAP.step));
  var cw=20/Math.max(1,(c1-c0)), chh=14/Math.max(1,(r1-r0));
  for(var r=r0;r<=r1;r++){
    for(var c=c0;c<=c1;c++){
      if(WORLD_MAP.bits.charAt(r*WORLD_MAP.cols+c)!=='1') continue;
      s+='<rect x="'+((c-c0)*cw).toFixed(2)+'" y="'+((r-r0)*chh).toFixed(2)+
         '" width="'+Math.max(.6,cw*.72).toFixed(2)+'" height="'+Math.max(.6,chh*.72).toFixed(2)+
         '" fill="currentColor"/>';
    }
  }
  /* Noktalar RO renginde — boylece Asya ve Amerika rozetleri birbirinden
     ayirt ediliyor (ikisi de ayni acik maviyle cizilince benzer duruyordu). */
  w=w||22; var h=Math.round(w*0.7);
  return '<span class="flag" style="width:'+w+'px;height:'+h+'px;color:'+(color||'#7fd4ff')+'">'+
    '<svg viewBox="0 0 20 14" width="'+w+'" height="'+h+'" aria-hidden="true">'+s+'</svg></span>';
}
var RO_REGION={PAS:'ASIA',PDA:'AMERICAS',PDC:'CN',PDE:'EU',PTA:'AMERICAS',PTC:'CN',PTE:'EU'};
/* Boy disaridan verilebiliyor: aile grafigindeki uye RO cipleri 10px'lik
   kucuk rozetler, 22px'lik bayrak oraya sigmiyor. */
function roRegionChip(ro,w){
  var reg=RO_REGION[ro];
  if(reg==='EU'||reg==='CN') return flagChip(reg,w||22);
  return regionChip(reg,roColor(ro),w);
}

var LANG='en', LOCALE='en-US';
function t(k){ var d=T[LANG]||T.en; return (d[k]!=null?d[k]:(T.en[k]!=null?T.en[k]:k)); }
function langMeta(code){
  for(var i=0;i<LANGS.length;i++){ if(LANGS[i][0]===code) return LANGS[i]; }
  return LANGS[0];
}
function applyLang(code){
  var m=langMeta(code);
  LANG=m[0]; LOCALE=m[3];
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  try{ localStorage.setItem('roDashLang',LANG); }catch(e){}
  $('langLabel').innerHTML=flagChip(m[2],18)+'<span>'+LANG.toUpperCase()+'</span>';
  $('btnLang').setAttribute('title',t('language'));
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent=t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    el.setAttribute('placeholder',t(el.getAttribute('data-i18n-ph')));
  });
  buildLangMenu();
  /* ay adlari da dile bagli — donem secicisini secimi koruyarak yeniden kur */
  if(BOOT&&BOOT.periods&&BOOT.periods.length&&DATA&&DATA.period) buildPeriodSelects(DATA.period.key);
  if(DATA){ buildFilterSegs(); buildRoSiteSelects(); render(); }
}
function buildLangMenu(){
  $('langMenu').innerHTML=LANGS.map(function(l){
    return '<button type="button" role="option" data-lang="'+l[0]+'" aria-selected="'+(l[0]===LANG)+'">'+
      flagChip(l[2],20)+esc(l[1])+'</button>';
  }).join('');
  $('langMenu').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ applyLang(b.getAttribute('data-lang')); closeLangMenu(); };
  });
}
function closeLangMenu(){ $('langMenu').hidden=true; $('btnLang').setAttribute('aria-expanded','false'); }
function initLang(){
  var saved=null; try{ saved=localStorage.getItem('roDashLang'); }catch(e){}
  if(!saved){
    var nav=(navigator.language||'en').slice(0,2).toLowerCase();
    saved=T[nav]?nav:'en';
  }
  applyLang(saved);
  $('btnLang').onclick=function(e){
    e.stopPropagation();
    var open=$('langMenu').hidden;
    $('langMenu').hidden=!open;
    $('btnLang').setAttribute('aria-expanded',String(open));
  };
  document.addEventListener('click',function(){ if(!$('langMenu').hidden) closeLangMenu(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLangMenu(); });
}

/* ---------- kullanici cipi ----------
   Ad e-postadan turetiliyor (Feedback.gs). Gosterim Valeo duzeninde:
   ad normal, SOYAD buyuk harf. Ikinci satir once e-posta; kisi bir site'in
   HUMAN RESOURCES bolumunde bulunursa "RO · Site" ile degistiriliyor. */
function formatUserName(name){
  var parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  return parts.map(function(p,i){
    /* toUpperCase (toLocale... degil): Turkce i->I kurali soyadi bozmasin */
    return i===0?p:p.toUpperCase();
  }).join(' ');
}
function userInitials(name,email){
  var parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return String(email||'?').slice(0,2).toUpperCase();
}
/** "Bursa 1" -> "Bursa"  (kullanici talebi: sonunda rakam olmasin) */
function siteShortName(site){
  return String(site||'').replace(/\s*\d+\s*(\([^)]*\))?\s*$/,'').trim()||String(site||'');
}
/** Kullaniciyi site sayfalarindaki HUMAN RESOURCES listesinde arar. */
/* Site tespiti: ONCE Google dizinindeki konum (kalici kaynak), olmazsa site
   sayfalarindaki HUMAN RESOURCES listesinde ad eslesmesi.
   Sira bilincli: HR bolumu ileride ISIM degil yalniz CALISAN SAYISI tutacak
   (kullanici bildirimi), yani o eslesme zamanla kendiliginden devre disi
   kalacak. Kod o gun geldiginde kirilmiyor — sadece bu dal bos donuyor. */
function findUserSite(){
  var g=BOOT&&BOOT.user&&BOOT.user.siteGuess;
  if(g) return {ro:g.ro,site:g.site};
  return findUserSiteInHR();
}
function findUserSiteInHR(){
  if(!DATA||!DATA.hasDetails||!BOOT||!BOOT.user||!BOOT.user.name) return null;
  var want=BOOT.user.name.toLowerCase().replace(/[^a-z]/g,'');
  if(want.length<5) return null;
  var hit=null;
  (DATA.sites||[]).some(function(st){
    return (st.hrRoles||[]).some(function(r){
      var p=String(r.person||'').toLowerCase().replace(/[^a-z]/g,'');
      if(p && p===want){ hit=st; return true; }
      return false;
    });
  });
  return hit;
}
/* Ikinci satir: unvan ve RO-Site. Hicbiri bulunamazsa satir HIC GOSTERILMEZ —
   yalniz ad soyad kalir (kullanici karari). E-posta yer kaplamasin diye
   ipucu (tooltip) olarak duruyor. */

function renderUserChip(){
  if(!BOOT||!BOOT.user||!BOOT.user.email){ $('userChip').hidden=true; return; }

     (kullanici geri bildirimi). Eksik olan satir hic render edilmez. */
  setChipLine('ucSub', u.title ? esc(u.title) : '');
  setChipLine('ucSite', site ? esc(site.ro+'-'+siteShortName(site.site)) : '');
  $('userChip').title=u.email;

/* ---------- aggregation ---------- */
function statusMatches_(blockStatus){ return F.status==='ALL' || blockStatus===F.status; }
function realizedOf(site){
  var out=emptyM();
  if(!site.detail||!site.detail.blocks) return out;
  site.detail.blocks.forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(F.customer!=='ALL' && b.customer!==F.customer) return;
    if(F.type==='ALL'){ addM(out,b.total); }
    else if(b.byType&&b.byType[F.type]){ addM(out,b.byType[F.type]); }
  });
  return out;
}
function budgetRowKey(){
  if(F.customer!=='ALL') return F.customer;
  if(F.type!=='ALL') return F.type;
  return 'TOTAL';
}
function pickStatus_(obj){
  if(!obj) return null;
  if(F.status==='ALL') return (typeof obj.NEW==='number'?obj.NEW:0)+(typeof obj.REMAN==='number'?obj.REMAN:0);
  return (obj[F.status]!=null?obj[F.status]:null);
}
function budgetOf(site){
  var k=budgetRowKey();
  var bc=site.budgetCount&&site.budgetCount[k];
  var by=site.budgetYTDCount&&site.budgetYTDCount[k];
  var bt=site.budgetTurnover&&site.budgetTurnover[k];
  return { count:pickStatus_(bc), ytdCount:pickStatus_(by), turnover:pickStatus_(bt) };
}
/* Budget YTD CIROSU: resmi kaynak "LS OI <yil>" sayfasidir (kullanici
   karari). Orada tek bir toplam var; NEW/REMAN, P1/P10/TTM veya VS/OES
   kirilimi YOK. Bu yuzden yalniz kirilim filtresi KAPALIYKEN kullanilir;
   bir filtre acikken o filtreye ait plan degeri ancak detay tablolarindan
   cikarilabilir ve oraya dusulur. Sayfa yoksa da ayni yedek calisir. */
function planTurnoverMOf(site,r){
  var unfiltered=(F.status==='ALL'&&F.type==='ALL'&&F.customer==='ALL');
  if(unfiltered&&typeof site.budgetYtdOI==='number') return site.budgetYtdOI;
  return r.planYtdTurnover/1000;
}
/* GERCEKLESEN degerlerin kaynagi (kullanici karari): site sayfasindaki
   Bolum 3 "Launch Done (L.S sent)" cirosu ve Bolum 4 "Real Launches" adedi.
   Manuel rapor bu sutunlari kullaniyor; detaydan proje sayarak uretilen
   degerler onlarla tutmuyordu.
   Bolum 3'te yalniz TOTAL/VS/OES satirlari var; P1/P10/TTM filtresi acikken
   ciroyu o tablodan alamayiz, detaydan hesaplanana dusulur. Adet tarafinda
   Bolum 4'te P1/P10/TTM de var, oradan okunur. */
function sheetRealOf(site){
  var k=budgetRowKey();
  var rc=site.realCountSheet&&site.realCountSheet[k];
  var rt=site.launchDoneTurnover&&site.launchDoneTurnover[k];
  return { count:pickStatus_(rc), turnoverM:pickStatus_(rt) };
}
function siteMetrics(site){
  var b=budgetOf(site), r=realizedOf(site), sh=sheetRealOf(site);
  return {
    budgetCount:b.count, budgetYTD:b.ytdCount, budgetTurnover:b.turnover,
    realCount:(sh.count!=null)?sh.count:r.ytdCount,
    realTurnoverM:(sh.turnoverM!=null)?sh.turnoverM:(r.ytdTurnover/1000),
    planTurnoverM:planTurnoverMOf(site,r),
    portfolioCount:r.count, portfolioTurnoverM:r.turnover/1000,
    delta:(b.ytdCount==null)?null:(((sh.count!=null)?sh.count:r.ytdCount)-b.ytdCount),
    /* DENETIM BULGUSU: eskiden plan 0 ise null donuyordu, yani "plani 0
       olan ama launch etmis" site ciro gorunumunde "n/a" goruluyordu --
       ayni site adet gorunumunde gercek sayiyi gosteriyordu (47 site'in
       7'sinde olculdu). 0 bir BILINMEYEN degil, bilinen bir degerdir;
       fark her zaman hesaplanir. Site'in hic verisi yoksa (bilinmeyen)
       adet tarafiyla AYNI kapi kullanilir. */
    /* Sapma da ayni plan kaynagini kullanmali; aksi halde ekranda gosterilen
       Budget YTD ile sapmanin dayandigi plan farkli olurdu. */
    deltaTurnoverM:(b.ytdCount==null)?null:
      (((sh.turnoverM!=null)?sh.turnoverM:(r.ytdTurnover/1000))-planTurnoverMOf(site,r))
  };
}
function sumMetrics(list){
  var acc={budgetCount:0,budgetYTD:0,budgetTurnover:0,realCount:0,realTurnoverM:0,
           planTurnoverM:0,portfolioTurnoverM:0,portfolioCount:0,behind:0,reported:0,headcount:0};
  list.forEach(function(s){
    var m=siteMetrics(s);
    ['budgetCount','budgetYTD','budgetTurnover','realCount','realTurnoverM','planTurnoverM',
     'portfolioTurnoverM','portfolioCount']
      .forEach(function(k){ if(m[k]!=null) acc[k]+=m[k]; });
    acc.headcount+=s.headcount||0;
    if(m.delta!=null&&m.delta<0) acc.behind++;
    if(s.status!=='no-data') acc.reported++;
  });
  acc.delta=(acc.realCount||0)-(acc.budgetYTD||0);
  return acc;
}
function sitesOfRo(ro){ return (DATA.sites||[]).filter(function(s){ return s.ro===ro; }); }
function siteKey(s){ return s.key||s.sheet; }
/* Aktif RO/site secimine gore daraltilmis site listesi — tum ekran bunun uzerinden
   hesaplanir. Secim yoksa tum site'lar. */
function scopedSites(){
  var list=DATA.sites||[];
  if(F.ro!=='ALL') list=list.filter(function(s){ return s.ro===F.ro; });
  if(F.site!=='ALL') list=list.filter(function(s){ return siteKey(s)===F.site; });
  return list;
}
function totalHeadcount(){

/* Serbest metin aramasi: site adi, sayfa adi, RO kodu ve RO adi. */
function searchHits(q){

}

function sparkline(vals, target){
  var pts=vals.filter(function(v){ return v!=null; });
  if(pts.length<2) return '<span style="color:var(--text-mute);font-size:13px">—</span>';
  var W=150,H=40,P=4;
  var all=pts.concat(target!=null?[target]:[]);
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  if(mx===mn){ mx=mn+1; }
  var x=function(i){ return P+i*(W-2*P)/(pts.length-1); };
  var y=function(v){ return H-P-(v-mn)/(mx-mn)*(H-2*P); };
  var d=pts.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="last '+pts.length+' months, latest '+nf(last,2)+'">'+
    (target!=null?'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+
      '" stroke="var(--text-mute)" stroke-width="1" stroke-dasharray="3 3"/>':'')+
    '<path d="'+d+'" fill="none" stroke="var(--valeo-mid)" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="3.6" fill="var(--valeo-mid)" '+
      'stroke="var(--card)" stroke-width="2"/>'+
  '</svg>';
}

function scopeLabel(){

}
function renderSelStrip(){
  var el=$('selStrip'); if(!el) return;

  if(F.ro!=='ALL')       out+=chip('ro','RO',F.ro+' · '+(BOOT.roLabels[F.ro]||''));
  if(F.site!=='ALL')     out+=chip('site',t('site'),scopeLabel());
  if(F.status!=='ALL')   out+=chip('status',t('productType'),F.status);
  if(F.type!=='ALL')     out+=chip('type',t('projectType'),F.type);
  if(F.customer!=='ALL') out+=chip('customer',t('customer'),F.customer);

    '<button class="selclear" type="button" data-clear="all">'+esc(t('clear'))+'</button>';

      else F[k]='ALL';

      $('inpSearch').value=F.q;

/* ---------- TOPS: en buyuk cirolu projeler ----------
   Kaynak: "2026 VS/OES Current Portfolio" tablolarindaki Model / Segment /
   Launch Sheet Date / Turnover (k€) sutunlari (kullanici tarifi). Ciro burada
   sayfanin kendi birimiyle (k€) gosterilir — proje basina M€ tek ondalikta
   hepsini 0.0 yapardi. */
function topProjectsOf(list,limit){
  var out=[];
  list.forEach(function(st){
    (st.topProjects||[]).forEach(function(p){
      if(!statusMatches_(p.status)) return;
      if(F.customer!=='ALL'&&p.customer!==F.customer) return;
      if(F.type!=='ALL'&&p.type!==F.type) return;
      out.push({p:p,site:st});
    });
  });
  out.sort(function(a,b){ return (b.p.turnover||0)-(a.p.turnover||0); });
  return out.slice(0,limit||12);
}
function topProjectsPanel(list,showSite,limit){
  var rows=topProjectsOf(list,limit);
  var head='<h3>'+esc(t('topProjects'))+' <span class="p-note" lang="en">O.I (k€)</span></h3>';
  if(!rows.length){
    /* Agir yari arka planda geliyor — "proje yok" demek yaniltici olurdu. */
    var msg=(DATA&&!DATA.hasDetails)?t('loadingDetails'):t('noProjects');
    return '<div class="panel tops">'+head+'<p class="empty">'+esc(msg)+'</p></div>';
  }
  var html='<div class="panel tops">'+head+
    '<div class="tops-head'+(showSite?' with-site':'')+'">'+
      '<span>Model · Ref</span><span>'+esc(t('segment'))+'</span>'+
      (showSite?'<span>'+esc(t('site'))+'</span>':'')+
      '<span class="r">'+esc(t('planCol'))+'</span><span class="r">'+esc(t('realCol'))+'</span>'+
      '<span class="r" lang="en">O.I</span></div>';
  rows.forEach(function(r){
    var p=r.p, launched=!!p.realMonth;
    html+='<div class="tops-row'+(showSite?' with-site':'')+'" style="--ro-color:'+roColor(r.site.ro)+'">'+
      /* Proje referansi (kullanici talebi). Ayri bir sutun yerine model
         adinin ALTINDA: sag panel 5 sutunda zaten dar, altinci sutun
         sigmiyordu; alt satir her genislikte okunuyor. */
      '<span class="tp-model"><span class="tp-m1"><b>'+esc(p.model||'—')+'</b>'+
        (p.type?'<i class="tp-type">'+esc(p.type)+'</i>':'')+'</span>'+
        (p.ref?'<span class="tp-ref">Ref '+esc(p.ref)+'</span>':'')+'</span>'+
      '<span class="tp-seg">'+esc(p.segment||'—')+'</span>'+
      (showSite?'<span class="tp-site">'+esc(r.site.site)+'</span>':'')+
      '<span class="r dim">'+esc(p.planRaw||'—')+'</span>'+
      '<span class="r '+(launched?'ok':'dim')+'">'+esc(p.realRaw||'—')+'</span>'+
      '<span class="r tp-oi">'+nf(p.turnover,1)+'</span>'+

  });
  return html+'</div>';
}

/* ---------- level 1: RO karsilastirma kartlari ---------- */
/* Bar olcegi = bu RO'nun kendi Budget Year cirosu (%100). KPI degerleri
   barin ICINDE degil, sagda ayri okunabilir bloklarda (kullanici talebi). */
/* Tek bir ilerleme cubugu: gerceklesen dolgusu + plan (Budget YTD) isareti.
   Once yalniz CIRO icin vardi; kullanici ayni gosterimi PROJE ADEDI icin de
   istedi (geri bildirim #2) -- ayni fonksiyon iki birimde de kullaniliyor,
   iki ayri cizim kodu olusmasin. */
function roBar(real, plan, budget, opts){
  var o=opts||{};
  var scale=budget>0?budget:1;
  var w=clamp01(real/scale)*100;
  var p=(plan>0)?clamp01(plan/scale)*100:null;
  var planTitle='Budget YTD '+(o.money?esc(m2(plan))+' M€':nf(plan)+' '+t('projects'));
  return '<span class="bar'+(o.small?' bar-sm':'')+'">'+
    '<span class="bar-fill" style="width:'+w.toFixed(1)+'%"></span>'+
    /* Isaretin adi ISARETIN USTUNDE, barin icinde (kullanici talebi).
       Uctaki isaretlerde yazi kutudan tasmasin diye hiza siniflari var. */
    (p!=null?'<span class="bar-plan'+(p<14?' at-start':(p>86?' at-end':''))+
      '" style="left:'+p.toFixed(1)+'%" title="'+planTitle+'">'+
      '<b>Budget YTD</b></span>':'')+
  '</span>';
}

/* Bir satirin govdesi: iki cubuk (ciro + adet) ve ucu de iki birimli
   LAUNCH DONE / BUDGET YTD / BUDGET YEAR bloklari. Hem RO satirlari hem
   TOPLAM satiri bunu kullanir -- toplam satiri "farkli bir sey" gibi
   gorunmesin, ayni dille okunsun. */

         (YTD/Year sanildi). Oran: Launch Done / Budget Year -- ikisi de
         sayfa terimi, cevrilmiyor. */
      '<span class="ro-ratio"><span class="ro-pct">'+(pctMoney==null?'—':pctMoney+'%')+'</span> '+
        '<span class="ro-plan-note">Launch Done / Budget Year · O.I</span></span>'+
      '<span class="ro-delta"><span class="ro-delta-l">Launch Delay</span>'+
        deltaPill(a.delta,t('projects'))+'</span>'+
    '</span>'+
    roBar(a.realTurnoverM, a.planTurnoverM, a.budgetTurnover, {money:true})+
    /* Ikinci satir ADET: para once, adet sonra (panonun genel kurali). */
    '<span class="ro-bar-top second">'+
      '<span class="ro-ratio"><span class="ro-pct sm">'+(pctCount==null?'—':pctCount+'%')+'</span> '+
        '<span class="ro-plan-note">Real Launches / Budget Year · '+esc(t('projects'))+
        '</span></span>'+
    '</span>'+
    roBar(a.realCount, a.budgetYTD, a.budgetCount, {money:false, small:true})+
  '</span>'+
  '<span class="ro-stats">'+
    roStat('Launch Done', moneyTag(a.realTurnoverM), nf(a.realCount)+' '+t('projects'), true)+
    roStat('Budget YTD', moneyTag(a.planTurnoverM), nf(a.budgetYTD)+' '+t('projects'), false)+
    roStat('Budget Year', moneyTag(a.budgetTurnover), nf(a.budgetCount)+' '+t('projects'), false)+
  '</span>';
}

/* Site listesi — Excel tablosu degil, kart-satir listesi. Status sutunu
   kullanici talebiyle kaldirildi (durum bilgisi site detayinda duruyor). */
function tblCell(countVal,moneyVal){ return F.tableView==='money' ? money(moneyVal) : nf(countVal); }
function siteListHtml(list,ro){
  var rows=list.map(function(s,i){ return {s:s,m:siteMetrics(s),i:i}; });
  rows.sort(function(a,b){
    var av=(a.m.delta==null?9999:a.m.delta), bv=(b.m.delta==null?9999:b.m.delta);
    return av-bv;   // en geride olan once
  });
  var isMoney=F.tableView==='money';
  var html='<div class="ro-expand" style="--ro-color:'+roColor(ro)+'">'+
    '<div class="tbl-toggle"><span class="flabel">'+esc(t('tableShows'))+'</span>'+
      '<div class="seg seg-sm" id="segTblView">'+
      /* Once PARA, sonra adet: ust yonetim ekranlarinda ciro basta gelir,
         proje adedi ayrintidir (kullanici kurali). Varsayilan gorunum de
         bu yuzden O.I. */
      '<button type="button" data-tv="money" aria-pressed="'+isMoney+'" lang="en">O.I (M€)</button>'+
      '<button type="button" data-tv="count" aria-pressed="'+(!isMoney)+'" lang="en">'+esc(t('execQty'))+'</button>'+
    '</div></div>'+
    '<div class="site-head">'+
      '<span>'+esc(t('site'))+'</span><span>Real Launches / Budget YTD</span>'+
      '<span class="r">Budget Year</span><span class="r">Budget YTD</span>'+
      '<span class="r">Real Launches</span><span class="r">Launch Delay</span>'+
    '</div><div class="sitelist">';
  rows.forEach(function(r){
    var m=r.m;
    var base=isMoney?m.planTurnoverM:m.budgetYTD;
    var got=isMoney?m.realTurnoverM:m.realCount;
    var w=(base>0)?clamp01(got/base)*100:0;
    var cap=(base>0)?(isMoney?m2(got)+' / '+m2(base)+' M€':nf(got)+' / '+nf(base))+' · '+Math.round(w)+'%'
                    :(isMoney?m2(got)+' M€':nf(got));
    html+='<button class="site-row" type="button" data-i="'+r.i+'">'+
      '<span class="site-name">'+(siteFlag(r.s)||'<i></i>')+'<span>'+esc(r.s.site)+'</span></span>'+
      '<span class="mini-meter">'+
        '<span class="mini-bar"><i style="width:'+w.toFixed(1)+'%"></i></span>'+
        '<span class="mini-cap">'+esc(cap)+'</span>'+
      '</span>'+
      '<span class="tbl-v r" data-label="Budget Year">'+tblCell(m.budgetCount,m.budgetTurnover)+'</span>'+
      '<span class="tbl-v r dim" data-label="Budget YTD">'+tblCell(m.budgetYTD,m.planTurnoverM)+'</span>'+
      '<span class="tbl-v r" data-label="Real Launches">'+tblCell(m.realCount,m.realTurnoverM)+'</span>'+
      '<span class="r" data-label="Launch Delay">'+
        (isMoney?deltaPill(m.deltaTurnoverM,'M€'):deltaPill(m.delta))+'</span>'+
    '</button>';
  });
  html+='</div></div>';
  return html;
}

function renderRoLevel(){
  var trail=[{t:t('allROs'), action:(F.ro==='ALL'&&F.site==='ALL')?null:function(){
    F.ro='ALL'; F.site='ALL'; NAV.expandedRo=null; buildRoSiteSelects(); }}];
  if(F.ro!=='ALL'){
    var roStep={t:F.ro+' — '+(BOOT.roLabels[F.ro]||'')};
    if(F.site!=='ALL') roStep.action=function(){ F.site='ALL'; buildRoSiteSelects(); };
    trail.push(roStep);
  }
  if(F.site!=='ALL') trail.push({t:scopeLabel()});
  crumb(trail);
  var scope=scopedSites();
  var q=F.q.trim();
  var rows=[];
  BOOT.roOrder.forEach(function(ro){
    var list=scope.filter(function(st){ return st.ro===ro; });
    if(!list.length) return;
    rows.push({ro:ro,list:list,a:sumMetrics(list)});
  });
  rows.sort(function(x,y){ return (x.a.delta||0)-(y.a.delta||0); });   // en geride olan once
  /* Tek RO secildiyse listesi kapali kalmasin */
  if(F.ro!=='ALL'&&!NAV.expandedRo) NAV.expandedRo=F.ro;

  var html=matchWarnBlock()+kpiRow(sumMetrics(scope));
  if(q){ html+=searchResultsHtml(searchHits(q))+noticeBlock(); }
  else {
    /* Panel artik kirilim filtresini KENDI tasiyor (halkalar F.status ve
       F.type'i sürüyor), o yuzden filtre acikken gizlenmiyor -- tersine,
       secili dilim vurgulanip geri kalan ekran ona gore daraliyor.
       Yalniz tek RO/site secilince gizleniyor: o kapsamin kendi ekrani
       zaten asagida. */
    if(F.ro==='ALL'&&F.site==='ALL') html+=execPanel();
    /* RO listesi katlanabilir (kullanici talebi): gormek isteyen acar,
       istemeyen kapali birakir. Secim tarayicida saklanir, her acilista
       tekrar kapatmak gerekmesin. Bir RO/site secilmisse zorla acilir --
       aksi halde secim hicbir sey gostermezdi. */
    var forced=(F.ro!=='ALL'||F.site!=='ALL');
    var open=forced||ROLIST.open;
    html+='<div class="section-head"><h2 class="section-title">'+esc(t('byRO'))+'</h2>'+
          '<span class="section-note">'+esc(open?t('clickRow'):t('roListHidden'))+'</span>'+
          (forced?'':'<button class="sect-toggle" type="button" id="btnRoList" '+
            'aria-expanded="'+open+'">'+esc(open?t('hide'):t('show'))+
            '<span class="st-ch" aria-hidden="true">'+ICON_CHEVRON+'</span></button>')+
          '</div>';
    if(open){
      html+='<div class="rolist">';
      rows.forEach(function(r){
        html+=roRowHtml(r);
        if(NAV.expandedRo===r.ro) html+=siteListHtml(r.list,r.ro);
      });
      html+=roTotalRowHtml(rows);
      html+='</div>';
    }
    if(F.ro!=='ALL') html+='<div class="panels one">'+topProjectsPanel(scope,F.site==='ALL')+'</div>';
    html+=noticeBlock();
  }
  $('view').innerHTML=html;
  /* Cross-filtering: halka dilimi ve legend satiri ayni secimi surer. Aile
     icin EX.fam, digerleri icin ZATEN VAR OLAN F.status / F.type -- yani
     halkaya tiklamak ust filtre barindaki dugmeye basmakla ayni sey, iki
     ayri "secili" durum olusmuyor. Ayni dilime tekrar tiklamak kaldirir. */
  $('view').querySelectorAll('[data-gapu]').forEach(function(b){
    b.onclick=function(){
      EXU.unit=b.getAttribute('data-gapu');
      try{ localStorage.setItem('roDashGapUnit',EXU.unit); }catch(e){}
      render();
    };
  });
  $('view').querySelectorAll('[data-exview]').forEach(function(b){
    b.onclick=function(){
      EXVIEW.mode=b.getAttribute('data-exview');
      try{ localStorage.setItem('roDashExecView',EXVIEW.mode); }catch(e){}
      render();
    };
  });
  var rl=$('view').querySelector('#btnRoList');
  if(rl) rl.onclick=function(){
    ROLIST.open=!ROLIST.open;
    try{ localStorage.setItem('roDashRoList',ROLIST.open?'1':'0'); }catch(e){}
    render();
  };
  /* Kirilim anahtari: iki karti birlikte cevirir. */
  var sw=$('view').querySelector('#btnScope');
  if(sw) sw.onclick=function(){
    EXM.mode=(EXM.mode==='ro')?'family':'ro';
    if(EXM.mode==='ro') EX.fam=null;   // is kolu secimi RO kiriliminda anlamsiz
    render();
  };
  /* Aile cubugu/etiketi EX.fam'i surer -- halkalardaki secimle AYNI durum,
     iki ayri "secili aile" olusmuyor. Ayni aileye tekrar tiklamak kaldirir. */
  $('view').querySelectorAll('[data-exfam]').forEach(function(g){
    g.onclick=function(){
      var v=g.getAttribute('data-exfam');
      EX.fam=(EX.fam===v)?null:v;
      render(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  $('view').querySelectorAll('.bc-lb[data-exro]').forEach(function(g){
    g.onclick=function(){
      F.ro=g.getAttribute('data-exro'); F.site='ALL'; NAV.expandedRo=F.ro;
      buildRoSiteSelects(); render(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  $('view').querySelectorAll('.bc-g[data-exro]').forEach(function(g){
    g.onclick=function(){
      F.ro=g.getAttribute('data-exro'); F.site='ALL'; NAV.expandedRo=F.ro;
      buildRoSiteSelects(); render(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  /* grafik cubuklari: RO seviyesinde RO'ya iner, site seviyesinde site detayina */
  $('view').querySelectorAll('.ch-row[data-ck]').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-ck');
      if(b.getAttribute('data-cl')==='ro'){
        F.ro=k; F.site='ALL'; NAV.expandedRo=k; buildRoSiteSelects(); render();
      } else { openSiteByKey(k); }
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  $('view').querySelectorAll('.search-row[data-sk]').forEach(function(b){
    b.onclick=function(){ openDrawer(b.getAttribute('data-sk')); };
  });
  $('view').querySelectorAll('.ro-row[data-ro]').forEach(function(b){
    b.onclick=function(){
      var ro=b.getAttribute('data-ro');
      NAV.expandedRo=(NAV.expandedRo===ro?null:ro);
      render();
    };
  });
  /* Site satiri artik once SAG PANELI aciyor (is arkadasi talebi: "site
     secilince sag panel acilsin"). Tam sayfa panelin altindaki dugmede. */
  $('view').querySelectorAll('.site-row[data-i]').forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      var ro=NAV.expandedRo, idx=parseInt(el.getAttribute('data-i'),10);
      var list=(ro?sitesOfRo(ro):[]).filter(function(st){ return scopedSites().indexOf(st)>-1; });
      var hit=list[idx]||sitesOfRo(ro)[idx];
      if(hit) openDrawer(siteKey(hit));
    };
  });
  $('view').querySelectorAll('#segTblView button').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); F.tableView=b.getAttribute('data-tv'); render(); };
  });
}

/* ---------- level 3: tek site ---------- */
function typeTotals(s,t2){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(b.byType&&b.byType[t2]) addM(acc,b.byType[t2]);
  });
  return acc;
}
function custTotals(s,c){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)||b.customer!==c) return; addM(acc,b.total);
  });
  return acc;
}
/* ---------- ust yonetim gorunumu (POWER Aftermarket raporu) ----------
   Mudurun top management'a sundugu uc slaytin ekran karsiligi:
     1) RO x proje tipolojisi matrisi (P1/P10/TTM x NEW/REMAN) + OI
     2) Aile toplamlari (POWER DRIVE / POWER THERMAL) ve GAP
     3) RO bazinda B1 YTD - Real YTD karsilastirmasi (adet ve OI)
   Slayttaki 24 sutunluk matris yerine her RO icin TEK hucre: GAP. Plan ve
   gerceklesen hucrenin ustunde yaziyor, renk de sapmayi tasiyor -- "nerede
   sorun var" sorusu 24 sutun kiyaslamadan cevaplaniyor.

   ONEMLI: buradaki hesaplar FILTRELERDEN BAGIMSIZ. budgetOf()/realizedOf()
   F.status/F.type/F.customer'a bakiyor; yonetim gorunumu her zaman NEW+REMAN
   ve tum tipleri gostermek zorunda, yoksa mudurun slaytiyla ayni sey olmaz. */

/* PAS = Power Asia, Power DRIVE grubunda (kullanici teyidi). */
var FAMILY={PDE:'DRIVE',PDC:'DRIVE',PDA:'DRIVE',PAS:'DRIVE',
            PTE:'THERMAL',PTC:'THERMAL',PTA:'THERMAL'};
var EXEC_TYPES=['P1','P10','TTM'];

function execZero(){ return {b1:0,ytd:0,real:0}; }
/* Butce tarafi: site.budgetCount/budgetYTDCount/budgetTurnover[satir] -> {NEW,REMAN} */
function execBudgetPick(site,row,status,field){
  var o=site[field]&&site[field][row];
  if(!o) return 0;
  if(status==='ALL') return (+o.NEW||0)+(+o.REMAN||0);
  return +o[status]||0;
}
/* Gerceklesen taraf: detay bloklarindan. type 'ALL' ise blogun toplami. */
function execRealSum(site,type,status,measure){
  var n=0;
  ((site.detail&&site.detail.blocks)||[]).forEach(function(b){
    if(status!=='ALL'&&b.status!==status) return;
    var m=(type==='ALL')?b.total:(b.byType&&b.byType[type]);
    if(m) n+=(+m[measure]||0);
  });
  return n;
}
/* Adet kupu: tip x durum. TTM bloklarinin status'u kaynakta hep NEW (Parser.gs
   forcedType), o yuzden TTM REMAN dogal olarak 0 -- slayttaki tek TTM satiri
   bununla ayni sey. */
function execCountCell(list,type,status){
  var c=execZero();
  list.forEach(function(st){
    c.b1  +=execBudgetPick(st,type,status,'budgetCount');
    c.ytd +=execBudgetPick(st,type,status,'budgetYTDCount');
    c.real+=execRealSum(st,type==='TOTAL'?'ALL':type,status,'ytdCount');
  });
  return c;
}
/* ---------- yonetim ekrani: ONCE CEVAP, SONRA DETAY ----------
   Ilk surumu bir analiz ekraniydi: her hucrede sayi, 63 hucrelik matris.
   Ust yonetim 10 saniyede "yolunda miyiz" sorusunun cevabini ariyor.
   Benchmark (ThoughtSpot, Sigma, Omni, Microsoft Learn):
     - Uzunluk insanin en hassas okudugu boyut; aci/alan en zayifi. Yani
       PLAN-GERCEKLESEN kiyasi pasta ile YAPILMAZ, cubukla yapilir.
     - Pasta/halka yalniz PARCA-BUTUN icin ve en fazla ~5 dilimle ise yarar.
       Bizim uc kirilimimiz 2, 2 ve 3 dilim -- tam da halkanin ise yaradigi yer.
     - Yonetim ekraninda 5-6 KPI, sayfada 4-6 gorsel.
     - Cross-filtering: bir gorsel digerlerini filtreler.
   Bu yuzden ekran: tek cumle + iki buyuk sayi -> uc halka (tiklaninca
   filtreler) -> siralanmis RO cubuklari. Matris silinmedi, "detay" dugmesinin
   arkasina alindi -- bilgi kaybi yok, yuz yuze gelme yok. */

var EX={fam:null};   // halkalarla secilen is kolu (digerleri F.status/F.type)

function execList(){
  return (DATA.sites||[]).filter(function(s){ return !EX.fam||FAMILY[s.ro]===EX.fam; });
}
function execTypeRow(){ return F.type==='ALL'?'TOTAL':F.type; }

/* ---------- gorunum birimi: OI (M€) / proje adedi ----------
   Acilista OI (kullanici karari). Tek dugmeyle adet gorunumune geciliyor;
   birim her grafigin basligindan okunuyor. */
/* Birim artik SECIM degil: iki grafik iki birimi birden gosteriyor.
   Kalan tek is, birim verilmeyen cagrilarda varsayilan olmak. */
var EXV={unit:'OI'};          // 'OI' | 'COUNT'
/* Grafik kirilimi: iki kart ayni anda ayni kirilimi gosterir. Onceden iki
   kirilim ALT ALTA duruyordu (dort kart); anahtar ikisini tek yere indirdi. */
var EXM={mode:'family'};      // 'family' | 'ro'
/* Gorunum: grafik mi, mudurun slaytindaki matris mi (kullanici talebi).
   Secim tarayicida saklaniyor. */
var EXVIEW={mode:'chart'};    // 'chart' | 'gap' | 'table'
/* Sapma matrisinin birimi: adet mi, ciro mu. */
var EXU={unit:'COUNT'};       // 'COUNT' | 'OI'
(function(){ try{ if(localStorage.getItem('roDashGapUnit')==='OI') EXU.unit='OI'; }catch(e){} })();
(function(){ try{ if(localStorage.getItem('roDashExecView')==='table') EXVIEW.mode='table'; }catch(e){} })();
/* RO listesi acik mi? Varsayilan KAPALI: grafikler ust yonetimin bakacagi
   yer, RO satirlari detay. Secim tarayicida saklaniyor. */
var ROLIST={open:false};
(function(){ try{ ROLIST.open=(localStorage.getItem('roDashRoList')==='1'); }catch(e){} })();

function execUnit(u){ return (u||EXV.unit)==='OI'?'M€':t('execQty'); }
/* Baslik rozeti secili dugmenin ETIKETININ AYNISINI gosterir ('OI (M€)'),
   yalin 'M€' degil. Pasta ortasindaki birim satiri ve ipuclari kisa
   halini kullanmaya devam ediyor -- orada zaten deger yaninda duruyor. */
function execUnitLabel(u){ return (u||EXV.unit)==='OI'?'OI (M€)':t('execQty'); }
function execFmt(v,u){ return (u||EXV.unit)==='OI'?nf(v,1):nf(Math.round(v)); }

/* Ciro kupu (M€). B1 YTD ciro plani detay satirlarinin PLAN tarihinden
   geliyor (planYtdTurnover) -- ozet blokta ciro icin YTD butce sutunu yok. */
function execMoneyCell(list,status,type){
  var row=type||'TOTAL', rt=(row==='TOTAL')?'ALL':row;
  var c=execZero();
  list.forEach(function(st){
    c.b1  +=execBudgetPick(st,row,status,'budgetTurnover');
    c.ytd +=execRealSum(st,rt,status,'planYtdTurnover')/1000;
    c.real+=execRealSum(st,rt,status,'ytdTurnover')/1000;
  });
  return c;
}
/* Secili birime gore tek giris noktasi. */
function execCell(list,type,status,u){
  return (u||EXV.unit)==='OI' ? execMoneyCell(list,status,type==='TOTAL'?'TOTAL':type)
                              : execCountCell(list,type,status);
}

/* ---------- RO cubuk grafigi: Budget Year / B1 YTD / Real ----------
   Benchmark (Untitled UI, Grafana, Muzli 2026 derlemesi): yuvarlak uclu
   cubuklar, ince dikey gradient, arkada soluk "ray" sutunu, deger etiketleri
   rozet icinde, ince kesikli izgara. Adet gorunumunde her cubuk P1/P10/TTM
   olarak YIGILI ciziliyor -- kullanici talebi.
   RO bayraklari SVG'nin ALTINDA HTML satirinda: mevcut flagChip/regionChip
   bilesenleri HTML, SVG icine gomulemezdi; sutun genisligi ayni oldugu icin
   hizalama birebir tutuyor. */
var BC_SERIES=[['b1','execBudgetYear','#94a3b8'],['ytd','lnBdgt','#0a7ddb'],['real','lnReal','#12803c']];
/* P1/P10/TTM yigini KALDIRILDI (kullanici karari): 30px'lik bir cubukta uc
   ton, uc seri icin dokuz ton demekti ve tonlar ayrildiginda bile okunmuyordu.
   Kirilim Table ve Gap gorunumlerinde satir satir zaten var; grafik "kim
   onde kim geride" sorusunu cevapliyor, kirilimi degil. Cubuklar duz. */

/* mode 'family' -> POWER DRIVE / POWER THERMAL, 'ro' -> tek tek RO'lar.
   Ikisi ayni cizim koduyla uretiliyor; tek fark satir kumesi ve alt etiket. */
function execBarRows(mode,st,ty,money,u){
  var src;
  if(mode==='family'){
    src=['DRIVE','THERMAL'].filter(function(f){ return !EX.fam||EX.fam===f; })
      .map(function(f){
        return {key:f,label:'POWER '+f,
                ros:BOOT.roOrder.filter(function(ro){ return FAMILY[ro]===f; }),
                list:(DATA.sites||[]).filter(function(x){ return FAMILY[x.ro]===f; })};
      });
  } else {
    src=BOOT.roOrder.filter(function(ro){ return !EX.fam||FAMILY[ro]===EX.fam; })
      .map(function(ro){ return {key:ro,label:ro,ros:[ro],list:sitesOfRo(ro)}; });
  }
  var out=src.map(function(o){
    o.c=execCell(o.list,ty,st,u);
    return o;
  }).filter(function(r){ return r.c.b1>0||r.c.ytd>0||r.c.real>0; });

  /* TOPLAM kolonu (kullanici talebi): gorunen kolonlarin toplami. Tek kolon
     kaldiysa toplam o kolonun kendisidir, eklenmez. Toplam bir kategori
     DEGIL: tiklanmaz (filtre surmez) ve kendi listesi ustteki kolonlarin
     birlesimi -- ayni site iki kolona giremedigi icin cift sayim olmaz. */
  if(out.length>1){
    var all=[];
    out.forEach(function(o){ all=all.concat(o.list); });
    var tot={key:'TOTAL',label:'TOTAL',ros:[],list:all,isTotal:true};
    tot.c=execCell(all,ty,st,u);
    out.push(tot);
  }
  return out;
}
/* unit verilirse secili birimden BAGIMSIZ cizer (aile grafigi iki birimi
   yan yana gosteriyor). half=true dar kolon icin daha kucuk viewBox. */
/* Sayfada birden fazla grafik var; SVG id'leri BELGE genelinde benzersiz
   olmali. clipPath id'leri ('bcC0_0'...) iki COUNT grafiginde ayni cikiyordu
   ve tarayici url(#...) ile ILK esleseni kullandigi icin RO grafiginin
   cubuklari aile grafiginin dikdortgenine kirpilip KAYBOLUYORDU (goruldu).
   Her cizim icin benzersiz bir onek uretiliyor. */
var BC_UID=0;
function execBarChart(mode,unit,half,withSwitch){
  var uid='c'+(++BC_UID)+'_';
  var u=unit||EXV.unit;
  var st=F.status, ty=execTypeRow(), money=(u==='OI');
  var all=execBarRows(mode,st,ty,money,u);
  /* TOPLAM artik cubuk alaninda DEGIL, grafigin ustunde sayi seridinde.
     Sebep olculdu: toplam en buyuk RO'nun ~2 kati oldugu icin olcegi tek
     basina belirliyor, geri kalan yedi cubuk yariya iniyor ve kucuk RO'lar
     (1.0 M€) hic gorunmuyordu. Toplam bir buyukluk karsilastirmasi degil bir
     BASLIK; yeri sayi olarak ustu. */
  var total=null;
  var rows=all.filter(function(r){ if(r.isTotal){ total=r; return false; } return true; });
  if(!rows.length) return '';

  /* Genis ekranda kap genisledikce SVG de uzuyordu (1920'de 538px).
     viewBox daha BASIK: oran korunarak yukseklik makul kaliyor ve kap
     orani ayni oldugu icin mektup-kutusu (bos kenar) olusmuyor. */
  var W=half?620:1180,H=half?265:260,PL=half?50:58,PR=16,PT=34,PB=16;
  var iw=W-PL-PR, ih=H-PT-PB;
  var max=0; rows.forEach(function(r){ max=Math.max(max,r.c.b1,r.c.ytd,r.c.real); });
  var step=Math.pow(10,Math.floor(Math.log(Math.max(max,1))/Math.LN10));
  if(max/step<2) step/=2; else if(max/step>5) step*=2;
  var top=Math.max(step,Math.ceil(max/step)*step);
  var y=function(v){ return PT+ih-(v/top)*ih; };

  var grid='';
  for(var g=0;g<=4;g++){
    var v=top*g/4, yy=y(v);
    grid+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+
      '" class="bc-grid"/>'+
      '<text x="'+(PL-12)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" class="bc-ax">'+
      (money?nf(v,v<10?1:0):nf(Math.round(v)))+'</text>';
  }

  /* Iki kategoride (aile grafigi) sutun ekrani kapliyor ve cubuklar birbirinden
     kopuk duruyordu: sutun genisligi sinirlanip blok ortalaniyor. */
  var bw=Math.min(iw/rows.length,300), x0off=PL+(iw-bw*rows.length)/2;
  /* Hayalet izler (her cubugun arkasindaki acik dolgu) KALKTI: yedi kolonda
     24 fazladan sekil demekti ve hicbir bilgi tasimiyordu -- izgara zaten
     olcegi veriyor. Yer acildigi icin cubuklar kalinlasti, aradaki bosluk
     daraldi. */
  var bar=Math.min(30,bw*0.26), gap=4;
  var span=bar*3+gap*2;
  var bars='';
  rows.forEach(function(r,i){
    var cx=x0off+bw*(i+0.5), x0=cx-span/2;
    bars+='<g class="bc-g'+(r.isTotal?' bc-total':'')+'"'+
      (r.isTotal?'':' data-'+(mode==='family'?'exfam':'exro')+'="'+esc(r.key)+'"')+'>'+
      (r.isTotal?'':'<rect class="bc-hit" x="'+(x0off+bw*i+3).toFixed(1)+'" y="'+(PT-18)+
        '" width="'+(bw-6).toFixed(1)+'" height="'+(ih+18)+'" rx="12"/>');
    BC_SERIES.forEach(function(sr,k){
      var val=r.c[sr[0]], x=x0+k*(bar+gap), yv=y(val), h=Math.max(0,PT+ih-yv);
      if(h>0){
        bars+='<rect x="'+x.toFixed(1)+'" y="'+yv.toFixed(1)+'" width="'+bar+'" height="'+h.toFixed(1)+
          '" rx="'+Math.min(bar/2,6)+'" fill="url(#bcG'+uid+k+')"/>';
      }
      /* Uc degerin ucu de yaziliyor (kullanici karari: "sayilar onemli").
         Bir onceki turda kalabalik diye yalniz sonuc serisi etiketlenmisti;
         sayilarin kendisi bilgi tasidigi icin geri alindi. Yer, cubuklarin
         genislemesiyle zaten acildi. */
      if(val>0)
        bars+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(yv-8).toFixed(1)+'" text-anchor="middle" '+
          'class="bc-v bc-v'+k+'">'+execFmt(val,u)+'</text>';
    });
    bars+='<title>'+esc(r.label+' — '+t('execBudgetYear')+' '+execFmt(r.c.b1,u)+' · '+
      t('lnBdgt')+' '+execFmt(r.c.ytd,u)+' · '+t('lnReal')+' '+execFmt(r.c.real,u)+' '+execUnit(u))+'</title></g>';
  });

  var labels=rows.map(function(r){
    var inner = mode==='family'
      ? '<span class="bc-lb-c">'+esc(r.label)+'</span>'+
        '<span class="bc-lb-ros">'+r.ros.map(function(x){
          return '<span class="xro" style="--rc:var(--ro-'+x+')">'+roRegionChip(x,15)+
                 esc(x)+'</span>'; }).join('')+'</span>'
      : '<span class="bc-lb-f">'+roRegionChip(r.key)+'</span>'+
        '<span class="bc-lb-c">'+esc(r.key)+'</span>'+
        '<span class="bc-lb-n">'+esc(BOOT.roLabels[r.key]||'')+'</span>';
    return '<button class="bc-lb" type="button" data-'+(mode==='family'?'exfam':'exro')+
      '="'+esc(r.key)+'" style="width:'+(100/rows.length)+'%">'+inner+'</button>';
  }).join('');

  var key=BC_SERIES.map(function(sr){
    return '<span class="bc-kk"><i style="background:'+sr[2]+'"></i>'+esc(t(sr[1]))+'</span>';
  }).join('');
  /* Toplam seridi: grafigin ustunde uc sayi. Cubuk degil sayi, cunku burada
     is karsilastirma degil "genel durum ne" -- ve olcegi bozmuyor. */
  var sum='';
  if(total){
    sum='<div class="bc-sum">'+BC_SERIES.map(function(sr,k){
      return '<span class="bc-sm"><i style="background:'+sr[2]+'"></i>'+
        '<b>'+execFmt(total.c[sr[0]],u)+'</b>'+
        '<em>'+esc(t(sr[1]))+'</em></span>';
    }).join('')+
    '<span class="bc-sm-n">TOTAL · '+esc(nf(total.list.length)+' '+sitesWord(total.list.length))+
    '</span></div>';
  }

  /* Genis kartta cizim alani 980px'e kapanmisti (iki kategorili aile
     grafigi orada rahat duruyor). RO gorunumunde YEDI kategori var; ayni
     kapak cubuklari inceltip sikisik gosteriyordu. Kategori coksa kart ne
     kadar genisse o kadar kullaniliyor. */
  var body=sum+'<div class="bc-body"'+(rows.length>=5?' style="max-width:none"':'')+'>'+
    /* Oran SVG'nin KENDI viewBox'indan geliyor. CSS'te sabit bir oran
       tutuluyordu; kart tek sutuna dusup genisleyince viewBox ile oran
       ayrisiyor ve SVG mektup-kutusuna dusuyordu (cubuklar ortada dar bir
       serit halinde kaliyordu, olculdu). */
    '<div class="bc-wrap" style="aspect-ratio:'+W+'/'+H+'"><svg viewBox="0 0 '+W+' '+H+
      '" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="'+esc(t('execChartTitle'))+'">'+
      '<defs>'+BC_SERIES.map(function(sr,k){
        return '<linearGradient id="bcG'+uid+k+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="'+sr[2]+'"/>'+
          '<stop offset="1" stop-color="'+sr[2]+'" stop-opacity=".72"/></linearGradient>';
      }).join('')+'</defs>'+grid+bars+'</svg></div>'+
    '<div class="bc-labels" style="width:'+(bw*rows.length/W*100)+'%;margin-left:'+(x0off/W*100)+'%">'+
      labels+'</div></div>';
  /* HER BIRIM KENDI KARTINDA. Tek cerceveye iki farkli olcegi koymak
     "sikistirilmis tablo" etkisi yapiyordu: kart basligi neyi anlattigini
     soylemiyordu. Benchmark: bir kart = bir kavram (PatternFly, stan.vision);
     farkli olcekler ayri panellere bolunur (DataCamp, datawirefra.me).
     Baslik hiyerarsisi: kapsam (kucuk, ust) -> OLCU (buyuk) -> seriler. */
  /* Baslik bloku: UST SATIR (kapsam/anahtar + efsane) tam genislikte, altinda
     olcu ve seriler. Efsane eskiden basligin YANINDAYDI; anahtar satiri
     genis oldugu icin dar kartta alt satira kayiyor ve iki kartin grafik
     baslangici farkli yukseklige dusuyordu. */
  return '<section class="panel bc-panel">'+
      '<div class="bc-head">'+
        '<div class="bc-top">'+
          (withSwitch?execScopeSwitch()
            :'<span class="bc-eyebrow">'+esc(mode==='family'?t('execScopeFam'):t('execScopeRo'))+'</span>')+
        '</div>'+
        '<h3>'+esc(execUnitLabel(u))+'</h3>'+
        '<p class="bc-sub">'+esc(t('execSeries'))+'</p>'+
      '</div>'+
    body+
    /* Efsane GRAFIGIN ALTINDA, ortali. Baslik satirinda anahtar + gorunum
       secici + efsane ayni satira sigmiyordu (olculdu: 757px icerik, 737px
       yer) ve dar kartta efsane alt satira kayip grafigi asagi itiyordu --
       iki kartin grafik baslangici farkli yukseklige dusuyordu. */
    '<div class="bc-keywrap"><span class="bc-key">'+key+'</span></div>'+
    '</section>';
}

/* Iki birim YAN YANA. Ayni eksene iki olcek koymak (cift eksen) yasak
   oldugu icin dogru cozum iki AYRI grafik.
   Sutun sayisi CSS'te uyarlamali: dar ekranda alt alta duserler, cunku
   RO grafiginde 7 kategori x 3 cubuk yari genislige sigmiyor. */
function execPair(mode){
  /* Anahtar yalniz ILK kartta: ikisini birden cevirdigi icin iki kopya
     ayni isi yapan iki kontrol gibi gorunurdu. */
  /* RO gorunumunde 7 kategori var ve kartlar zaten alt alta duser; dar
     tuval (620) orada cubuklari inceltiyordu. Is kolu gorunumunde 2 kategori
     var, kartlar yan yana sigiyor. */
  var half=(mode!=='ro');
  var a=execBarChart(mode,'OI',half,true), b=execBarChart(mode,'COUNT',half);
  if(!a&&!b) return '';
  return '<div class="bc-pair bc-pair-'+esc(mode)+'">'+a+b+'</div>';
}

/* Renk kaynagi: RO renkleri --ro-* degiskenlerinden okunuyor; acilis
   ekranindaki nokta renkleri de ayni kaynaktan geliyor, boylece iki yerde
   ayri palet tutulmuyor. */

/* ---------- yonetim matrisi (mudurun slayti) ----------
   Satirlar: P1/P10 x NEW/REMAN, TTM, TOPLAM (adet) + OI NEW/REMAN/TOPLAM (M€).
   Sutunlar: her RO icin B1 / B1 YTD / YTD Real, sonda TOTAL.
   Slayttaki kirmizi isaretleme: YTD Real, B1 YTD'nin ALTINDA kalmissa.
   ONEMLI: hesaplar ust filtre barindan BAGIMSIZ -- matrisin kendisi zaten
   NEW/REMAN ve P1/P10/TTM kirilimini satir satir veriyor; F.status ile
   ikinci kez daraltmak slaytla ayni sey olmazdi (grafik tarafinda da ayni
   kural gecerli). */
var MX_COLS=[['b1','execB1'],['ytd','execB1Ytd'],['real','execYtdReal']];
/* plain=true: performans satiri degil, mutabakat satiri -- kirmizi
   "plandan geride" isareti orada anlamsiz olurdu. */
function mxCell(c,money,plain){
  var late=!plain&&(c.real<c.ytd);
  var f=function(v){ return money?nf(v,2):nf(Math.round(v)); };
  return '<td class="mx-v">'+f(c.b1)+'</td>'+
    '<td class="mx-v mx-dim">'+f(c.ytd)+'</td>'+
    '<td class="mx-v'+(late?' mx-late':'')+'"'+
      (late?' title="'+esc(t('behindPlan'))+'"':'')+'>'+f(c.real)+'</td>';
}
/* Satir basligi HER ZAMAN iki hucre genisliginde: birinci sutun grup adi
   (P1/P10/OI), ikinci sutun alt kirilim (NEW/REMAN). Ilk surumde REMAN
   satirlari tek hucreyle basliyordu ve butun satir bir sutun KAYIYORDU --
   B1 degeri B1 YTD sutununda gorunuyordu. */
function mxRow(label,sub,lists,fn,money,cls,plain){
  var html='<tr'+(cls?' class="'+cls+'"':'')+'>';
  if(sub==null){
    html+='<th class="mx-rh" scope="row" colspan="2">'+esc(label||'')+'</th>';
  } else {
    html+='<th class="mx-rh" scope="row">'+esc(label||'')+'</th>'+
          '<th class="mx-rh2" scope="row">'+esc(sub)+'</th>';
  }
  lists.forEach(function(L){ html+=mxCell(fn(L.list),money,plain); });
  return html+'</tr>';
}
function execMatrix(){
  var ros=BOOT.roOrder.filter(function(ro){ return sitesOfRo(ro).length; });
  if(!ros.length) return '';
  var cols=ros.map(function(ro){ return {key:ro,label:ro,list:sitesOfRo(ro)}; });
  cols.push({key:'TOTAL',label:t('execTotal'),list:(DATA.sites||[]),total:true});

  var head='<thead><tr><td class="mx-corner" colspan="2"></td>'+
    cols.map(function(c){
      return '<th class="mx-ro'+(c.total?' mx-tot':'')+'" colspan="3" scope="colgroup">'+esc(c.label)+'</th>';
    }).join('')+'</tr><tr><td class="mx-corner" colspan="2"></td>'+
    cols.map(function(c){
      return MX_COLS.map(function(k){
        return '<th class="mx-sub'+(c.total?' mx-tot':'')+'" scope="col">'+esc(t(k[1]))+'</th>';
      }).join('');
    }).join('')+'</tr></thead>';

  var body='<tbody>';
  /* 1) Proje adedi: tip x urun tipi */
  body+='<tr class="mx-band"><th colspan="'+(2+cols.length*3)+'" scope="colgroup">'+
    esc(t('mxTypology'))+' <span class="mx-unit">'+esc(t('execQty'))+'</span></th></tr>';
  [['P1','NEW'],['P1','REMAN'],['P10','NEW'],['P10','REMAN']].forEach(function(r,i){
    body+=mxRow(i%2===0?r[0]:null, r[1], cols, function(list){
      return execCountCell(list,r[0],r[1]);
    }, false, i%2===0?'mx-grp':'');
  });
  body+=mxRow('TTM',null,cols,function(list){ return execCountCell(list,'TTM','ALL'); },false,'mx-grp');
  /* DENETIM BULGUSU — tablo kendi icinde toplanmiyordu.
     Bolum 4'un TOTAL satiri, P1 + P10 + TTM satirlarinin toplamina esit
     degil (olculdu: B1 3.813 vs 3.799, B1 YTD 1.886 vs 1.831; YTD Real
     tam tutuyor). Fark, sayfada TOPLAM'a girmis ama bir proje tipine
     yazilmamis projelerdir -- kaynaktaki gercek bir tutarsizlik.
     Sessizce yutmuyoruz (okuyucu satirlari toplayip tutmayinca tabloya
     guvenini kaybeder) ve TOPLAM'i da degistirmiyoruz (KPI kartlari ayni
     TOPLAM'i kullaniyor, degistirirsek ekran kendi kendiyle celisirdi).
     Cozum: farki kendi satirinda gostermek. Sifirsa satir cizilmez. */
  var unRows=[], anyUn=false;
  cols.forEach(function(L){
    var tot=execCountCell(L.list,'TOTAL','ALL'), sum=execZero();
    [['P1','NEW'],['P1','REMAN'],['P10','NEW'],['P10','REMAN']].forEach(function(x){
      var c=execCountCell(L.list,x[0],x[1]); sum.b1+=c.b1; sum.ytd+=c.ytd; sum.real+=c.real;
    });
    var tt=execCountCell(L.list,'TTM','ALL');
    sum.b1+=tt.b1; sum.ytd+=tt.ytd; sum.real+=tt.real;
    var d={b1:tot.b1-sum.b1, ytd:tot.ytd-sum.ytd, real:tot.real-sum.real};
    if(d.b1||d.ytd||d.real) anyUn=true;
    unRows.push(d);
  });
  if(anyUn){
    var ui=0;
    body+=mxRow(t('mxUnclassified'),null,cols,function(){ return unRows[ui++]; },
                false,'mx-grp mx-un',true);
  }
  body+=mxRow(t('execTotal'),null,cols,function(list){
    return execCountCell(list,'TOTAL','ALL'); },false,'mx-sum');

  /* 2) Ciro (OI) */
  body+='<tr class="mx-band"><th colspan="'+(2+cols.length*3)+'" scope="colgroup">'+
    'OI <span class="mx-unit">M€</span></th></tr>';
  ['NEW','REMAN'].forEach(function(st,i){
    body+=mxRow(i===0?'OI':null, st, cols, function(list){
      return execMoneyCell(list,st,'TOTAL'); }, true, i===0?'mx-grp':'');
  });
  body+=mxRow(t('execTotal'),null,cols,function(list){
    return execMoneyCell(list,'ALL','TOTAL'); },true,'mx-sum');
  body+='</tbody>';

  return '<section class="panel bc-panel mx-panel">'+
      '<div class="bc-head">'+
        '<div class="bc-top">'+
          '<span class="bc-eyebrow">'+esc(t('mxEyebrow'))+'</span>'+
          execViewSeg()+
        '</div>'+
        '<h3>'+esc(t('mxTitle'))+'</h3>'+
        '<p class="bc-sub">'+esc(t('mxSub'))+'</p>'+
      '</div>'+
      '<div class="mx-wrap"><table class="mx">'+head+body+'</table></div>'+
    '</section>';
}

/* ---------- SAPMA MATRISI (gap matrix) ----------
   Mudurun tablosu 72 sayi gosterip kiyasi okuyucuya yaptiriyor. Bu gorunum
   ayni veriden TEK soruyu cevapliyor: "hangi RO, hangi proje tipinde plandan
   ne kadar sapmis?"
     - Hucredeki sayi: YTD Real - B1 YTD (mutlak sapma; aksiyona cevrilebilen
       tek sayi). Isaret (+/-) rengin YEDEK kanali -- renk tek basina bilgi
       tasimiyor (renk korlugu / yazici).
     - Hucrenin rengi: ayni sapmanin ORANSAL buyuklugu (Real / B1 YTD). 41
       hedefin icinde 29 proje geri kalmak, 500 hedefin icinde 29'dan cok daha
       kotudur; sayi bunu soylemez, renk soyler.
     - Sagdaki sutun: satir toplami icin cubuk + plan isareti. Uzunluk insanin
       en hassas okudugu boyut, satir toplamlarinin kiyasi orada yapilir.
   Palet kurali (dataviz skill): ayrisan (diverging) olcek = iki uc + NOTR gri
   orta; gokkusagi yok, ortada renk yok. Tonlar acik tutuldu ki hucre yazisi
   tek murekkeple okunsun -- olculdu: en dusuk kontrast acikta 9.4:1,
   gecede 5.5:1. */
var GAP_STEPS=7;            // 3 geri + notr + 3 onde
function gapTone(c){
  /* Plan yoksa: gerceklesen de yoksa notr, varsa "plansiz launch" = en onde. */
  if(!(c.ytd>0)) return (c.real>0)?6:3;
  var r=c.real/c.ytd;
  if(r<0.70) return 0;
  if(r<0.90) return 1;
  if(r<0.98) return 2;
  if(r<=1.02) return 3;
  if(r<=1.10) return 4;
  if(r<=1.30) return 5;
  return 6;
}
/* Isaret YUVARLANMIS degere gore: -0.04 once "−0.0" yaziyordu, yani sifir
   olan bir sapma eksi gibi goruluyordu. */
function gapNum(v,money){
  var a=money?Math.round(Math.abs(v)*10)/10:Math.abs(Math.round(v));
  var sign=(a===0)?'±':(v>0?'+':'−');
  return sign+(money?nf(a,1):nf(a));
}
/* Ciro tarafinda B1 (yillik Budget Year) YALNIZ TOPLAM satirinda gecerli:
   Bolum 3 ORDER INTAKE yalniz TOTAL/VS/OES veriyor, P1/P10/TTM kirilimi yok.
   Tip satirlarinda o alan anlamsiz cikiyor (denetimde olculdu: tipolojinin
   B1 toplami 336.98, gercek TOPLAM 115.97 -- ucu de ayni degeri tasidigi
   icin uc katina cikiyor). Ipucunda o yuzden "—" yaziyor; gosterilen
   hesaplar zaten B1 kullanmiyor (sapma = YTD Real - B1 YTD). */
function gapCell(c,money,label,noB1){
  var gap=c.real-c.ytd, tone=gapTone(c);
  var b1=noB1?'—':(money?nf(c.b1,1):nf(Math.round(c.b1)));
  var tip=label+' — B1 '+b1+
    ' · B1 YTD '+(money?nf(c.ytd,1):nf(Math.round(c.ytd)))+
    ' · YTD Real '+(money?nf(c.real,1):nf(Math.round(c.real)));
  return '<div class="gp-c gp-t'+tone+'" title="'+esc(tip)+'">'+esc(gapNum(gap,money))+'</div>';
}
/* Satir toplami: cubuk = gerceklesen, ince cizgi = plan, soluk ray = B1. */
function gapTotal(c,money){
  /* Olcek PLAN ile GERCEKLESENIN buyugu -- yillik B1 DEGIL. Bu gorunumun
     sorusu "YTD planini tutturduk mu"; olcegi yillik butceye baglayinca hem
     cubuk hem plan isareti sol uca sikisip kiyas okunmaz oluyordu.
     (Onceki "...,1" tabani da ciro tarafinda degerler 1 M€ altinda kalinca
     butun cubuklari sahte sekilde kisaltiyordu.) */
  var max=Math.max(c.ytd,c.real);
  if(!(max>0)) max=1;
  var w=clamp01(c.real/max)*100, p=clamp01(c.ytd/max)*100;
  return '<div class="gp-tot">'+
    '<div class="gp-bar"><i style="width:'+w.toFixed(1)+'%"></i>'+
      '<u style="left:'+p.toFixed(1)+'%"></u></div>'+
    '<b class="gp-tv gp-'+(c.real<c.ytd?'neg':'pos')+'">'+esc(gapNum(c.real-c.ytd,money))+'</b>'+
  '</div>';
}
function gapBlock(title,unit,rows,cols,money){
  var html='<div class="gp-block"><div class="gp-bh">'+esc(title)+
    ' <span class="mx-unit">'+esc(unit)+'</span></div>'+
    '<div class="gp-grid" style="--gp-cols:'+cols.length+'">'+
    '<div class="gp-h"></div><div class="gp-h"></div>'+
    cols.map(function(c){ return '<div class="gp-h gp-hc">'+esc(c.label)+'</div>'; }).join('')+
    '<div class="gp-h gp-ht">'+esc(t('execTotal'))+'</div>';
  rows.forEach(function(r){
    var all=[];
    html+='<div class="gp-r1">'+esc(r.g||'')+'</div><div class="gp-r2">'+esc(r.s||'')+'</div>';
    cols.forEach(function(c){
      var cell=r.fn(c.list);
      all.push(cell);
      html+=gapCell(cell,money,c.label+' · '+((r.g?r.g+' ':'')+(r.s||'')).trim(),
                    money&&!r.total);
    });
    var sum={b1:0,ytd:0,real:0};
    all.forEach(function(x){ sum.b1+=x.b1; sum.ytd+=x.ytd; sum.real+=x.real; });
    html+=gapTotal(sum,money);
  });
  return html+'</div></div>';
}
function gapUnitSeg(){
  return '<span class="ex-view ex-unit" role="group" aria-label="'+esc(t('execUnit'))+'">'+
    [['COUNT',t('execQty')],['OI','OI (M€)']].map(function(x){

    }).join('')+'</span>';
}
function execGapMatrix(){

  var cell=function(type,st){

    '<span class="gp-note">'+esc(t('gapNote'))+'</span></div>';

  return '<section class="panel bc-panel gap-panel">'+

        '<div class="bc-top">'+
          '<span class="bc-eyebrow">'+esc(t('mxEyebrow'))+'</span>'+

        '<p class="bc-sub">'+esc(money?t('gapSubOi'):t('gapSub'))+'</p>'+

/* Arama sonucu / grafik cubugu -> site detayi. NAV.siteIdx o RO'nun TAM
   listesindeki sirasi oldugu icin index oradan aliniyor (kapsamdan degil). */
function openSiteByKey(key){
  var hit=(DATA.sites||[]).filter(function(s){ return siteKey(s)===key; })[0];
  if(!hit) return;
  var list=sitesOfRo(hit.ro);
  var idx=-1;
  for(var i=0;i<list.length;i++){ if(siteKey(list[i])===key){ idx=i; break; } }
  if(idx<0) return;
  NAV.level='site'; NAV.ro=hit.ro; NAV.siteIdx=idx;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function goBackToRo(){
  NAV.level='ro'; NAV.expandedRo=NAV.ro; render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderSiteLevel(){
  var list=sitesOfRo(NAV.ro), s=list[NAV.siteIdx];
  if(!s){ NAV.level='ro'; return render(); }
  crumb([
    {t:t('allROs'), action:function(){ NAV.level='ro'; NAV.expandedRo=null; }},
    {t:NAV.ro+' — '+(BOOT.roLabels[NAV.ro]||''), action:function(){ NAV.level='ro'; NAV.expandedRo=NAV.ro; }},
    {t:s.site}
  ]);
  var m=siteMetrics(s);
  var ahead=(m.delta>=0), pctC=pct(m.realCount,m.budgetCount), pctM=pct(m.realTurnoverM,m.budgetTurnover);

  /* geri butonu — kullanici "geri donulemiyorde" dedi, breadcrumb yetmiyordu */

      :'<b class="'+(ahead?'up':'down')+'">'+Math.abs(m.delta)+' '+esc(t('projects'))+' '+
       (m.delta===0?esc(t('onPlan')):(ahead?esc(t('ahead')):esc(t('behind'))))+'</b>')+

  var maxT=0;

  var brk='';

    brk+='<div class="brk-row" style="--ro-color:'+roColor(s.ro)+'"><span class="brk-name">'+x+'</span>'+

      '<span class="num" style="font-weight:700">'+nf(a.ytdCount)+' / '+nf(a.count)+'</span></div>';
  });

  var vs=custTotals(s,'VS'), oes=custTotals(s,'OES');
  var tot=(vs.ytdTurnover+oes.ytdTurnover)||1;
  var vsp=Math.round(vs.ytdTurnover/tot*100), oesp=100-vsp;
  var stack='<div class="stack">'+
    (vsp>0?'<span style="width:'+vsp+'%;background:var(--ro-PDE)">'+(vsp>13?'VS '+vsp+'%':'')+'</span>':'')+

    '</div>'+
    '<div class="donut-legend" style="margin-top:14px">'+
    '<span class="lg-item"><span class="lg-dot" style="background:var(--ro-PDE)"></span>VS'+
      '<span class="lg-val">'+money(vs.ytdTurnover/1000)+'</span></span>'+
    '<span class="lg-item"><span class="lg-dot" style="background:var(--ro-PTA)"></span>OES'+
      '<span class="lg-val">'+money(oes.ytdTurnover/1000)+'</span></span></div>';

  var f1=m.budgetTurnover||0, f2=m.portfolioTurnoverM||0, f3=m.realTurnoverM||0;
  var fmax=Math.max(f1,f2,f3)||1;
  var funnel='<div class="funnel">'+
    fnRow('Budget Year',f1,fmax,'')+
    fnRow('Current Portfolio',f2,fmax,'b2')+
    fnRow('Launch Done',f3,fmax,'b3')+'</div>';

  var ind=s.indicators||{}, indHtml='';
  [['EMI','EMI'],['DAP','DAP'],['RED','Red launches']].forEach(function(p){
    var d=ind[p[0]]; if(!d) return;
    var vals=(d.trail||[]).map(function(x){ return x.value; });
    /* Verisi olmayan gostergeyi hic cizme — eskiden "EMI —" gibi bos
       satirlar kaliyordu (kullanici geri bildirimi). */
    if(!vals.some(function(v){ return v!=null; })) return;
    var last=null; for(var i=vals.length-1;i>=0;i--){ if(vals[i]!=null){ last=vals[i]; break; } }

/* ---------- sayfa adi eslesmedi uyarisi ----------
   Canli olay (2026-08): sayfalar "BEKASI_07+08" diye adlandirilmisti, eski
   kural bunu cozemiyordu; 48 site sayfasinin neredeyse tamami "taninmayan"
   listesine dustu ve ekran SIFIRLARLA acildi. Tek ipucu sayfanin EN ALTINDA
   kucuk bir nottu -- kimse okumadi. Bu blok, eslesme coktugunde ekranin EN
   USTUNDE, ne yapilacagini soyleyerek durur. */
var SITE_MATCH_MIN=10;   // bu sayidan az site tanindiysa eslesme cokmus demektir
function matchWarnBlock(){
  if(!DATA) return '';

  var ex=unk.slice(0,6).map(function(x){ return '<code>'+esc(x)+'</code>'; }).join(', ');
  return '<div class="bigwarn" role="alert">'+
    '<span class="bw-ico" aria-hidden="true">'+ICON_ALERT+'</span>'+
    '<div class="bw-body">'+
      '<b>'+esc(t('matchFailTitle'))+'</b>'+
      '<p>'+esc(t('matchFailBody')
                 .replace('{n}',nf(got))
                 .replace('{t}',nf(BOOT.siteCount||48))
                 .replace('{u}',nf(unk.length)))+'</p>'+
      '<p class="bw-ex">'+esc(t('matchFailSheets'))+' '+ex+(unk.length>6?' …':'')+'</p>'+
      '<p class="bw-fix">'+esc(t('matchFailFix'))+'</p>'+
    '</div></div>';

/* RO ve Site secicileri — Site listesi secili RO'ya gore daralir. */
function buildRoSiteSelects(){
  var sites=DATA.sites||[];
  var opts=['<option value="ALL">'+esc(t('allROs'))+'</option>'];
  BOOT.roOrder.forEach(function(ro){
    if(!sites.some(function(s){ return s.ro===ro; })) return;
    opts.push('<option value="'+ro+'"'+(F.ro===ro?' selected':'')+'>'+
      ro+' — '+esc(BOOT.roLabels[ro]||'')+'</option>');
  });
  $('selRo').innerHTML=opts.join('');

  var pool=(F.ro==='ALL')?sites:sites.filter(function(s){ return s.ro===F.ro; });
  pool=pool.slice().sort(function(a,b){ return (a.site||'').localeCompare(b.site||'',LOCALE); });
  if(F.site!=='ALL'&&!pool.some(function(s){ return siteKey(s)===F.site; })) F.site='ALL';
  $('selSite').innerHTML=['<option value="ALL">'+esc(t('allSites'))+'</option>'].concat(
    pool.map(function(s){
      return '<option value="'+esc(siteKey(s))+'"'+(F.site===siteKey(s)?' selected':'')+'>'+
        esc(s.site)+'</option>';
    })).join('');

  $('selRo').onchange=function(){
    F.ro=this.value; F.site='ALL';
    NAV.level='ro'; NAV.expandedRo=(F.ro==='ALL'?null:F.ro);
    buildRoSiteSelects(); render();
  };
  $('selSite').onchange=function(){
    F.site=this.value;
    if(F.site!=='ALL'){
      var hit=sites.filter(function(s){ return siteKey(s)===F.site; })[0];
      if(hit&&F.ro==='ALL'){ F.ro=hit.ro; buildRoSiteSelects(); }
    }
    NAV.level='ro'; NAV.expandedRo=(F.ro==='ALL'?null:F.ro);
    render();
  };
}
/* ---------- ust bardaki arama (omnibox) ----------
   Iki isi birden yapar (kullanici talebi):
     1) FILTRE  — yazdikca F.q guncellenir ve ana liste daralir (eski davranis).
     2) EK BILGI — altindaki menude eslesen RO ve site'lar, sayfada gormek icin
        asagi inmeye gerek kalmadan Launch Done / plana gore sapma / site
        sayisiyla birlikte cikar; satira tiklayinca dogrudan oraya gidilir.
   Menu satirlari NAV'i degistirdigi icin arama kutusu ayni zamanda hizli
   gezinme araci -- 48 site arasinda secici acmadan atlanir. */
var SRCH={items:[],idx:-1,open:false};

function srchMark(text,q){
  var i=String(text).toLowerCase().indexOf(q);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+
         esc(text.slice(i+q.length));
}
/* Eslesen RO'lar ve site'lar, gosterime hazir satirlar halinde. */
function srchItems(q){
  var n=q.trim().toLowerCase(); if(!n) return [];
  var out=[];
  (BOOT.roOrder||[]).forEach(function(ro){
    var label=BOOT.roLabels[ro]||'';
    if(ro.toLowerCase().indexOf(n)<0 && label.toLowerCase().indexOf(n)<0) return;
    var list=sitesOfRo(ro); if(!list.length) return;
    var a=sumMetrics(list);
    out.push({kind:'ro',ro:ro,title:ro+' — '+label,
      sub:list.length+' '+sitesWord(list.length)+' · '+nf(a.realCount)+' / '+nf(a.budgetYTD)+' '+t('projects'),
      value:money(a.realTurnoverM),q:n});
  });
  searchHits(q).forEach(function(st){
    var m=siteMetrics(st);
    out.push({kind:'site',key:siteKey(st),site:st,title:st.site,
      sub:st.ro+' · '+(BOOT.roLabels[st.ro]||'')+(st.sheet?(' · '+st.sheet):''),
      value:money(m.realTurnoverM),delta:m.delta,q:n});
  });
  return out;
}
function srchRowHtml(it,i){
  var ico=it.kind==='ro' ? roRegionChip(it.ro) : (siteFlag(it.site)||'');
  return '<button class="ts-row" type="button" role="option" data-i="'+i+'" aria-selected="false">'+
    '<span class="ts-ico">'+ico+'</span>'+
    '<span class="ts-main"><span class="ts-t">'+srchMark(it.title,it.q)+'</span>'+
    '<span class="ts-s">'+esc(it.sub)+'</span></span>'+
    (it.delta!=null?('<span class="ts-v">'+deltaPill(it.delta)+'</span>'):'')+
    '<span class="ts-v">'+esc(it.value)+'</span></button>';
}
function srchRender(q){
  var menu=$('searchMenu');
  if(!q.trim()||!DATA){ srchClose(); return; }
  SRCH.items=srchItems(q); SRCH.idx=-1;
  if(!SRCH.items.length){
    menu.innerHTML='<div class="ts-empty">'+esc(t('noMatch'))+' — “'+esc(q.trim())+'”</div>';
  } else {
    var ros=SRCH.items.filter(function(x){ return x.kind==='ro'; });
    var html='', i=0;
    if(ros.length){ html+='<div class="ts-group">RO</div>'; }
    SRCH.items.forEach(function(it,k){
      if(it.kind==='site'&&(k===0||SRCH.items[k-1].kind==='ro'))
        html+='<div class="ts-group">'+esc(t('sites')).toLocaleUpperCase(LOCALE)+'</div>';
      html+=srchRowHtml(it,k);
    });
    html+='<div class="ts-foot"><span>'+SRCH.items.length+' '+esc(t('results'))+
          '</span><span>&#8629; '+esc(t('search'))+'</span></div>';
    menu.innerHTML=html;
    menu.querySelectorAll('.ts-row').forEach(function(b){
      b.onclick=function(){ srchGo(+this.getAttribute('data-i')); };
    });
  }
  menu.hidden=false; SRCH.open=true;
  $('inpSearch').setAttribute('aria-expanded','true');
}
function srchClose(){
  $('searchMenu').hidden=true; SRCH.open=false; SRCH.idx=-1;
  $('inpSearch').setAttribute('aria-expanded','false');
}
function srchMove(d){
  if(!SRCH.open||!SRCH.items.length) return;
  SRCH.idx=(SRCH.idx+d+SRCH.items.length)%SRCH.items.length;
  var rows=$('searchMenu').querySelectorAll('.ts-row');
  rows.forEach(function(r,i){
    var on=(i===SRCH.idx);
    r.classList.toggle('on',on); r.setAttribute('aria-selected',on?'true':'false');
    if(on) r.scrollIntoView({block:'nearest'});
  });
}
function srchGo(i){
  var it=SRCH.items[i]; if(!it) return;
  srchClose();
  /* Site secilince TAM SAYFAYA gidilmiyor: sagdan acilan cekmece aciliyor.
     Kullanici karari -- listedeki site satirina tiklayinca da ayni cekmece
     aciliyor; iki yerde iki farkli davranis kafa karistiriyordu. */
  if(it.kind==='site'){ openDrawer(it.key); return; }
  F.ro=it.ro; F.site='ALL'; NAV.level='ro'; NAV.expandedRo=it.ro;
  buildRoSiteSelects(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function srchApply(v){
  F.q=v;
  if(F.q.trim()&&NAV.level==='site'){ NAV.level='ro'; }
  if(DATA) render();
}
function initSearch(){
  var el=$('inpSearch'); if(!el) return;
  $('topSearch').hidden=false;
  if(el._wired) return; el._wired=true;
  var timer=null;
  function sync(){
    var v=el.value;
    $('tsKbd').hidden=!!v; $('tsClear').hidden=!v;
    clearTimeout(timer);
    timer=setTimeout(function(){ srchApply(v); srchRender(v); },160);
  }
  el.oninput=sync;
  el.onfocus=function(){ if(this.value.trim()) srchRender(this.value); };
  el.onkeydown=function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); srchMove(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); srchMove(-1); return; }
    if(e.key==='Enter'){
      /* Bir satir secilmisse oraya git; secilmemisse menuyu kapat ve tam
         arama sonucu sayfasinda kal -- iki davranis birbirini yemesin. */
      if(SRCH.idx>=0){ e.preventDefault(); srchGo(SRCH.idx); } else { srchClose(); }
      return;
    }
    if(e.key==='Escape'){ 
      if(SRCH.open){ srchClose(); return; }
      this.value=''; sync();
    }
  };
  $('tsClear').onclick=function(){ el.value=''; sync(); el.focus(); };
  /* Menu disina tiklayinca kapanir; kutunun kendisi haric. */
  document.addEventListener('click',function(e){
    if(!SRCH.open) return;
    if(!$('topSearch').contains(e.target)) srchClose();
  });
  /* Ctrl/Cmd + K — referans uygulamadaki kisayol, kutuda da yaziyor. */
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){
      e.preventDefault(); el.focus(); el.select();
    }
  });
}
function buildFilters(){
  buildFilterSegs();
  buildRoSiteSelects();
  initSearch();
  $('filters').hidden=false;
}

/* ---------- acilis ekrani (splash) ----------
   SPLASH_MIN_MS: acilis ekraninin EN AZ ne kadar gorunecegi. Veri hazir olsa
   bile bu sure dolmadan kapanmaz -- kullanici talebi: dunya haritali acilis
   goruntusu 3-4 saniye gorunsun. Sunucu tarafi zaten yarim saniyenin altinda
   donuyor (bkz. measureStartup), yani bu sure tamamen gorsel bir tercihtir,
   veri beklemesi degil; tek sayiyi degistirmek yeter.
   Yan fayda: haritadaki 48 site sirayla yaniyor (220 + k*24 ms), son site
   ~1.35 sn'de beliriyordu -- 900 ms'lik eski tabanda animasyon yarida
   kesiliyordu, simdi tamamlaniyor. */
/* 4000 = zoom baslangici (2000) + zoom suresi (900) + sehri izlemek icin
   ~1.1 sn. Daha kisasinda yakinlasma biter bitmez ekran kapaniyor. */
var SPLASH_MIN_MS=4000;
var SPLASH={target:0,shown:0,timer:null,raf:null,done:false,zt:undefined,zstart:0,t0:Date.now()};
function splashSet(p,stageKey){
  SPLASH.target=Math.max(SPLASH.target,p);
  if(stageKey) $('splashStage').textContent=t(stageKey);
}
function splashTick(){
  /* SPLASH.shown = gercek ilerleme (yumusatilmis). Gosterilen deger ise
     bunun ve GECEN SURENIN PAYININ kucugu:
       - Veri yarim saniyede geliyor ama ekran SPLASH_MIN_MS duruyor. Zaman
         tavani olmasa cubuk ilk yarim saniyede dolup kalan 3 saniyeyi
         %100'de bekleyerek gecirir, "takilmis" gibi durur.
       - Tavan dogrudan `shown`a uygulanamaz: yumusatma (kalanin %9'u, en az
         .35) dogrusal tavanin gerisinde kalip dengeye oturuyor ve cubuk
         3.5 sn sonunda ancak %77'ye varabiliyordu (olculdu). Bu yuzden
         yumusatma kendi hedefine kosar, tavan yalnizca GOSTERIME uygulanir.
       - Yukleme gercekten uzun surerse tavan 100'u asar ve etkisiz kalir;
         yavas durumdaki davranis degismiyor. */
  var d=SPLASH.target-SPLASH.shown;
  SPLASH.shown+=d>0?Math.max(.35,d*0.09):0;
  if(SPLASH.shown>100) SPLASH.shown=100;
  var disp=Math.min(SPLASH.shown,100*(Date.now()-SPLASH.t0)/SPLASH_MIN_MS);
  if(disp<0) disp=0;
  $('splashFill').style.width=disp.toFixed(1)+'%';
  $('splashPct').textContent=Math.round(disp)+'%';
}
function splashHide(){
  if(SPLASH.done) return;
  SPLASH.done=true;
  splashSet(100,'ready');
  var wait=Math.max(0,SPLASH_MIN_MS-(Date.now()-SPLASH.t0));
  setTimeout(function(){
    SPLASH.shown=100; splashTick();
    setTimeout(function(){
      $('splash').classList.add('hide');
      clearInterval(SPLASH.timer);
      if(SPLASH.raf) cancelAnimationFrame(SPLASH.raf);
    },320);
  },wait);
}
/* Noktali dunya haritasi + site sehirleri (WorldMapData.html).
   ZOOM_AT'ten sonra, giris yapan kullanicinin site'i biliniyorsa harita o
   sehre yaklasir (kullanici talebi). Site, dizin konumundan bulunuyor
   (Feedback.gs siteFromLocation_ -> {ro,site,key}); key dogrudan SITE_GEO
   anahtaridir. Site bilinmiyorsa hicbir sey degismez -- dunya goruntusu
   oldugu gibi kalir. */
/* ZOOM_SCALE 3: harita 2.4 derecelik bir nokta izgarasi, yani zoom ne
   kadar buyukse o kadar seyreliyor -- 6 katta noktalar birbirinden
   ayrilip kara parcasi okunmaz oluyordu (olculdu). 3 katta hem sehir
   belirgin hem cevre kara sekli duruyor. */
var ZOOM_AT=2000, ZOOM_DUR=900, ZOOM_SCALE=3;
function splashZoomTarget(){
  /* Her karede degil, BIR kez cozulur: BOOT acilis aninda hazir olmayabilir
     (initSplash, boot'tan once calisiyor), o yuzden bulunana kadar denenir. */
  if(SPLASH.zt!==undefined) return SPLASH.zt;
  if(typeof BOOT==='undefined'||!BOOT||!BOOT.user) return null;
  var g=BOOT.user.siteGuess;
  var geo=(g&&g.key&&window.SITE_GEO)?SITE_GEO[g.key]:null;
  SPLASH.zt=geo?{lat:geo[0],lon:geo[1],ro:geo[2],label:g.site}:null;
  /* Zoom, hedefin COZULDUGU ana gore baslar. Yedek yolda (gomulu paket yok,
     sunucu turu var) BOOT 2 sn'den sonra gelebilir; sabit ZOOM_AT'e baglansa
     k bir anda 1 olur ve yakinlasma yerine sicrama gorunurdu. */
  if(SPLASH.zt) SPLASH.zstart=Math.max(ZOOM_AT,Date.now()-SPLASH.t0);
  return SPLASH.zt;
}
function drawSplashMap(){
  var cv=$('splashMap'); if(!cv||!window.WORLD_MAP) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;
  var W=cv.width, H=cv.height;
  var cw=W/WORLD_MAP.cols, ch=H/WORLD_MAP.rows;
  var keys=Object.keys(SITE_GEO||{});
  /* RO rengi TEK kaynaktan: --ro-* degiskenleri. Burada ayri bir kopya
     vardi ve uygulamanin geri kalaniyla uyusmuyordu (PDE #3b9ae4 vs #0072ce,
     PTE ise #22c55e = tokens/colors.css'teki --success, yani REZERVE bir
     durum rengi kategori rengi olarak kullaniliyordu). */
  var RO_HUE={};
  ['PAS','PDA','PDC','PDE','PTA','PTC','PTE'].forEach(function(r){ RO_HUE[r]=roHex(r); });
  function proj(lat,lon){
    return [((lon-WORLD_MAP.lon0)/WORLD_MAP.step+0.5)*cw,
            ((WORLD_MAP.lat0-lat)/WORLD_MAP.step+0.5)*ch];
  }
  function ease(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
  function frame(){
    var el=Date.now()-SPLASH.t0;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);

    /* Kamera: k=0 tam dunya, k=1 hedef sehir ekranin ortasinda ZOOM_SCALE
       katinda. Ara degerlerde merkez ve olcek birlikte yurur; k=0'da
       donusum birim matris olur, yani hedef yokken hicbir maliyeti yok. */
    var tgt=splashZoomTarget();
    var z0=SPLASH.zstart||ZOOM_AT;
    var k=(tgt&&el>z0)?ease(Math.min(1,(el-z0)/ZOOM_DUR)):0;
    var sc=1+(ZOOM_SCALE-1)*k, txy=tgt?proj(tgt.lat,tgt.lon):[W/2,H/2];
    var ccx=W/2+(txy[0]-W/2)*k, ccy=H/2+(txy[1]-H/2)*k;
    ctx.setTransform(sc,0,0,sc, W/2-ccx*sc, H/2-ccy*sc);

    /* Kara noktalari. Yaricap olcege bolunur -- gercek bir zoom'da nokta BOYU
       sabit kalir, aralari acilir; bolmezsek noktalar sismis gorunur. Ama
       tamamen sabit birakmak da olmuyor: aralar acildikca kara parcasi
       dagiliyor, o yuzden ekrandaki boy zoom'la 1.7 -> 3.4 px arasi buyur. */
    var dotR=(1.7+1.7*k)/sc;
    ctx.fillStyle='rgba(160,205,245,'+(0.22+0.12*k)+')';
    for(var i=0;i<WORLD_MAP.bits.length;i++){
      if(WORLD_MAP.bits.charAt(i)!=='1') continue;
      var c=i%WORLD_MAP.cols, r=(i/WORLD_MAP.cols)|0;
      ctx.beginPath();
      ctx.arc((c+0.5)*cw,(r+0.5)*ch,dotR,0,6.2832);
      ctx.fill();
    }
    /* site sehirleri — sirayla yanar, sonra nabiz gibi atar */
    for(var j=0;j<keys.length;j++){
      var g=SITE_GEO[keys[j]];
      var appear=220+j*24;
      if(el<appear) continue;
      var age=el-appear;
      var grow=Math.min(1,age/420);
      var pulse=0.72+0.28*Math.sin((el/620)+j);
      var xy=proj(g[0],g[1]);
      var hue=RO_HUE[g[2]]||'#3b9ae4';
      var rr=(3.2+2.6*pulse)*grow/sc;
      var glow=ctx.createRadialGradient(xy[0],xy[1],0,xy[0],xy[1],rr*4.4);
      glow.addColorStop(0,hue); glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.42*grow; ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],rr*4.4,0,6.2832); ctx.fill();
      ctx.globalAlpha=grow; ctx.fillStyle=hue;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],2.6/sc,0,6.2832); ctx.fill();
      ctx.globalAlpha=1;
    }
    /* Hedef sehrin halkasi ve adi — EKRAN uzayinda cizilir (donusum sifirli),
       yoksa yazi tipi de olcege binip bulaniklasir. */
    if(k>0){
      ctx.setTransform(1,0,0,1,0,0);
      var a=Math.min(1,k*1.6);
      ctx.globalAlpha=a*0.9; ctx.strokeStyle=RO_HUE[tgt.ro]||'#3b9ae4'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(W/2,H/2,17+9*(1-k),0,6.2832); ctx.stroke();
      ctx.globalAlpha=a*0.32;
      ctx.beginPath(); ctx.arc(W/2,H/2,31+20*(1-k),0,6.2832); ctx.stroke();
      if(tgt.label){
        ctx.globalAlpha=a;
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.font='800 21px Inter, system-ui, sans-serif';
        ctx.fillStyle='rgba(4,27,60,.6)'; ctx.fillText(tgt.label,W/2+1,H/2-33);
        ctx.fillStyle='#ffffff';        ctx.fillText(tgt.label,W/2,H/2-34);
        /* RO kodu halkanin ALTINDA: ad ile halka arasina konunca halkaya
           biniyordu (goruldu). */
        ctx.font='800 12px Inter, system-ui, sans-serif';
        ctx.globalAlpha=a*0.9; ctx.fillStyle=RO_HUE[tgt.ro]||'#3b9ae4';
        ctx.fillText(tgt.ro,W/2,H/2+54);
      }
      ctx.globalAlpha=1;
    }
    /* Dongu ekran GERCEKTEN kapanana kadar surer. Eskiden SPLASH.shown<100
       kosuluna bagliydi; shown artik gosterilen deger degil (zaman tavani
       Script'te ayri uygulaniyor) ve erken 100'e varip animasyonu
       donduruyordu. */
    if(!$('splash').classList.contains('hide')) SPLASH.raf=requestAnimationFrame(frame);
  }
  frame();
}

  SPLASH.timer=setInterval(splashTick,90);

/* ---------- geri bildirim penceresi ----------
   Kayitlar ayri bir spreadsheet'in "RO Monthly Report" sekmesine dusuyor
   (Feedback.gs). Ekran goruntusu suruklenip birakilabilir ya da Ctrl+V ile

var FB={type:null,prio:null,image:null,imageName:null,busy:false};

var FB_PRIOS=[['Low','low','var(--valeo-mid)'],['Medium','medium','var(--ro-PDC)'],

function buildFbPickers(){

  });

function fbNote(msg,kind){
  var el=$('fbNote');
  if(!msg){ el.hidden=true; el.textContent=''; return; }
  el.hidden=false; el.className='fb-msg '+(kind||''); el.textContent=msg;
}
function fbSetImage(file){
  if(!file) return;
  if(file.type.indexOf('image/')!==0){ fbNote(t('onlyImages'),'err'); return; }
  var r=new FileReader();
  r.onload=function(){
    FB.image=r.result; FB.imageName=file.name||'screenshot.png';
    $('fbThumb').src=r.result;
    $('fbDrop').querySelector('.dz-empty').hidden=true;
    $('fbDrop').querySelector('.dz-preview').hidden=false;
    fbNote('');
  };
  r.readAsDataURL(file);
}
function fbClearImage(){
  FB.image=null; FB.imageName=null; $('fbThumb').removeAttribute('src'); $('fbFile').value='';
  $('fbDrop').querySelector('.dz-empty').hidden=false;
  $('fbDrop').querySelector('.dz-preview').hidden=true;
