<script>
/* Valeo RO Monthly Report — client.
   Data contract: docs/veri-listeleme.md — BOTH success and failure handlers are
   mandatory, and result.error is always checked inside the success handler. */

var BOOT=null, DATA=null;
var F={status:'NEW',type:'ALL',customer:'ALL',tableView:'count'};   // tableView: 'count' | 'money' (site tablosu)
var NAV={level:'ro',expandedRo:null,ro:null,siteIdx:null};   // 'ro' | 'site'; expandedRo = acik accordion

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nf(n,d){ return (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',
  {minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function money(m){ return m==null?'—':nf(m,1)+' M€'; }   // tek hane yuvarlama (kullanici karari)
function m2(m){ return m==null?'—':nf(m,1); }   // birimsiz, tek hane, kesirde kullanilir
function moneyTag(v){ return v==null?'—':'<b>'+nf(v,1)+'</b><span class="cur">M€</span>'; }
function signed(n){ return n==null?'—':(n>0?'+':'')+nf(n,0); }
function pct(a,b){ return (b&&b>0)?Math.round(a/b*100):null; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function monthName(){ return (DATA&&DATA.period&&DATA.period.label)?DATA.period.label.split(' ')[0]:'now'; }

function emptyM(){ return {count:0,turnover:0,ytdCount:0,ytdTurnover:0,planYtdCount:0,planYtdTurnover:0}; }
function addM(a,b){ for(var k in a){ a[k]+=b[k]||0; } return a; }

/* ---------- glossary ---------- */
var GLOSSARY=[
 ['Budget Year','What the site committed at the start of the year: the projects to launch by year-end and the turnover they bring, in M€. Fixed once the year starts — shown as a single number, not compared against progress.','Section 3 “ORDER INTAKE → Budget Year” (M€) and Section 4 “PROJECT LAUNCH → Budget Year” (project count).'],
 ['Budget YTD','The same yearly commitment phased across the months — where the site should stand by the reporting month. This is the one figure Real Launches is actually compared against: the card shows what has been realized, with the Budget YTD plan named alongside it.','Section 4 “Budget YTD [CUMUL Number]” for the count; for M€, the projects whose planned launch date falls on or before the reporting month.'],
 ['Real Launches','Projects actually launched since 1 January. A project counts only if its real launch date is on or before the reporting month.','Counted row by row from the VS / OES Current Portfolio and TTM Launch tables — the right-hand “Real” date column.'],
 ['Launch Done (L.S sent)','The turnover carried by those launched projects, in M€.','The Turnover (k€) column of the same detail rows, converted to M€.'],
 ['Launch Delay Number','Real Launches minus Budget YTD. Positive means the site is running ahead of its phased commitment, negative means it is behind. Shown as a coloured chip next to Budget YTD.','The sheet’s own “Launch Delay Number” column carries exactly this figure.'],
 ['Current Portfolio','Projects planned to launch this year, launched or not — the work already in the book.','Counted from the VS / OES Current Portfolio and TTM Launch tables (all rows, regardless of launch date).'],
 ['Sites reported','How many of the 48 sites have a sheet with data in this period. A low number means the picture is incomplete, not that performance is bad.','Sheet presence per site in the selected month’s spreadsheet.'],
 ['NEW / REMAN','NEW covers new product projects. REMAN covers remanufacturing — used parts restored and sold again. The All filter adds both together; NEW and REMAN show each on its own.','Column pair repeated across Sections 3 and 4.'],
 ['P1 / P10 / TTM','P1 = projects with development work. P10 (written PCO in some sheets) = projects without development. TTM = an OEM product taken straight to the aftermarket.','Row labels in Section 4; the “Type” column in the detail tables.'],
 ['VS / OES','VS = Valeo Service customers. OES = the OEM’s service arm. Both axes add up to the same total, from different angles.','Row labels in Sections 3 and 4; block names in the detail tables.']
];
function fillGlossary(hi){
  var m=monthName();
  $('glossList').innerHTML=GLOSSARY.map(function(g){
    var term=g[0].replace('<month>',m);
    var cls=(hi&&hi===g[0])?' class="hit"':'';
    return '<div'+cls+'><dt>'+esc(term)+'</dt><dd>'+esc(g[1])+
           '<span class="src">Source: '+esc(g[2])+'</span></dd></div>';
  }).join('');
}
function openGloss(term){ fillGlossary(term); $('dlgGloss').showModal(); }

/* ---------- aggregation ---------- */
function statusMatches_(blockStatus){ return F.status==='ALL' || blockStatus===F.status; }
function realizedOf(site){
  var out=emptyM();
  if(!site.detail||!site.detail.blocks) return out;
  site.detail.blocks.forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(F.customer!=='ALL' && b.customer!==F.customer) return;
    if(F.type==='ALL'){ addM(out,b.total); }
    else if(b.byType&&b.byType[F.type]){ addM(out,b.byType[F.type]); }
  });
  return out;
}
function budgetRowKey(){
  if(F.customer!=='ALL') return F.customer;
  if(F.type!=='ALL') return F.type;
  return 'TOTAL';
}
function pickStatus_(obj){
  if(!obj) return null;
  if(F.status==='ALL') return (typeof obj.NEW==='number'?obj.NEW:0)+(typeof obj.REMAN==='number'?obj.REMAN:0);
  return (obj[F.status]!=null?obj[F.status]:null);
}
function budgetOf(site){
  var k=budgetRowKey();
  var bc=site.budgetCount&&site.budgetCount[k];
  var by=site.budgetYTDCount&&site.budgetYTDCount[k];
  var bt=site.budgetTurnover&&site.budgetTurnover[k];
  return { count:pickStatus_(bc), ytdCount:pickStatus_(by), turnover:pickStatus_(bt) };
}
function siteMetrics(site){
  var b=budgetOf(site), r=realizedOf(site);
  return {
    budgetCount:b.count, budgetYTD:b.ytdCount, budgetTurnover:b.turnover,
    realCount:r.ytdCount, realTurnoverM:r.ytdTurnover/1000,
    planTurnoverM:r.planYtdTurnover/1000,
    portfolioCount:r.count, portfolioTurnoverM:r.turnover/1000,
    delta:(b.ytdCount==null)?null:(r.ytdCount-b.ytdCount),
    deltaTurnoverM:(r.planYtdTurnover?(r.ytdTurnover-r.planYtdTurnover)/1000:null)
  };
}
function sumMetrics(list){
  var acc={budgetCount:0,budgetYTD:0,budgetTurnover:0,realCount:0,realTurnoverM:0,
           planTurnoverM:0,portfolioTurnoverM:0,portfolioCount:0,behind:0,reported:0};
  list.forEach(function(s){
    var m=siteMetrics(s);
    ['budgetCount','budgetYTD','budgetTurnover','realCount','realTurnoverM','planTurnoverM',
     'portfolioTurnoverM','portfolioCount']
      .forEach(function(k){ if(m[k]!=null) acc[k]+=m[k]; });
    if(m.delta!=null&&m.delta<0) acc.behind++;
    if(s.status!=='no-data') acc.reported++;
  });
  acc.delta=(acc.realCount||0)-(acc.budgetYTD||0);
  return acc;
}
function sitesOfRo(ro){ return (DATA.sites||[]).filter(function(s){ return s.ro===ro; }); }
function hasReman(){
  return (DATA.sites||[]).some(function(s){
    return (s.detail&&s.detail.blocks||[]).some(function(b){ return b.status==='REMAN'&&b.total.count>0; });
  });
}

/* ---------- small SVG charts ---------- */
function bulletBar(actual, plan, max){
  var w=max>0?clamp01(actual/max)*100:0;
  var p=max>0?clamp01(plan/max)*100:0;
  var behind=(plan!=null&&actual<plan);
  return '<div class="bar">'+
    '<div class="bar-fill'+(behind?' behind':'')+'" style="width:'+w.toFixed(1)+'%"></div>'+
    (plan!=null?'<div class="bar-plan" style="left:'+p.toFixed(1)+'%"></div>':'')+
  '</div>';
}
function donut(pctCount, pctMoney){
  var R1=52,R2=36,C1=2*Math.PI*R1,C2=2*Math.PI*R2;
  var a=clamp01((pctCount||0)/100)*C1, b=clamp01((pctMoney||0)/100)*C2;
  return '<svg viewBox="0 0 130 130" width="132" height="132" role="img" '+
    'aria-label="'+(pctCount||0)+'% of Budget Year projects, '+(pctMoney||0)+'% of Budget Year turnover">'+
    '<g transform="rotate(-90 65 65)" fill="none" stroke-linecap="round">'+
      '<circle cx="65" cy="65" r="'+R1+'" stroke="var(--track)" stroke-width="11"/>'+
      '<circle cx="65" cy="65" r="'+R1+'" stroke="var(--valeo-mid)" stroke-width="11" '+
        'stroke-dasharray="'+a.toFixed(1)+' '+C1.toFixed(1)+'"/>'+
      '<circle cx="65" cy="65" r="'+R2+'" stroke="var(--track)" stroke-width="9"/>'+
      '<circle cx="65" cy="65" r="'+R2+'" stroke="var(--good-line)" stroke-width="9" '+
        'stroke-dasharray="'+b.toFixed(1)+' '+C2.toFixed(1)+'"/>'+
    '</g>'+
    '<text x="65" y="63" text-anchor="middle" font-size="25" font-weight="700" '+
      'fill="var(--text)" font-family="Inter,sans-serif">'+(pctCount==null?'—':pctCount+'%')+'</text>'+
    '<text x="65" y="80" text-anchor="middle" font-size="10.5" fill="var(--text-mute)" '+
      'font-family="Inter,sans-serif" letter-spacing=".06em">BUDGET YEAR</text>'+
  '</svg>';
}
function sparkline(vals, target){
  var pts=vals.filter(function(v){ return v!=null; });
  if(pts.length<2) return '<span style="color:var(--text-mute);font-size:13px">not enough history</span>';
  var W=150,H=40,P=4;
  var all=pts.concat(target!=null?[target]:[]);
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  if(mx===mn){ mx=mn+1; }
  var x=function(i){ return P+i*(W-2*P)/(pts.length-1); };
  var y=function(v){ return H-P-(v-mn)/(mx-mn)*(H-2*P); };
  var d=pts.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="last '+pts.length+' months, latest '+nf(last,2)+'">'+
    (target!=null?'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+
      '" stroke="var(--text-mute)" stroke-width="1" stroke-dasharray="3 3"/>':'')+
    '<path d="'+d+'" fill="none" stroke="var(--valeo-mid)" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="3.2" fill="var(--valeo-mid)"/>'+
  '</svg>';
}

/* ---------- shell ---------- */
function render(){
  if(!DATA) return;
  if(DATA.error){ $('view').innerHTML='<div class="notice err">'+esc(DATA.error)+'</div>'; return; }
  buildFilterSegs();
  if(NAV.level==='ro') renderRoLevel();
  else renderSiteLevel();
  if(window.innerWidth<=768)
    document.querySelectorAll('table').forEach(function(t){ t.classList.add('m-cards'); });
  $('view').querySelectorAll('[data-gloss]').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); openGloss(b.getAttribute('data-gloss')); };
  });
}
function crumb(parts){
  $('crumb').innerHTML=parts.map(function(p,i){
    var sep=(i<parts.length-1)?'<span class="sep" aria-hidden="true">›</span>':'';
    return (p.action?'<button type="button" data-ci="'+i+'">'+esc(p.t)+'</button>':'<b>'+esc(p.t)+'</b>')+sep;
  }).join('');
  $('crumb').querySelectorAll('button').forEach(function(b){
    var i=parseInt(b.getAttribute('data-ci'),10);
    b.onclick=function(){ parts[i].action(); render(); };
  });
}
function kpi(label, value, unit, sub, cls, gloss, chip){
  return '<div class="kpi'+(cls?' '+cls:'')+'">'+
    '<div class="kpi-head"><span class="kpi-label">'+esc(label)+'</span>'+
      (gloss?'<button class="kpi-info" type="button" data-gloss="'+esc(gloss)+'" '+
             'aria-label="What is '+esc(label)+'?">ⓘ</button>':'')+
      (chip?'<span class="spacer-x"></span>'+chip:'')+'</div>'+
    '<div class="kpi-value">'+value+(unit?'<span class="unit">'+esc(unit)+'</span>':'')+'</div>'+
    '<div class="kpi-sub">'+sub+'</div></div>';
}
/* Butun etiketler sayfanin kendi terminolojisi.
   Budget Year sabit bir hedeftir (yil basinda belirlenir) — tek deger, kiyas YOK.
   Budget YTD karti "X budget / Y launched" olarak hem ciro hem adet icin ayni
   kalipla, cift anlami olmayan sekilde yazilir (kullanici karari). Current
   Portfolio karti kaldirildi — kullanici "ne oldugu anlasilmiyor" dedi; ayni
   bilgi site detayindaki huni diyagraminda zaten baglaminda duruyor. */
function kpiRow(a){
  var ahead=(a.delta>=0);
  var chip='<span class="pill '+(ahead?'good':'bad')+'" title="Launch Delay Number = Real Launches − Budget YTD">'+
    signed(a.delta)+'</span>';
  var planKnown=a.planTurnoverM>0;
  var ytdMoney=(planKnown?moneyTag(a.planTurnoverM):'—')+'<span class="slash">/</span>'+moneyTag(a.realTurnoverM);

  return '<div class="kpis">'+
    kpi('Budget Year', moneyTag(a.budgetTurnover), '', nf(a.budgetCount)+' projects', '', 'Budget Year')+
    '<div class="kpi">'+
      '<div class="kpi-head"><span class="kpi-label">Budget YTD / Launched</span>'+
        '<button class="kpi-info" type="button" data-gloss="Budget YTD" aria-label="What is Budget YTD?">ⓘ</button>'+
        '<span class="spacer-x"></span>'+chip+'</div>'+
      '<div class="kpi-value kpi-phrase">'+ytdMoney+'</div>'+
      '<div class="kpi-sub">'+nf(a.budgetYTD)+' / '+nf(a.realCount)+'</div>'+
    '</div>'+
    kpi('Sites reported', a.reported+'<span class="unit">/ '+BOOT.siteCount+'</span>', '',
        (a.behind?a.behind+' site'+(a.behind>1?'s':'')+' behind Budget YTD':'no site behind Budget YTD'),
        '', 'Sites reported')+
  '</div>';
}

/* ---------- level 1: RO comparison strip ---------- */
/**
 * RO satirinin altini/ustunu ciziyor. Bar artik ADET degil CIRO tabanli:
 * dolu kisim = Launch Done (M€), isaret = Budget YTD (M€), tam skala = en
 * buyuk RO'nun Budget Year cirosu. Sag taraftaki "X / Y" cirosu artik
 * Budget Year yerine Budget YTD ile eslesiyor — delta cipiyle ayni eksende.
 */
function roRowHtml(r,moneyMax){
  var a=r.a, ahead=(a.delta>=0), open=(NAV.expandedRo===r.ro);
  return '<button class="ro-row'+(open?' open':'')+'" type="button" data-ro="'+r.ro+'" '+
    'aria-expanded="'+open+'">'+
    '<span class="ro-id"><span class="ro-code">'+esc(r.ro)+'</span>'+
      '<span class="ro-name">'+esc(BOOT.roLabels[r.ro]||'')+' · '+r.list.length+' sites</span></span>'+
    '<span class="bar-wrap">'+bulletBar(a.realTurnoverM,a.planTurnoverM>0?a.planTurnoverM:null,moneyMax)+
      '<span class="bar-figs">'+
      '<span>Launch Done '+moneyTag(a.realTurnoverM)+' <i>· '+nf(a.realCount)+'</i></span>'+
      '<span>Budget YTD '+moneyTag(a.planTurnoverM)+' <i>· '+nf(a.budgetYTD)+'</i></span>'+
      '<span>Budget Year '+moneyTag(a.budgetTurnover)+' <i>· '+nf(a.budgetCount)+'</i></span>'+
      '</span></span>'+
    '<span class="ro-metrics">'+
      '<span class="pill '+(ahead?'good':'bad')+'" title="Launch Delay Number">'+signed(a.delta)+'</span>'+
    '</span>'+
    '<span class="chev" aria-hidden="true">›</span>'+
  '</button>';
}

/** Delta hucresi: gorunum moduna gore adet farki ya da ciro farki (M€). */
function deltaChip(m){
  if(F.tableView==='money'){
    if(m.deltaTurnoverM==null) return '<span class="pill mute">n/a</span>';
    var cls=m.deltaTurnoverM<0?'bad':'good';
    return '<span class="pill '+cls+'">'+(m.deltaTurnoverM>=0?'+':'')+nf(m.deltaTurnoverM,1)+' M€</span>';
  }
  if(m.delta==null) return '<span class="pill mute">—</span>';
  return '<span class="pill '+(m.delta<0?'bad':'good')+'">'+signed(m.delta)+'</span>';
}
/** Adet/ciro ikisi de: F.tableView'a gore hangisi gosterilecek. */
function tblCell(countVal,moneyVal){ return F.tableView==='money' ? money(moneyVal) : nf(countVal); }

/**
 * Bir RO'nun site tablosu — accordion'da RO satirinin hemen altina gomuluyor.
 * Budget Year / Budget YTD / Real Launches / Launch Delay sutunlari, ustteki
 * Projects/Turnover anahtarina gore adet veya M€ gosterir (ayni sutun, tek
 * baslik) — ayri bir "Launch Done" sutununa artik gerek yok, Real Launches
 * Turnover modunda zaten ayni bilgiyi veriyor.
 */
function siteTableHtml(list){
  var rows=list.map(function(s,i){ return {s:s,m:siteMetrics(s),i:i}; });
  rows.sort(function(a,b){
    var av=(a.m.delta==null?9999:a.m.delta), bv=(b.m.delta==null?9999:b.m.delta);
    return av-bv;   // furthest behind first
  });
  var html='<div class="ro-expand">'+
    '<div class="tbl-toggle"><span class="flabel">Table shows</span><div class="seg seg-sm" id="segTblView">'+
      '<button type="button" data-tv="count" aria-pressed="'+(F.tableView==='count')+'">Projects</button>'+
      '<button type="button" data-tv="money" aria-pressed="'+(F.tableView==='money')+'">Turnover (M€)</button>'+
    '</div></div>'+
    '<div class="tablewrap"><table><thead><tr>'+
    '<th>Site</th><th class="num">Budget Year</th><th class="num">Budget YTD</th>'+
    '<th class="num">Real Launches</th><th class="num">Launch Delay</th><th>Status</th>'+
    '</tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr data-i="'+r.i+'">'+
      '<td class="site-name" data-label="Site">'+esc(r.s.site)+'</td>'+
      '<td class="num" data-label="Budget Year">'+tblCell(r.m.budgetCount,r.m.budgetTurnover)+'</td>'+
      '<td class="num" data-label="Budget YTD">'+tblCell(r.m.budgetYTD,r.m.planTurnoverM)+'</td>'+
      '<td class="num" data-label="Real Launches">'+tblCell(r.m.realCount,r.m.realTurnoverM)+'</td>'+
      '<td class="num" data-label="Launch Delay">'+deltaChip(r.m)+'</td>'+
      '<td data-label="Status">'+statusPill(r.s.status)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function renderRoLevel(){
  crumb([{t:'All ROs'}]);
  var all=DATA.sites||[];
  var rows=[];
  BOOT.roOrder.forEach(function(ro){
    var list=sitesOfRo(ro); if(!list.length) return;
    rows.push({ro:ro,list:list,a:sumMetrics(list)});
  });
  var moneyMax=0;
  rows.forEach(function(r){ moneyMax=Math.max(moneyMax,r.a.budgetTurnover||0); });
  rows.sort(function(x,y){ return (x.a.delta||0)-(y.a.delta||0); });   // worst first

  var html=kpiRow(sumMetrics(all));
  html+='<div class="section-title">By RO — bar shows Launch Done vs Budget Year, marker shows Budget YTD. '+
        'Click a row to see its sites.</div><div class="rolist">';
  rows.forEach(function(r){
    html+=roRowHtml(r,moneyMax);
    if(NAV.expandedRo===r.ro) html+=siteTableHtml(r.list);
  });
  html+='</div>'+noticeBlock();
  $('view').innerHTML=html;
  $('view').querySelectorAll('.ro-row[data-ro]').forEach(function(b){
    b.onclick=function(){
      var ro=b.getAttribute('data-ro');
      NAV.expandedRo=(NAV.expandedRo===ro?null:ro);   // ikinci tiklama kapatir
      render();
    };
  });
  $('view').querySelectorAll('tr[data-i]').forEach(function(tr){
    tr.onclick=function(){
      NAV.level='site'; NAV.ro=NAV.expandedRo; NAV.siteIdx=parseInt(tr.getAttribute('data-i'),10);
      render();
    };
  });
  $('view').querySelectorAll('#segTblView button').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      F.tableView=b.getAttribute('data-tv');
      render();
    };
  });
}

/* status pill re-used by the accordion's site table and the site-detail level */
function statusPill(st){
  if(st==='ok') return '<span class="pill good">on track</span>';
  if(st==='behind-schedule') return '<span class="pill warn">reported late</span>';
  if(st==='inconsistent') return '<span class="pill warn">check data</span>';
  if(st==='no-data') return '<span class="pill mute">no data</span>';
  return '<span class="pill mute">'+esc(st)+'</span>';
}

/* ---------- level 3: one site ---------- */
function typeTotals(s,t){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(b.byType&&b.byType[t]) addM(acc,b.byType[t]);
  });
  return acc;
}
function custTotals(s,c){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)||b.customer!==c) return; addM(acc,b.total);
  });
  return acc;
}
function renderSiteLevel(){
  var list=sitesOfRo(NAV.ro), s=list[NAV.siteIdx];
  if(!s){ NAV.level='sites'; return render(); }
  crumb([
    {t:'All ROs', action:function(){ NAV.level='ro'; }},                       // expandedRo dokunulmuyor, RO acik kalir
    {t:NAV.ro+' — '+(BOOT.roLabels[NAV.ro]||''), action:function(){ NAV.level='ro'; NAV.expandedRo=NAV.ro; }},
    {t:s.site}
  ]);
  var m=siteMetrics(s);
  var ahead=(m.delta>=0), pctC=pct(m.realCount,m.budgetCount), pctM=pct(m.realTurnoverM,m.budgetTurnover);

  /* 1 — one sentence */
  var head='<div class="headline">'+esc(s.site)+' is '+
    (m.delta==null?'<b>not reporting</b> this period'
      :'<b class="'+(ahead?'up':'down')+'">'+Math.abs(m.delta)+' project'+(Math.abs(m.delta)===1?'':'s')+' '+
       (ahead?'ahead of':'behind')+'</b> plan')+
    ' — Real Launches <b>'+nf(m.realCount)+'</b> of Budget Year '+nf(m.budgetCount)+', '+
    'Launch Done <b>'+money(m.realTurnoverM)+'</b> of '+money(m.budgetTurnover)+'.</div>';

  /* 2 — progress + 3 type breakdown */
  var maxT=0;
  ['P1','P10','TTM'].forEach(function(t){ var a=typeTotals(s,t); maxT=Math.max(maxT,a.count,a.ytdCount); });
  var brk='';
  ['P1','P10','TTM'].forEach(function(t){
    var a=typeTotals(s,t);
    brk+='<div class="brk-row"><span class="brk-name">'+t+'</span>'+
      bulletBar(a.ytdCount,null,maxT||1)+
      '<span class="num" style="font-weight:600">'+nf(a.ytdCount)+' / '+nf(a.count)+'</span></div>';
  });

  /* 4 — customer split */
  var vs=custTotals(s,'VS'), oes=custTotals(s,'OES');
  var tot=(vs.ytdTurnover+oes.ytdTurnover)||1;
  var vsp=Math.round(vs.ytdTurnover/tot*100), oesp=100-vsp;
  var stack='<div class="stack">'+
    (vsp>0?'<span style="width:'+vsp+'%;background:var(--valeo-mid)">'+(vsp>13?'VS '+vsp+'%':'')+'</span>':'')+
    (oesp>0?'<span style="width:'+oesp+'%;background:var(--valeo-dark)">'+(oesp>13?'OES '+oesp+'%':'')+'</span>':'')+
    '</div>'+
    '<div class="bar-figs" style="margin-top:8px"><span>VS <b>'+money(vs.ytdTurnover/1000)+'</b></span>'+
    '<span>OES <b>'+money(oes.ytdTurnover/1000)+'</b></span></div>';

  /* 5 — funnel */
  var f1=m.budgetTurnover||0, f2=m.portfolioTurnoverM||0, f3=m.realTurnoverM||0;
  var fmax=Math.max(f1,f2,f3)||1;
  var funnel='<div class="funnel">'+
    fnRow('Budget Year',f1,fmax,'')+
    fnRow('Current Portfolio',f2,fmax,'b2')+
    fnRow('Launch Done',f3,fmax,'b3')+'</div>';

  /* 6 — indicators */
  var ind=s.indicators||{}, indHtml='';
  [['EMI','EMI'],['DAP','DAP'],['RED','Red launches']].forEach(function(p){
    var d=ind[p[0]]; if(!d) return;
    var vals=(d.trail||[]).map(function(x){ return x.value; });
    var last=null; for(var i=vals.length-1;i>=0;i--){ if(vals[i]!=null){ last=vals[i]; break; } }
    var okPill='';
    if(last!=null&&d.target!=null)
      okPill='<span class="pill '+(last>=d.target?'good':'bad')+'">'+nf(last,2)+'</span>';
    else if(last!=null) okPill='<span class="pill mute">'+nf(last,2)+'</span>';
    indHtml+='<div class="ind-row"><span class="ind-name">'+p[1]+'</span>'+
      sparkline(vals,d.target)+okPill+'</div>';
  });

  var html=head+'<div class="panels">'+
    '<div class="panel"><h3>Against Budget Year</h3><div class="donut-row">'+
      donut(pctC,pctM)+
      '<div class="donut-legend">'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--valeo-mid)"></span>'+
          'Real Launches <span class="lg-val">'+nf(m.realCount)+' / '+nf(m.budgetCount)+'</span></span>'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--good-line)"></span>'+
          'Launch Done <span class="lg-val">'+m2(m.realTurnoverM)+' / '+m2(m.budgetTurnover)+' M€</span></span>'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--track)"></span>'+
          'Budget YTD <span class="lg-val">'+nf(m.budgetYTD)+'</span></span>'+
      '</div></div></div>'+
    '<div class="panel"><h3>By project type — Real Launches / Current Portfolio</h3><div class="brk">'+brk+'</div></div>'+
    '<div class="panel"><h3>By customer — Launch Done (M€)</h3>'+stack+'</div>'+
    '<div class="panel"><h3>Budget Year → Current Portfolio → Launch Done</h3>'+funnel+'</div>'+
    (indHtml?'<div class="panel" style="grid-column:1/-1"><h3>Indicators — last months</h3>'+indHtml+'</div>':'')+
  '</div>';

  html+='<details class="raw"><summary>Show raw numbers</summary>'+
    '<div class="tablewrap"><table><thead><tr><th>Breakdown</th><th class="num">Current Portfolio</th>'+
    '<th class="num">Real Launches</th><th class="num">Launch Done (M€)</th></tr></thead><tbody>';
  ['P1','P10','TTM'].forEach(function(t){
    var a=typeTotals(s,t);
    html+='<tr><td data-label="Breakdown">Project type '+t+'</td>'+
      '<td class="num" data-label="Current Portfolio">'+nf(a.count)+'</td>'+
      '<td class="num" data-label="Real Launches">'+nf(a.ytdCount)+'</td>'+
      '<td class="num" data-label="Launch Done (M€)">'+m2(a.ytdTurnover/1000)+'</td></tr>';
  });
  ['VS','OES'].forEach(function(c){
    var a=custTotals(s,c);
    html+='<tr><td data-label="Breakdown">Customer '+c+'</td>'+
      '<td class="num" data-label="Current Portfolio">'+nf(a.count)+'</td>'+
      '<td class="num" data-label="Real Launches">'+nf(a.ytdCount)+'</td>'+
      '<td class="num" data-label="Launch Done (M€)">'+m2(a.ytdTurnover/1000)+'</td></tr>';
  });
  html+='</tbody></table></div></details>';

  if(s.mismatch&&s.mismatch.length)
    html+='<div class="notice">Cross-check mismatch — counted from detail rows vs the sheet\'s summary row: '+
          esc(s.mismatch.join(' | '))+'</div>';
  if(s.warnings&&s.warnings.length)
    html+='<div class="notice">Parsing notes ('+s.warnings.length+'): '+esc(s.warnings.slice(0,8).join(' | '))+'</div>';
  html+='<div class="notice">Source sheet: <b>'+esc(s.sheet)+'</b></div>';
  $('view').innerHTML=html;
}
function fnRow(label,val,max,cls){
  return '<div class="fn-row"><div><div style="font-size:12px;color:var(--text-dim);margin-bottom:4px">'+
    esc(label)+'</div><div class="fn-bar '+cls+'" style="width:'+
    (clamp01(val/max)*100).toFixed(1)+'%;min-width:3px"></div></div>'+
    '<span class="num" style="font-weight:600">'+money(val)+'</span></div>';
}

function noticeBlock(){
  var out='';
  if(F.customer!=='ALL'&&F.type!=='ALL')
    out+='<div class="notice">Budget Year and Budget YTD come from the customer row: the source sheet does '+
         'not cross project type with customer (they are two separate row axes). Real Launches are crossed.</div>';
  var miss=(DATA.missingSites||[]).length, unk=(DATA.unknownSheets||[]).length;
  if(miss||unk)
    out+='<div class="notice">'+
      (miss?'No sheet in this period for '+miss+' site'+(miss>1?'s':'')+'. ':'')+
      (unk?unk+' sheet'+(unk>1?'s':'')+' left out — not in the mapping table ('+
        esc(DATA.unknownSheets.slice(0,4).join(', '))+').':'')+'</div>';
  return out;
}

/* ---------- filters ---------- */
function seg(container,items,current,onPick){
  container.innerHTML=items.map(function(it){
    return '<button type="button" data-v="'+it.v+'" aria-pressed="'+(it.v===current)+'">'+esc(it.t)+'</button>';
  }).join('');
  container.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ onPick(b.getAttribute('data-v')); };
  });
}
function buildStatusSeg(){
  var items=[{v:'ALL',t:'All'},{v:'NEW',t:'NEW'}];
  if(hasReman()) items.push({v:'REMAN',t:'REMAN'});
  if(F.status==='REMAN'&&items.length===2) F.status='ALL';
  seg($('segStatus'),items,F.status,function(v){ F.status=v; render(); });
}
/* buildStatusSeg() TEK BASINA render() icinde cagriliyordu; segType/segCustomer
   hic yeniden cizilmiyordu, bu yuzden P1/P10/TTM ve VS/OES'e tiklaninca veri
   dogru filtreleniyordu ama buton hicbir zaman mavi/secili gorunmuyordu.
   Uc segmenti de tek yerden guncelleyen ortak fonksiyon: */
function buildFilterSegs(){
  buildStatusSeg();
  seg($('segType'),[{v:'ALL',t:'All'},{v:'P1',t:'P1'},{v:'P10',t:'P10'},{v:'TTM',t:'TTM'}],F.type,
      function(v){ F.type=v; render(); });
  seg($('segCustomer'),[{v:'ALL',t:'All'},{v:'VS',t:'VS'},{v:'OES',t:'OES'}],F.customer,
      function(v){ F.customer=v; render(); });
}
function buildFilters(){
  buildFilterSegs();
  $('filters').hidden=false;
}

/* ---------- loading ---------- */
function loadPeriod(key){
  $('view').innerHTML='<div class="spinner" role="status">Reading '+esc(key)+
    '… scanning 48 sheets, the first load may take a moment.</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){ $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Unknown error')+'</div>'; return; }
      DATA=res; NAV={level:'ro',ro:null,siteIdx:null}; buildFilters(); render();
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
    })
    .getDashboardData(key,false);
}
function boot(){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){ $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Could not load start-up data')+'</div>'; return; }
      BOOT=res; $('inpQuery').value=res.gmailQuery||'';
      if(!res.periods.length){
        $('view').innerHTML='<div class="notice">No period registered yet. Open <b>Settings</b> and run the '+
          'Gmail scan, or add this month\'s spreadsheet link manually.</div>';
        return;
      }
      $('selPeriod').innerHTML=res.periods.map(function(p){
        return '<option value="'+p.key+'">'+esc(p.label)+'</option>'; }).join('');
      $('selPeriod').onchange=function(){ loadPeriod(this.value); };
      loadPeriod(res.periods[0].key);
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
    })
    .getBootstrap();
}

/* ---------- theme (docs/koyu-mod.md) ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark-mode',dark);
  $('btnTheme').setAttribute('aria-pressed',String(dark));
  try{ localStorage.setItem('roDashTheme',dark?'dark':'light'); }catch(e){}
}
function initTheme(){
  var saved=null; try{ saved=localStorage.getItem('roDashTheme'); }catch(e){}
  var dark=saved?saved==='dark'
    :(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(!!dark);
  $('btnTheme').onclick=function(){ applyTheme(!document.body.classList.contains('dark-mode')); };
}

/* ---------- panels ---------- */
function logS(m){ $('settingsLog').textContent=m; }
function initPanels(){
  $('btnGloss').onclick=function(){ openGloss(null); };
  $('btnCloseGloss').onclick=function(){ $('dlgGloss').close(); };
  $('btnSettings').onclick=function(){ $('dlgSettings').showModal(); };
  $('btnCloseSettings').onclick=function(){ $('dlgSettings').close(); };
  $('btnScan').onclick=function(){
    logS('Scanning Gmail…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); return; }
        var lines=(r.found||[]).map(function(f){ return (f.isNew?'NEW      ':'existing ')+f.key+'  '+f.name; });
        logS(r.threadCount+' email threads scanned.\n'+
             (lines.length?lines.join('\n'):'No new period found.')+
             ((r.errors||[]).length?'\n\nSkipped:\n'+r.errors.join('\n'):''));
        boot();
      })
      .withFailureHandler(function(e){ logS('Server error: '+(e&&e.message||e)); })
      .uiScanGmail();
  };
  $('btnSaveQuery').onclick=function(){
    google.script.run.withSuccessHandler(function(r){ logS('Query saved: '+r.query); })
      .withFailureHandler(function(e){ logS('Error: '+(e&&e.message||e)); })
      .uiSetGmailQuery($('inpQuery').value);
  };
  $('btnTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){ logS(r.message); })
      .withFailureHandler(function(e){ logS('Error: '+(e&&e.message||e)); })
      .uiInstallTrigger();
  };
  $('btnAdd').onclick=function(){
    logS('Adding…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); return; }
        logS(r.message); $('inpUrl').value=''; boot();
      })
      .withFailureHandler(function(e){ logS('Server error: '+(e&&e.message||e)); })
      .uiAddPeriod($('inpUrl').value);
  };
}

window.addEventListener('resize',function(){ if(DATA) render(); });
initTheme(); initPanels(); fillGlossary(null); boot();
</script>
