/* Asya/Amerika icin resmi bir bayrak yok — o bolgeler icin, acilis
   ekranindaki ayni kara verisinden (WORLD_MAP) uretilen minik bolge
   haritasi kullaniliyor. Avrupa AB bayragini, Cin kendi bayragini alir. */
var REGION_BOX={ ASIA:[55,150,58,-12], AMERICAS:[-170,-32,72,-56] };
function regionChip(reg,color){
  var box=REGION_BOX[reg]; if(!box||!window.WORLD_MAP) return '';
  var lon0=box[0],lon1=box[1],lat1=box[2],lat0=box[3];
  var s='<rect width="20" height="14" rx="0" fill="#0c2140"/>';
  var c0=Math.max(0,Math.round((lon0-WORLD_MAP.lon0)/WORLD_MAP.step));
  var c1=Math.min(WORLD_MAP.cols-1,Math.round((lon1-WORLD_MAP.lon0)/WORLD_MAP.step));
  var r0=Math.max(0,Math.round((WORLD_MAP.lat0-lat1)/WORLD_MAP.step));
  var r1=Math.min(WORLD_MAP.rows-1,Math.round((WORLD_MAP.lat0-lat0)/WORLD_MAP.step));
  var cw=20/Math.max(1,(c1-c0)), chh=14/Math.max(1,(r1-r0));
  for(var r=r0;r<=r1;r++){
    for(var c=c0;c<=c1;c++){
      if(WORLD_MAP.bits.charAt(r*WORLD_MAP.cols+c)!=='1') continue;
      s+='<rect x="'+((c-c0)*cw).toFixed(2)+'" y="'+((r-r0)*chh).toFixed(2)+
         '" width="'+Math.max(.6,cw*.72).toFixed(2)+'" height="'+Math.max(.6,chh*.72).toFixed(2)+
         '" fill="currentColor"/>';
    }
  }
  /* Noktalar RO renginde — boylece Asya ve Amerika rozetleri birbirinden
     ayirt ediliyor (ikisi de ayni acik maviyle cizilince benzer duruyordu). */
  return '<span class="flag" style="width:22px;height:16px;color:'+(color||'#7fd4ff')+'">'+
    '<svg viewBox="0 0 20 14" width="22" height="16" aria-hidden="true">'+s+'</svg></span>';
}
var RO_REGION={PAS:'ASIA',PDA:'AMERICAS',PDC:'CN',PDE:'EU',PTA:'AMERICAS',PTC:'CN',PTE:'EU'};
function roRegionChip(ro){
  var reg=RO_REGION[ro];
  if(reg==='EU'||reg==='CN') return flagChip(reg,22);
  return regionChip(reg,roColor(ro));
}
function siteFlag(site){
  var g=(window.SITE_GEO&&site.key)?SITE_GEO[site.key]:null;
  return (g&&g[3])?flagChip(g[3],18):'';
}

function buildLangMenu(){

 ['Budget Year','What the site committed at the start of the year: the projects to launch by year-end and the turnover they bring, in M€. Fixed once the year starts — shown as a single number, not compared against progress.','Section 3 “ORDER INTAKE → Budget Year” (M€) and Section 4 “PROJECT LAUNCH → Budget Year” (project count).'],

 ['Real Launches','Projects actually launched since 1 January. A project counts only if its real launch date is on or before the reporting month.','Counted row by row from the VS / OES Current Portfolio and TTM Launch tables — the right-hand “Real” date column.'],
 ['Launch Done (L.S sent)','The turnover carried by those launched projects, in M€.','The Turnover (k€) column of the same detail rows, converted to M€.'],

 ['NEW / REMAN','NEW covers new product projects. REMAN covers remanufacturing — used parts restored and sold again. The All filter adds both together.','Column pair repeated across Sections 3 and 4.'],
 ['P1 / P10 / TTM','P1 = projects with development work. P10 (written PCO in some sheets) = projects without development. TTM = an OEM product taken straight to the aftermarket.','Row labels in Section 4; the “Type” column in the detail tables.'],
 ['Headcount','How many people the site names in its monthly report — the project team behind these launches. The same person holding two roles is counted once. It follows the RO and site selection: pick a RO and the number is that RO’s team.','Section 2 “HUMAN RESOURCES”: the distinct names listed against Project Manager and the R&D / Process / Quality / Purchasing / Supply chain PTM rows.'],
 ['O.I (Order Intake)','Order Intake — the turnover the projects bring in, in M€. This dashboard writes O.I where the sheet writes Turnover; they are the same figure.','Section 3 “ORDER INTAKE” for the yearly figure; the “Turnover (k€)” column of the detail tables for everything counted row by row.'],
 ['Top projects','The biggest projects by O.I inside the current selection, largest first. Segment, planned and real launch dates come straight from the sheet row — an empty Real date means the project has not launched yet.','The VS / OES Current Portfolio tables: Model, Segment, Launch Sheet Date (Plan / Real) and Turnover (k€).'],

function fillGlossary(hi,query){

  $('glossList').innerHTML=GLOSSARY.map(function(g){
    var term=g[0].replace('<month>',m);

    var attrs=(hi&&hi===g[0]?' class="hit"':'')+(match?'':' hidden');
    return '<div'+attrs+'><dt>'+esc(term)+'</dt><dd>'+esc(g[1])+

function openGloss(term){ $('glossSearch').value=''; fillGlossary(term); $('dlgGloss').showModal(); }

/* ---------- aggregation ---------- */
function statusMatches_(blockStatus){ return F.status==='ALL' || blockStatus===F.status; }
function realizedOf(site){
  var out=emptyM();
  if(!site.detail||!site.detail.blocks) return out;
  site.detail.blocks.forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(F.customer!=='ALL' && b.customer!==F.customer) return;
    if(F.type==='ALL'){ addM(out,b.total); }
    else if(b.byType&&b.byType[F.type]){ addM(out,b.byType[F.type]); }
  });
  return out;
}
function budgetRowKey(){
  if(F.customer!=='ALL') return F.customer;
  if(F.type!=='ALL') return F.type;
  return 'TOTAL';
}
function pickStatus_(obj){
  if(!obj) return null;
  if(F.status==='ALL') return (typeof obj.NEW==='number'?obj.NEW:0)+(typeof obj.REMAN==='number'?obj.REMAN:0);
  return (obj[F.status]!=null?obj[F.status]:null);
}
function budgetOf(site){
  var k=budgetRowKey();
  var bc=site.budgetCount&&site.budgetCount[k];
  var by=site.budgetYTDCount&&site.budgetYTDCount[k];
  var bt=site.budgetTurnover&&site.budgetTurnover[k];
  return { count:pickStatus_(bc), ytdCount:pickStatus_(by), turnover:pickStatus_(bt) };
}
function siteMetrics(site){
  var b=budgetOf(site), r=realizedOf(site);
  return {
    budgetCount:b.count, budgetYTD:b.ytdCount, budgetTurnover:b.turnover,
    realCount:r.ytdCount, realTurnoverM:r.ytdTurnover/1000,
    planTurnoverM:r.planYtdTurnover/1000,
    portfolioCount:r.count, portfolioTurnoverM:r.turnover/1000,
    delta:(b.ytdCount==null)?null:(r.ytdCount-b.ytdCount),
    deltaTurnoverM:(r.planYtdTurnover?(r.ytdTurnover-r.planYtdTurnover)/1000:null)
  };
}
function sumMetrics(list){
  var acc={budgetCount:0,budgetYTD:0,budgetTurnover:0,realCount:0,realTurnoverM:0,
           planTurnoverM:0,portfolioTurnoverM:0,portfolioCount:0,behind:0,reported:0,headcount:0};
  list.forEach(function(s){
    var m=siteMetrics(s);
    ['budgetCount','budgetYTD','budgetTurnover','realCount','realTurnoverM','planTurnoverM',
     'portfolioTurnoverM','portfolioCount']
      .forEach(function(k){ if(m[k]!=null) acc[k]+=m[k]; });
    acc.headcount+=s.headcount||0;
    if(m.delta!=null&&m.delta<0) acc.behind++;
    if(s.status!=='no-data') acc.reported++;
  });
  acc.delta=(acc.realCount||0)-(acc.budgetYTD||0);
  return acc;
}
function sitesOfRo(ro){ return (DATA.sites||[]).filter(function(s){ return s.ro===ro; }); }
function siteKey(s){ return s.key||s.sheet; }
/* Aktif RO/site secimine gore daraltilmis site listesi — tum ekran bunun uzerinden
   hesaplanir. Secim yoksa tum site'lar. */
function scopedSites(){
  var list=DATA.sites||[];
  if(F.ro!=='ALL') list=list.filter(function(s){ return s.ro===F.ro; });
  if(F.site!=='ALL') list=list.filter(function(s){ return siteKey(s)===F.site; });
  return list;
}
function totalHeadcount(){
  var n=0; (DATA.sites||[]).forEach(function(s){ n+=s.headcount||0; }); return n;
}
/* Serbest metin aramasi: site adi, sayfa adi, RO kodu ve RO adi. */
function searchHits(q){
  var n=q.trim().toLowerCase(); if(!n) return [];
  return (DATA.sites||[]).filter(function(s){
    return (s.site||'').toLowerCase().indexOf(n)>-1 ||
           (s.sheet||'').toLowerCase().indexOf(n)>-1 ||
           (s.ro||'').toLowerCase().indexOf(n)>-1 ||
           (BOOT.roLabels[s.ro]||'').toLowerCase().indexOf(n)>-1;
  });
}
function hasReman(){
  return (DATA.sites||[]).some(function(s){
    return (s.detail&&s.detail.blocks||[]).some(function(b){ return b.status==='REMAN'&&b.total.count>0; });
  });
}
function roColor(ro){ return 'var(--ro-'+ro+')'; }

/* ---------- small SVG charts ---------- */
function donut(pctCount, pctMoney){
  var R1=52,R2=36,C1=2*Math.PI*R1,C2=2*Math.PI*R2;
  var a=clamp01((pctCount||0)/100)*C1, b=clamp01((pctMoney||0)/100)*C2;
  return '<svg viewBox="0 0 130 130" width="132" height="132" role="img" '+
    'aria-label="'+(pctCount||0)+'% of Budget Year projects, '+(pctMoney||0)+'% of Budget Year turnover">'+
    '<g transform="rotate(-90 65 65)" fill="none" stroke-linecap="round">'+
      '<circle cx="65" cy="65" r="'+R1+'" stroke="var(--track)" stroke-width="11"/>'+
      '<circle cx="65" cy="65" r="'+R1+'" stroke="var(--valeo-mid)" stroke-width="11" '+
        'stroke-dasharray="'+a.toFixed(1)+' '+C1.toFixed(1)+'"/>'+
      '<circle cx="65" cy="65" r="'+R2+'" stroke="var(--track)" stroke-width="9"/>'+
      '<circle cx="65" cy="65" r="'+R2+'" stroke="var(--good-line)" stroke-width="9" '+
        'stroke-dasharray="'+b.toFixed(1)+' '+C2.toFixed(1)+'"/>'+
    '</g>'+
    '<text x="65" y="63" text-anchor="middle" font-size="25" font-weight="700" '+
      'fill="var(--text)" font-family="Inter,sans-serif">'+(pctCount==null?'—':pctCount+'%')+'</text>'+
    '<text x="65" y="80" text-anchor="middle" font-size="10.5" fill="var(--text-mute)" '+
      'font-family="Inter,sans-serif" letter-spacing=".06em">BUDGET YEAR</text>'+
  '</svg>';
}
function sparkline(vals, target){
  var pts=vals.filter(function(v){ return v!=null; });
  if(pts.length<2) return '<span style="color:var(--text-mute);font-size:13px">—</span>';
  var W=150,H=40,P=4;
  var all=pts.concat(target!=null?[target]:[]);
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  if(mx===mn){ mx=mn+1; }
  var x=function(i){ return P+i*(W-2*P)/(pts.length-1); };
  var y=function(v){ return H-P-(v-mn)/(mx-mn)*(H-2*P); };
  var d=pts.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="last '+pts.length+' months, latest '+nf(last,2)+'">'+
    (target!=null?'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+
      '" stroke="var(--text-mute)" stroke-width="1" stroke-dasharray="3 3"/>':'')+
    '<path d="'+d+'" fill="none" stroke="var(--valeo-mid)" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="3.6" fill="var(--valeo-mid)" '+
      'stroke="var(--card)" stroke-width="2"/>'+
  '</svg>';
}
/* Durum cipi: renk TEK BASINA anlam tasimaz — ikon + etiket birlikte. */
function deltaPill(delta,unit){
  if(delta==null) return '<span class="pill mute">'+ICON_MINUS+'n/a</span>';
  var cls=delta<0?'bad':(delta>0?'good':'mute');
  var ico=delta<0?ICON_DOWN:(delta>0?ICON_UP:ICON_MINUS);
  return '<span class="pill '+cls+'">'+ico+(delta>0?'+':'')+nf(delta,unit==='M€'?1:0)+(unit?' '+unit:'')+'</span>';
}
function statusPill(st){
  if(st==='ok') return '<span class="pill good">'+ICON_CHECK+esc(t('onTrack'))+'</span>';
  if(st==='behind-schedule') return '<span class="pill warn">'+ICON_ALERT+esc(t('reportedLate'))+'</span>';
  if(st==='inconsistent') return '<span class="pill warn">'+ICON_ALERT+esc(t('checkData'))+'</span>';
  if(st==='no-data') return '<span class="pill mute">'+ICON_MINUS+esc(t('noData'))+'</span>';
  return '<span class="pill mute">'+esc(st)+'</span>';
}

/* KPI hero kartlari — ucunde de AYNI tipografi/olcek (kullanici talebi).
   dataviz/marks-and-anatomy.md "stat tile" sozlesmesi: etiket · deger ·
   (opsiyonel) delta · olcer. */
function kpiCard(o){
  return '<div class="kpi" style="--kpi-hue:'+o.hue+'">'+
    '<div class="kpi-head">'+
      '<span class="kpi-ico">'+o.icon+'</span>'+
      /* lang="en": etiket sayfanin kendi terimi; Turkce locale'de uppercase
         "Sites" -> "SİTES" yapiyordu (i/I kurali) */
      '<span class="kpi-label" lang="en">'+esc(o.label)+'</span>'+
      (o.gloss?'<button class="kpi-info" type="button" data-gloss="'+esc(o.gloss)+'" '+
        'aria-label="'+esc(o.label)+'">'+ICON_INFO+'</button>':'')+
    '</div>'+
    '<div class="kpi-value">'+o.value+'</div>'+
    '<div class="kpi-sub">'+o.sub+'</div>'+
    '<div class="kpi-meter"><i style="width:'+Math.max(0,Math.min(100,o.meter||0)).toFixed(1)+'%"></i></div>'+
    '<div class="kpi-foot"><span>'+o.footL+'</span>'+(o.footR||'')+'</div>'+
  '</div>';
}
/* "Sites reported" paydasi kapsama gore degisir: tum RO'larda 48, bir RO
   secilince o RO'nun kayitli site sayisi, tek site secilince 1. */
function scopeSiteCount(){
  if(F.site!=='ALL') return 1;
  if(F.ro!=='ALL') return (BOOT.roCounts&&BOOT.roCounts[F.ro])||scopedSites().length||1;
  return BOOT.siteCount;
}
/* "1 sites" olmasin; kucuk harfle satir icinde kullanilir. */
function sitesWord(n){ return (n===1?t('site'):t('sites')).toLocaleLowerCase(LOCALE); }
function kpiRow(a){
  var pctYear=pct(a.realTurnoverM,a.budgetTurnover);
  var pctPlan=pct(a.realTurnoverM,a.planTurnoverM);
  var siteTotal=scopeSiteCount();
  var pctSites=pct(a.reported,siteTotal);
  return '<div class="kpis">'+
    kpiCard({
      hue:'var(--ro-PDE)', icon:ICON_TARGET, label:'Budget Year', gloss:'Budget Year',
      value:moneyTag(a.budgetTurnover),
      sub:'<b>'+nf(a.budgetCount)+'</b> '+esc(t('projects'))+' '+esc(t('committed')),
      meter:pctYear||0,
      footL:esc(cap(t('launchedSoFar')))+' '+money(a.realTurnoverM),
      footR:'<span>'+(pctYear==null?'—':pctYear+'%')+'</span>'
    })+
    kpiCard({
      hue:'var(--ro-PDA)', icon:ICON_TREND, label:'Budget YTD / Launch Done', gloss:'Budget YTD',
      value:moneyTag(a.realTurnoverM),
      sub:'<b>'+nf(a.realCount)+'</b> '+esc(t('of'))+' '+nf(a.budgetYTD)+' '+esc(t('projects')),
      meter:pctPlan||0,
      footL:'Budget YTD '+money(a.planTurnoverM),
      footR:deltaPill(a.delta)
    })+
    kpiCard({
      hue:'var(--ro-PTA)', icon:ICON_PLANT, label:'Sites reported', gloss:'Sites reported',
      value:nf(a.reported)+'<span class="unit">/ '+siteTotal+'</span>',
      sub:(a.behind? '<b>'+a.behind+'</b> '+esc(t('sitesBehind')) : esc(t('noSiteBehind'))),
      meter:pctSites||0,
      footL:esc(cap(t('reporting'))),
      footR:'<span>'+(pctSites==null?'—':pctSites+'%')+'</span>'
    })+
    /* Headcount — Bolum 2 HUMAN RESOURCES'taki benzersiz kisi sayisi.
       Olcer, secili kapsamin TUM site'lar icindeki payini gosterir. */
    kpiCard({
      hue:'var(--ro-PDC)', icon:ICON_TEAM, label:'Headcount', gloss:'Headcount',
      value:nf(a.headcount)+'<span class="unit">'+esc(t('people'))+'</span>',
      sub:esc(scopeLabel()),
      meter:pct(a.headcount,totalHeadcount())||0,
      footL:esc(cap(t('inSelection'))),
      footR:'<span>'+nf(a.reported)+' '+esc(sitesWord(a.reported))+'</span>'
    })+
  '</div>';
}
/* Aktif kapsamin tek satirlik adi — KPI altinda ve secim seridinde kullanilir. */
function scopeLabel(){
  if(F.site!=='ALL'){
    var hit=(DATA.sites||[]).filter(function(s){ return siteKey(s)===F.site; })[0];
    if(hit) return hit.site;
  }
  if(F.ro!=='ALL') return F.ro+' — '+(BOOT.roLabels[F.ro]||'');
  return t('allROs');
}

/* ---------- secim seridi ---------- */
/* Hangi kapsamda bakildigi filtrelerin hemen altinda gorunur; her cip kendi
   filtresini temizler. */
function chip(key,label,value){
  return '<button class="selchip" type="button" data-clear="'+key+'">'+
    '<span class="selchip-k">'+esc(label)+'</span><span class="selchip-v">'+esc(value)+'</span>'+
    ICON_X+'</button>';
}
function renderSelStrip(){
  var el=$('selStrip'); if(!el) return;
  var out='';
  if(F.ro!=='ALL')       out+=chip('ro','RO',F.ro+' · '+(BOOT.roLabels[F.ro]||''));
  if(F.site!=='ALL')     out+=chip('site',t('site'),scopeLabel());
  if(F.status!=='ALL')   out+=chip('status',t('productType'),F.status);
  if(F.type!=='ALL')     out+=chip('type',t('projectType'),F.type);
  if(F.customer!=='ALL') out+=chip('customer',t('customer'),F.customer);
  if(F.q.trim())         out+=chip('q',t('search'),F.q.trim());
  if(!out){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false;
  el.innerHTML='<span class="selstrip-l">'+esc(t('selection'))+'</span>'+out+
    '<button class="selclear" type="button" data-clear="all">'+esc(t('clear'))+'</button>';
  el.querySelectorAll('[data-clear]').forEach(function(b){
    b.onclick=function(){

      if(k==='all'){ F.ro='ALL'; F.site='ALL'; F.status='ALL'; F.type='ALL'; F.customer='ALL'; F.q=''; }

      $('inpSearch').value=F.q;

/* ---------- grafik: Budget Year vs Launch Done, RO -> site drill-down ----------
   docs/grafikler.md Chart.js diyor; burada bilerek kutuphanesiz cizim yapiliyor:
   Apps Script web app'i kurumsal agda CDN'e erisemeyebiliyor ve panonun diger
   tum gorselleri (donut, sparkline, bullet bar) zaten ayni satir ici SVG/CSS
   dilinde. Paletin kendisi grafikler.md'nin dedigi gibi marka renklerinden
   turuyor (--ro-*, dogrulanmis 7 tonluk kategorik palet). */
function chartRows(){
  if(F.ro==='ALL'){
    var out=[];
    BOOT.roOrder.forEach(function(ro){
      var list=sitesOfRo(ro); if(!list.length) return;
      var a=sumMetrics(list);
      out.push({k:ro, label:ro, sub:BOOT.roLabels[ro]||'', color:roColor(ro),
                budget:a.budgetTurnover||0, done:a.realTurnoverM||0, level:'ro'});
    });
    return out;
  }
  /* Bir RO secili: cubuklar artik o RO'nun site'lari (is arkadasi talebi:
     "site isimleri de bar olarak gorunsun"). */
  return scopedSites().map(function(st){
    var m=siteMetrics(st);
    return {k:siteKey(st), label:st.site, sub:st.sheet, color:roColor(st.ro),
            budget:m.budgetTurnover||0, done:m.realTurnoverM||0, level:'site', site:st};
  });
}
function chartPanel(){
  var rows=chartRows();
  if(!rows.length) return '';
  rows.sort(function(a,b){ return b.budget-a.budget; });
  var max=0; rows.forEach(function(r){ max=Math.max(max,r.budget,r.done); });
  if(max<=0) max=1;
  var bars=rows.map(function(r){
    var p=pct(r.done,r.budget);
    return '<button class="ch-row" type="button" data-ck="'+esc(r.k)+'" data-cl="'+r.level+'" '+
      'style="--c:'+r.color+'" title="'+esc(r.label+' · '+r.sub)+'">'+
      '<span class="ch-lab"><b>'+esc(r.label)+'</b><i>'+esc(r.sub)+'</i></span>'+
      '<span class="ch-bars">'+
        '<span class="ch-b budget" style="width:'+(r.budget/max*100).toFixed(1)+'%"></span>'+

/* ---------- TOPS: en buyuk cirolu projeler ----------
   Kaynak: "2026 VS/OES Current Portfolio" tablolarindaki Model / Segment /
   Launch Sheet Date / Turnover (k€) sutunlari (kullanici tarifi). Ciro burada
   sayfanin kendi birimiyle (k€) gosterilir — proje basina M€ tek ondalikta
   hepsini 0.0 yapardi. */
function topProjectsOf(list){
  var out=[];
  list.forEach(function(st){
    (st.topProjects||[]).forEach(function(p){
      if(!statusMatches_(p.status)) return;
      if(F.customer!=='ALL'&&p.customer!==F.customer) return;
      if(F.type!=='ALL'&&p.type!==F.type) return;
      out.push({p:p,site:st});
    });
  });
  out.sort(function(a,b){ return (b.p.turnover||0)-(a.p.turnover||0); });
  return out.slice(0,12);
}
function topProjectsPanel(list,showSite){
  var rows=topProjectsOf(list);
  var head='<h3>'+esc(t('topProjects'))+' <span class="p-note" lang="en">O.I (k€)</span></h3>';
  if(!rows.length){
    /* Agir yari arka planda geliyor — "proje yok" demek yaniltici olurdu. */
    var msg=(DATA&&!DATA.hasDetails)?t('loadingDetails'):t('noProjects');
    return '<div class="panel tops">'+head+'<p class="empty">'+esc(msg)+'</p></div>';
  }
  var html='<div class="panel tops">'+head+
    '<div class="tops-head'+(showSite?' with-site':'')+'">'+
      '<span>Model</span><span>'+esc(t('segment'))+'</span>'+
      (showSite?'<span>'+esc(t('site'))+'</span>':'')+
      '<span class="r">'+esc(t('planCol'))+'</span><span class="r">'+esc(t('realCol'))+'</span>'+
      '<span class="r" lang="en">O.I</span></div>';
  rows.forEach(function(r){
    var p=r.p, launched=!!p.realMonth;
    html+='<div class="tops-row'+(showSite?' with-site':'')+'" style="--ro-color:'+roColor(r.site.ro)+'">'+
      '<span class="tp-model"><b>'+esc(p.model||'—')+'</b>'+
        (p.type?'<i class="tp-type">'+esc(p.type)+'</i>':'')+'</span>'+
      '<span class="tp-seg">'+esc(p.segment||'—')+'</span>'+
      (showSite?'<span class="tp-site">'+esc(r.site.site)+'</span>':'')+
      '<span class="r dim">'+esc(p.planRaw||'—')+'</span>'+
      '<span class="r '+(launched?'ok':'dim')+'">'+esc(p.realRaw||'—')+'</span>'+
      '<span class="r tp-oi">'+nf(p.turnover,1)+'</span>'+
    '</div>';
  });
  return html+'</div>';
}

/* ---------- level 1: RO karsilastirma kartlari ---------- */

}
function roStat(label,value,sub,accent){
  return '<span class="stat'+(accent?' accent':'')+'">'+

/* Site listesi — Excel tablosu degil, kart-satir listesi. Status sutunu
   kullanici talebiyle kaldirildi (durum bilgisi site detayinda duruyor). */
function tblCell(countVal,moneyVal){ return F.tableView==='money' ? money(moneyVal) : nf(countVal); }
function siteListHtml(list,ro){
  var rows=list.map(function(s,i){ return {s:s,m:siteMetrics(s),i:i}; });
  rows.sort(function(a,b){
    var av=(a.m.delta==null?9999:a.m.delta), bv=(b.m.delta==null?9999:b.m.delta);
    return av-bv;   // en geride olan once
  });
  var isMoney=F.tableView==='money';
  var html='<div class="ro-expand" style="--ro-color:'+roColor(ro)+'">'+
    '<div class="tbl-toggle"><span class="flabel">'+esc(t('tableShows'))+'</span>'+
      '<div class="seg seg-sm" id="segTblView">'+
      '<button type="button" data-tv="count" aria-pressed="'+(!isMoney)+'">'+esc(cap(t('projects')))+'</button>'+
      '<button type="button" data-tv="money" aria-pressed="'+isMoney+'" lang="en">O.I (M€)</button>'+
    '</div></div>'+
    '<div class="site-head">'+
      '<span>'+esc(t('site'))+'</span><span>Real Launches / Budget YTD</span>'+
      '<span class="r">Budget Year</span><span class="r">Budget YTD</span>'+
      '<span class="r">Real Launches</span><span class="r">Launch Delay</span>'+
    '</div><div class="sitelist">';
  rows.forEach(function(r){
    var m=r.m;
    var base=isMoney?m.planTurnoverM:m.budgetYTD;
    var got=isMoney?m.realTurnoverM:m.realCount;
    var w=(base>0)?clamp01(got/base)*100:0;
    var cap=(base>0)?(isMoney?m2(got)+' / '+m2(base)+' M€':nf(got)+' / '+nf(base))+' · '+Math.round(w)+'%'
                    :(isMoney?m2(got)+' M€':nf(got));
    html+='<button class="site-row" type="button" data-i="'+r.i+'">'+
      '<span class="site-name">'+(siteFlag(r.s)||'<i></i>')+'<span>'+esc(r.s.site)+'</span></span>'+
      '<span class="mini-meter">'+
        '<span class="mini-bar"><i style="width:'+w.toFixed(1)+'%"></i></span>'+
        '<span class="mini-cap">'+esc(cap)+'</span>'+
      '</span>'+
      '<span class="tbl-v r" data-label="Budget Year">'+tblCell(m.budgetCount,m.budgetTurnover)+'</span>'+
      '<span class="tbl-v r dim" data-label="Budget YTD">'+tblCell(m.budgetYTD,m.planTurnoverM)+'</span>'+
      '<span class="tbl-v r" data-label="Real Launches">'+tblCell(m.realCount,m.realTurnoverM)+'</span>'+
      '<span class="r" data-label="Launch Delay">'+
        (isMoney?deltaPill(m.deltaTurnoverM,'M€'):deltaPill(m.delta))+'</span>'+
    '</button>';
  });
  html+='</div></div>';
  return html;
}

function renderRoLevel(){
  var trail=[{t:t('allROs'), action:(F.ro==='ALL'&&F.site==='ALL')?null:function(){
    F.ro='ALL'; F.site='ALL'; NAV.expandedRo=null; buildRoSiteSelects(); }}];
  if(F.ro!=='ALL'){
    var roStep={t:F.ro+' — '+(BOOT.roLabels[F.ro]||'')};
    if(F.site!=='ALL') roStep.action=function(){ F.site='ALL'; buildRoSiteSelects(); };
    trail.push(roStep);
  }
  if(F.site!=='ALL') trail.push({t:scopeLabel()});
  crumb(trail);
  var scope=scopedSites();
  var q=F.q.trim();
  var rows=[];
  BOOT.roOrder.forEach(function(ro){
    var list=scope.filter(function(st){ return st.ro===ro; });
    if(!list.length) return;
    rows.push({ro:ro,list:list,a:sumMetrics(list)});
  });
  rows.sort(function(x,y){ return (x.a.delta||0)-(y.a.delta||0); });   // en geride olan once
  /* Tek RO secildiyse listesi kapali kalmasin */
  if(F.ro!=='ALL'&&!NAV.expandedRo) NAV.expandedRo=F.ro;

  var html=kpiRow(sumMetrics(scope));
  if(q){ html+=searchResultsHtml(searchHits(q))+noticeBlock(); }
  else {
    html+=chartPanel();
    html+='<div class="section-head"><h2 class="section-title">'+esc(t('byRO'))+'</h2>'+
          '<span class="section-note">'+esc(t('clickRow'))+'</span></div><div class="rolist">';
    rows.forEach(function(r){
      html+=roRowHtml(r);
      if(NAV.expandedRo===r.ro) html+=siteListHtml(r.list,r.ro);
    });
    html+='</div>';
    if(F.ro!=='ALL') html+='<div class="panels one">'+topProjectsPanel(scope,F.site==='ALL')+'</div>';
    html+=noticeBlock();
  }
  $('view').innerHTML=html;
  /* grafik cubuklari: RO seviyesinde RO'ya iner, site seviyesinde site detayina */
  $('view').querySelectorAll('.ch-row[data-ck]').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-ck');
      if(b.getAttribute('data-cl')==='ro'){
        F.ro=k; F.site='ALL'; NAV.expandedRo=k; buildRoSiteSelects(); render();
      } else { openSiteByKey(k); }
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  $('view').querySelectorAll('.search-row[data-sk]').forEach(function(b){
    b.onclick=function(){ openDrawer(b.getAttribute('data-sk')); };
  });
  $('view').querySelectorAll('.ro-row[data-ro]').forEach(function(b){
    b.onclick=function(){
      var ro=b.getAttribute('data-ro');
      NAV.expandedRo=(NAV.expandedRo===ro?null:ro);
      render();
    };
  });
  /* Site satiri artik once SAG PANELI aciyor (is arkadasi talebi: "site
     secilince sag panel acilsin"). Tam sayfa panelin altindaki dugmede. */
  $('view').querySelectorAll('.site-row[data-i]').forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      var ro=NAV.expandedRo, idx=parseInt(el.getAttribute('data-i'),10);
      var list=(ro?sitesOfRo(ro):[]).filter(function(st){ return scopedSites().indexOf(st)>-1; });
      var hit=list[idx]||sitesOfRo(ro)[idx];
      if(hit) openDrawer(siteKey(hit));
    };
  });
  $('view').querySelectorAll('#segTblView button').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); F.tableView=b.getAttribute('data-tv'); render(); };
  });
}

/* ---------- level 3: tek site ---------- */
function typeTotals(s,t2){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)) return;
    if(b.byType&&b.byType[t2]) addM(acc,b.byType[t2]);
  });
  return acc;
}
function custTotals(s,c){
  var acc=emptyM();
  (s.detail.blocks||[]).forEach(function(b){
    if(!statusMatches_(b.status)||b.customer!==c) return; addM(acc,b.total);
  });
  return acc;
}
/* Arama sonucu / grafik cubugu -> site detayi. NAV.siteIdx o RO'nun TAM
   listesindeki sirasi oldugu icin index oradan aliniyor (kapsamdan degil). */
function openSiteByKey(key){
  var hit=(DATA.sites||[]).filter(function(s){ return siteKey(s)===key; })[0];
  if(!hit) return;
  var list=sitesOfRo(hit.ro);
  var idx=-1;
  for(var i=0;i<list.length;i++){ if(siteKey(list[i])===key){ idx=i; break; } }
  if(idx<0) return;
  NAV.level='site'; NAV.ro=hit.ro; NAV.siteIdx=idx;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function goBackToRo(){
  NAV.level='ro'; NAV.expandedRo=NAV.ro; render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderSiteLevel(){
  var list=sitesOfRo(NAV.ro), s=list[NAV.siteIdx];
  if(!s){ NAV.level='ro'; return render(); }
  crumb([
    {t:t('allROs'), action:function(){ NAV.level='ro'; NAV.expandedRo=null; }},
    {t:NAV.ro+' — '+(BOOT.roLabels[NAV.ro]||''), action:function(){ NAV.level='ro'; NAV.expandedRo=NAV.ro; }},
    {t:s.site}
  ]);
  var m=siteMetrics(s);
  var ahead=(m.delta>=0), pctC=pct(m.realCount,m.budgetCount), pctM=pct(m.realTurnoverM,m.budgetTurnover);

  /* geri butonu — kullanici "geri donulemiyorde" dedi, breadcrumb yetmiyordu */
  var head='<button class="backbtn" id="btnBack" type="button">'+ICON_BACK+
    esc(t('back'))+' · '+esc(NAV.ro)+'</button>';

  head+='<div class="headline" style="--ro-color:'+roColor(s.ro)+'">'+
    siteFlag(s)+' '+esc(s.site)+' — '+
    (m.delta==null?'<b>'+esc(t('notReporting'))+'</b>'
      :'<b class="'+(ahead?'up':'down')+'">'+Math.abs(m.delta)+' '+esc(t('projects'))+' '+
       (m.delta===0?esc(t('onPlan')):(ahead?esc(t('ahead')):esc(t('behind'))))+'</b>')+
    ' · Real Launches <b>'+nf(m.realCount)+'</b> '+esc(t('of'))+' Budget Year '+nf(m.budgetCount)+
    ' · Launch Done <b>'+money(m.realTurnoverM)+'</b> '+esc(t('of'))+' '+money(m.budgetTurnover)+
    ' &nbsp;'+statusPill(s.status)+'</div>';

  var maxT=0;
  ['P1','P10','TTM'].forEach(function(x){ var a=typeTotals(s,x); maxT=Math.max(maxT,a.count,a.ytdCount); });
  var brk='';
  ['P1','P10','TTM'].forEach(function(x){
    var a=typeTotals(s,x);
    var w=clamp01(a.ytdCount/(maxT||1))*100;
    brk+='<div class="brk-row" style="--ro-color:'+roColor(s.ro)+'"><span class="brk-name">'+x+'</span>'+
      '<span class="bar"><span class="bar-fill" style="width:'+w.toFixed(1)+'%"></span></span>'+
      '<span class="num" style="font-weight:700">'+nf(a.ytdCount)+' / '+nf(a.count)+'</span></div>';
  });

  var vs=custTotals(s,'VS'), oes=custTotals(s,'OES');
  var tot=(vs.ytdTurnover+oes.ytdTurnover)||1;
  var vsp=Math.round(vs.ytdTurnover/tot*100), oesp=100-vsp;
  var stack='<div class="stack">'+
    (vsp>0?'<span style="width:'+vsp+'%;background:var(--ro-PDE)">'+(vsp>13?'VS '+vsp+'%':'')+'</span>':'')+
    (oesp>0?'<span style="width:'+oesp+'%;background:var(--ro-PTA)">'+(oesp>13?'OES '+oesp+'%':'')+'</span>':'')+
    '</div>'+
    '<div class="donut-legend" style="margin-top:14px">'+
    '<span class="lg-item"><span class="lg-dot" style="background:var(--ro-PDE)"></span>VS'+
      '<span class="lg-val">'+money(vs.ytdTurnover/1000)+'</span></span>'+
    '<span class="lg-item"><span class="lg-dot" style="background:var(--ro-PTA)"></span>OES'+
      '<span class="lg-val">'+money(oes.ytdTurnover/1000)+'</span></span></div>';

  var f1=m.budgetTurnover||0, f2=m.portfolioTurnoverM||0, f3=m.realTurnoverM||0;
  var fmax=Math.max(f1,f2,f3)||1;
  var funnel='<div class="funnel">'+
    fnRow('Budget Year',f1,fmax,'')+
    fnRow('Current Portfolio',f2,fmax,'b2')+
    fnRow('Launch Done',f3,fmax,'b3')+'</div>';

  var ind=s.indicators||{}, indHtml='';
  [['EMI','EMI'],['DAP','DAP'],['RED','Red launches']].forEach(function(p){
    var d=ind[p[0]]; if(!d) return;
    var vals=(d.trail||[]).map(function(x){ return x.value; });
    /* Verisi olmayan gostergeyi hic cizme — eskiden "EMI —" gibi bos
       satirlar kaliyordu (kullanici geri bildirimi). */
    if(!vals.some(function(v){ return v!=null; })) return;
    var last=null; for(var i=vals.length-1;i>=0;i--){ if(vals[i]!=null){ last=vals[i]; break; } }
    var okPill='';
    if(last!=null&&d.target!=null)
      okPill='<span class="pill '+(last>=d.target?'good':'bad')+'">'+
        (last>=d.target?ICON_CHECK:ICON_ALERT)+nf(last,2)+'</span>';
    else if(last!=null) okPill='<span class="pill mute">'+nf(last,2)+'</span>';
    indHtml+='<div class="ind-row"><span class="ind-name">'+p[1]+'</span>'+
      sparkline(vals,d.target)+okPill+'</div>';
  });

  var html=head+'<div class="panels">'+
    '<div class="panel"><h3>'+esc(t('againstBudgetYear'))+'</h3><div class="donut-row">'+
      donut(pctC,pctM)+
      '<div class="donut-legend">'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--valeo-mid)"></span>'+
          'Real Launches <span class="lg-val">'+nf(m.realCount)+' / '+nf(m.budgetCount)+'</span></span>'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--good-line)"></span>'+
          'Launch Done <span class="lg-val">'+m2(m.realTurnoverM)+' / '+m2(m.budgetTurnover)+' M€</span></span>'+
        '<span class="lg-item"><span class="lg-dot" style="background:var(--track)"></span>'+
          'Budget YTD <span class="lg-val">'+nf(m.budgetYTD)+'</span></span>'+
      '</div></div></div>'+
    '<div class="panel"><h3>'+esc(t('byProjectType'))+' — Real Launches / Current Portfolio</h3>'+
      '<div class="brk">'+brk+'</div></div>'+
    '<div class="panel"><h3>'+esc(t('byCustomer'))+' — Launch Done (M€)</h3>'+stack+'</div>'+
    '<div class="panel"><h3>'+esc(t('portfolioFunnel'))+'</h3>'+funnel+'</div>'+
    (indHtml?'<div class="panel" style="grid-column:1/-1"><h3>'+esc(t('indicators'))+'</h3>'+indHtml+'</div>':'')+
    '<div class="wide">'+topProjectsPanel([s],false)+'</div>'+
    teamPanel(s)+
  '</div>';

  $('view').innerHTML=html;
  $('btnBack').onclick=goBackToRo;
}

function noticeBlock(){
  var out='';
  if(F.customer!=='ALL'&&F.type!=='ALL')

  var miss=(DATA.missingSites||[]).length, unk=(DATA.unknownSheets||[]).length;

/* ---------- acilis ekrani (splash) ---------- */
var SPLASH={target:0,shown:0,timer:null,raf:null,done:false,t0:Date.now()};
function splashSet(p,stageKey){
  SPLASH.target=Math.max(SPLASH.target,p);
  if(stageKey) $('splashStage').textContent=t(stageKey);
}
function splashTick(){
  var d=SPLASH.target-SPLASH.shown;
  SPLASH.shown+=d>0?Math.max(.35,d*0.09):0;
  if(SPLASH.shown>100) SPLASH.shown=100;
  $('splashFill').style.width=SPLASH.shown.toFixed(1)+'%';
  $('splashPct').textContent=Math.round(SPLASH.shown)+'%';
}
function splashHide(){
  if(SPLASH.done) return;
  SPLASH.done=true;
  splashSet(100,'ready');
  var wait=Math.max(0,900-(Date.now()-SPLASH.t0));   // cok hizli acilirsa bir an gorunsun
  setTimeout(function(){
    SPLASH.shown=100; splashTick();
    setTimeout(function(){
      $('splash').classList.add('hide');
      clearInterval(SPLASH.timer);
      if(SPLASH.raf) cancelAnimationFrame(SPLASH.raf);
    },320);
  },wait);
}
/* Noktali dunya haritasi + site sehirleri (WorldMapData.html). */
function drawSplashMap(){
  var cv=$('splashMap'); if(!cv||!window.WORLD_MAP) return;
  var ctx=cv.getContext('2d'); if(!ctx) return;
  var W=cv.width, H=cv.height;
  var cw=W/WORLD_MAP.cols, ch=H/WORLD_MAP.rows;
  var keys=Object.keys(SITE_GEO||{});
  var RO_HUE={PAS:'#eb6834',PDA:'#1baf7a',PDC:'#eda100',PDE:'#3b9ae4',
              PTA:'#9085e9',PTC:'#e87ba4',PTE:'#22c55e'};
  function proj(lat,lon){
    return [((lon-WORLD_MAP.lon0)/WORLD_MAP.step+0.5)*cw,
            ((WORLD_MAP.lat0-lat)/WORLD_MAP.step+0.5)*ch];
  }
  function frame(){
    var el=Date.now()-SPLASH.t0;
    ctx.clearRect(0,0,W,H);
    /* kara noktalari */
    ctx.fillStyle='rgba(160,205,245,.22)';
    for(var i=0;i<WORLD_MAP.bits.length;i++){
      if(WORLD_MAP.bits.charAt(i)!=='1') continue;
      var c=i%WORLD_MAP.cols, r=(i/WORLD_MAP.cols)|0;
      ctx.beginPath();
      ctx.arc((c+0.5)*cw,(r+0.5)*ch,1.7,0,6.2832);
      ctx.fill();
    }
    /* site sehirleri — sirayla yanar, sonra nabiz gibi atar */
    for(var k=0;k<keys.length;k++){
      var g=SITE_GEO[keys[k]];
      var appear=220+k*24;
      if(el<appear) continue;
      var age=el-appear;
      var grow=Math.min(1,age/420);
      var pulse=0.72+0.28*Math.sin((el/620)+k);
      var xy=proj(g[0],g[1]);
      var hue=RO_HUE[g[2]]||'#3b9ae4';
      var rr=(3.2+2.6*pulse)*grow;
      var glow=ctx.createRadialGradient(xy[0],xy[1],0,xy[0],xy[1],rr*4.4);
      glow.addColorStop(0,hue); glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.42*grow; ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],rr*4.4,0,6.2832); ctx.fill();
      ctx.globalAlpha=grow; ctx.fillStyle=hue;
      ctx.beginPath(); ctx.arc(xy[0],xy[1],2.6,0,6.2832); ctx.fill();
      ctx.globalAlpha=1;
    }
    if(!SPLASH.done||SPLASH.shown<100) SPLASH.raf=requestAnimationFrame(frame);
  }
  frame();
}
function initSplash(){
  $('splashSub').textContent='48 '+t('sites')+' · 7 '+t('regionalOrgs');
  SPLASH.timer=setInterval(splashTick,90);
  splashSet(8,'startingUp');
  drawSplashMap();
}

/* ---------- toast (docs/bilesenler.md — showToast) ---------- */

  el.setAttribute('role',type==='error'?'alert':'status');
  el.setAttribute('aria-live',type==='error'?'assertive':'polite');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300);
  },2700);
}

/* ---------- snapshot cozme ----------
   Sunucu olculeri yer kazanmak icin sabit sirali DIZI olarak yaziyor
   (Snapshot.gs "PAKETLEME"). Burada eski obje sekline geri cevriliyor,
   boylece arayuzun geri kalani snapshot'tan mi parcali okumadan mi geldigini
   hic bilmiyor. Alan sirasi Snapshot.gs MEASURE_FIELDS ile AYNI olmali. */
var MEASURE_FIELDS=['count','turnover','ytdCount','ytdTurnover','planYtdCount','planYtdTurnover'];
function unpackMeasure(a){
  var m=emptyM();
  if(!a) return m;
  for(var i=0;i<MEASURE_FIELDS.length;i++) m[MEASURE_FIELDS[i]]=a[i]||0;
  return m;
}
function unpackSite(p){
  var blocks=(p.bl||[]).map(function(b){
    var byType={};
    ['P1','P10','TTM'].forEach(function(t){ byType[t]=unpackMeasure(b.y&&b.y[t]); });
    return { customer:b.c, status:b.s, byType:byType, total:unpackMeasure(b.t) };
  });
  var total=emptyM();
  blocks.forEach(function(b){ addM(total,b.total); });
  return {
    ro:p.ro, site:p.site, key:p.key, sheet:p.sheet, month:p.month, status:p.status,
    headcount:p.hc||0,
    budgetCount:p.bc, budgetYTDCount:p.by, budgetTurnover:p.bt,
    detail:{blocks:blocks,total:total},
    /* agir yari sonra gelir (prefetchDetails) */
    indicators:{}, hrRoles:[], topProjects:[], warnings:[], mismatch:[]
  };
}
/** Snapshot -> DATA. Acilista hicbir sunucu turu yapilmadan cagrilir. */
function useSnapshot(snap){
  splashSet(96,'rendering');
  DATA={ period:snap.period, reportMonth:snap.reportMonth,
         sites:(snap.sites||[]).map(unpackSite),
         missingSites:snap.missingSites||[], unknownSheets:snap.unknownSheets||[],
         builtAt:snap.builtAt||null, hasDetails:false };
  NAV={level:'ro',expandedRo:null,ro:null,siteIdx:null};
  F.ro='ALL'; F.site='ALL'; F.q=''; if($('inpSearch')) $('inpSearch').value='';
  buildFilters(); render(); splashHide();
  prefetchDetails(snap.period.key);
}
/** Agir yari: ilk boyamadan SONRA, arka planda. Kullanici beklemez. */
function prefetchDetails(key){
  if(!hasServer()) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error||!res.details) return;
      mergeDetails(res.details);
    })
    /* Detay gelmezse ekran calismaya devam eder; yalniz TOPS/ekip bos kalir. */
    .withFailureHandler(function(){})
    .getPeriodDetails(key);
}
function mergeDetails(list){
  if(!DATA) return;
  var byKey={};
  list.forEach(function(d){ byKey[d.key]=d; });
  DATA.sites.forEach(function(st){
    var d=byKey[st.key]; if(!d) return;
    st.indicators=d.indicators||{}; st.hrRoles=d.hrRoles||[];
    st.topProjects=d.topProjects||[]; st.warnings=d.warnings||[]; st.mismatch=d.mismatch||[];
  });
  DATA.hasDetails=true;
  /* Yalniz detayin gorundugu ekranlarda yeniden ciz — kullanici RO listesinde
     gezinirken ekranin altindan kaymasi rahatsiz edici olurdu. */
  if(NAV.level==='site'||F.ro!=='ALL') render();
}
/** Veri tazelik damgasi (ust seritte). */
function renderStamp(){
  var el=$('dataStamp'); if(!el) return;
  if(!DATA||!DATA.builtAt){ el.hidden=true; return; }
  var d=new Date(DATA.builtAt);
  if(isNaN(d.getTime())){ el.hidden=true; return; }
  var mins=Math.round((Date.now()-d.getTime())/60000);
  var rel=mins<2?t('justNow')
        :(mins<60?mins+' '+t('minutesAgo')
        :Math.round(mins/60)+' '+t('hoursAgo'));
  var abs=d.toLocaleString(LOCALE,{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
  el.hidden=false;
  el.innerHTML='<span class="stamp-dot" aria-hidden="true"></span>'+
    esc(t('dataAsOf'))+' <b>'+esc(abs)+'</b> <i>('+esc(rel)+')</i>'+
    (BOOT&&BOOT.isAdmin?'<button type="button" id="btnRefreshData">'+ICON_REFRESH+
      esc(t('refreshData'))+'</button>':'');
  var rb=$('btnRefreshData');
  if(rb) rb.onclick=refreshDataNow;
}
function refreshDataNow(){
  if(!hasServer()||!DATA) return;
  var rb=$('btnRefreshData');
  if(rb){ rb.disabled=true; rb.innerHTML=ICON_REFRESH+esc(t('refreshing')); }
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ showToast((r&&r.error)||'Refresh failed','error'); renderStamp(); return; }
      showToast(r.message||'Refreshed','success');
      reloadPeriod(DATA.period.key);
    })
    .withFailureHandler(function(e){
      showToast('Server error: '+((e&&e.message)||e),'error'); renderStamp();
    })
    .uiRefreshPeriod(DATA.period.key);
}
function hasServer(){
  return typeof google!=='undefined'&&google.script&&google.script.run;
}

/* ---------- loading ----------
   48 sayfa tek cagrida okunurken Apps Script zaman asimina girip HTTP 502
   veriyordu ve ilerleme cubugu tek bir degerde donuyordu. Artik once ucuz bir
   meta cagrisi yapiliyor, sonra sayfalar CHUNK_SIZE'lik parcalar halinde
   sirayla cekiliyor — her parca sonrasi ilerleme gercek ilerlemeyi gosteriyor. */
var CHUNK_SIZE=8;
/**
 * Donem yukleme. ONCE hazir snapshot denenir (tek hizli cagri); yalniz o donem
 * icin henuz snapshot uretilmemisse eski parca parca okuma yoluna dusulur.
 * Parcali yol artik istisna: ayda bir, yeni dosya kayda girdiginde.
 */
function loadPeriod(key){
  if(!hasServer()){ loadPeriodChunked(key); return; }
  splashSet(40,'readingPeriod');
  $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+'</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.snapshot){ useSnapshot(res.snapshot); return; }
      if(res&&res.error){
        $('view').innerHTML='<div class="notice err">'+esc(res.error)+'</div>';
        splashHide(); return;
      }
      loadPeriodChunked(key);          // needsBuild
    })
    .withFailureHandler(function(){ loadPeriodChunked(key); })
    .getPeriodSnapshot(key);
}
/** Yenile sonrasi: acilis ekranini gostermeden ayni donemi tekrar cek. */
function reloadPeriod(key){
  if(!hasServer()) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.snapshot){
        var keepNav={level:NAV.level,expandedRo:NAV.expandedRo,ro:NAV.ro,siteIdx:NAV.siteIdx};
        var keepF={ro:F.ro,site:F.site,q:F.q};
        useSnapshot(res.snapshot);
        NAV=keepNav; F.ro=keepF.ro; F.site=keepF.site; F.q=keepF.q;
        if($('inpSearch')) $('inpSearch').value=F.q;
        buildRoSiteSelects(); render();
      }
    })
    .withFailureHandler(function(){})
    .getPeriodSnapshot(key);
}
function loadPeriodChunked(key){
  splashSet(30,'readingPeriod');
  $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+'</div>';
  google.script.run
    .withSuccessHandler(function(meta){
      if(!meta||meta.error){
        $('view').innerHTML='<div class="notice err">'+esc(meta&&meta.error||'Unknown error')+'</div>';
        splashHide(); return;
      }
      loadChunks(key,meta);
    })
    .withFailureHandler(function(err){ loadFailed(err); })
    .getPeriodMeta(key);
}
function loadFailed(err){
  var m=(err&&err.message)||String(err||'');
  $('view').innerHTML='<div class="notice err">Server error: '+esc(m)+'</div>';
  splashHide();
}
function loadChunks(key,meta){
  var total=meta.total||0, collected=[], from=0;
  if(!total){ finishLoad(key,meta,[]); return; }
  function next(){
    if(from>=total){ finishLoad(key,meta,collected); return; }
    var to=Math.min(total,from+CHUNK_SIZE);
    $('splashStage').textContent=t('readingPeriod')+'  '+from+'–'+to+' / '+total;
    $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+
      ' '+from+'–'+to+' / '+total+'</div>';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||res.error){
          $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Unknown error')+'</div>';
          splashHide(); return;
        }
        collected=collected.concat(res.sites||[]);
        from=res.to||to;
        splashSet(30+Math.round(62*from/total));
        next();
      })
      .withFailureHandler(function(err){ loadFailed(err); })
      .getPeriodChunk(key,from,to,false);
  }
  next();
}
/* Parcalar birlestikten sonraki son gecis: ayni site'in birden cok ayi varsa
   en guncelini tut, sonra raporlama ayinin gerisinde kalanlari isaretle.
   (Eskiden sunucuda yapiliyordu; parcali okumada butun ancak burada olusuyor.) */
function finishLoad(key,meta,sites){
  splashSet(94,'rendering');
  var seen={};
  sites.forEach(function(s){
    var k=s.key||s.sheet;
    var prev=seen[k];
    if(!prev||((s.month||0)>(prev.month||0))) seen[k]=s;
  });
  var out=[]; for(var k in seen){ if(seen.hasOwnProperty(k)) out.push(seen[k]); }
  var maxMonth=0;
  out.forEach(function(s){ if(s.month>maxMonth) maxMonth=s.month; });
  out.forEach(function(s){
    if(s.month&&s.month<maxMonth&&s.status==='ok') s.status='behind-schedule';
  });
  DATA={ period:meta.period, reportMonth:maxMonth, sites:out,
         missingSites:meta.missingSites||[], unknownSheets:meta.unknownSheets||[],
         builtAt:new Date().toISOString(), hasDetails:true };
  NAV={level:'ro',expandedRo:null,ro:null,siteIdx:null};
  F.ro='ALL'; F.site='ALL'; F.q=''; if($('inpSearch')) $('inpSearch').value='';
  buildFilters(); render(); splashHide();
}
/* Ay adi secili dile gore yerellestirilir; sunucu etiketi yalniz yedek. */
function monthNameOf(p){
  try{
    return cap(new Date(2000,(p.month||1)-1,1).toLocaleDateString(LOCALE,{month:'long'}));
  }catch(e){ return p.label.split(' ')[0]; }
}
function buildPeriodSelects(defaultKey){
  var byYear={};
  BOOT.periods.forEach(function(p){ (byYear[p.year]=byYear[p.year]||[]).push(p); });
  var years=Object.keys(byYear).map(Number).sort(function(a,b){ return b-a; });
  var def=BOOT.periods.filter(function(p){ return p.key===defaultKey; })[0]||BOOT.periods[0];

  $('selYear').innerHTML=years.map(function(y){
    return '<option value="'+y+'"'+(y===def.year?' selected':'')+'>'+y+'</option>';
  }).join('');
  function renderMonths(year,selMonth){
    var months=byYear[year].slice().sort(function(a,b){ return a.month-b.month; });
    $('selMonth').innerHTML=months.map(function(p){
      return '<option value="'+p.month+'"'+(p.month===selMonth?' selected':'')+'>'+esc(monthNameOf(p))+'</option>';
    }).join('');
  }
  renderMonths(def.year,def.month);
  $('selYear').onchange=function(){
    var y=parseInt(this.value,10);
    var months=byYear[y].slice().sort(function(a,b){ return b.month-a.month; });
    renderMonths(y,months[0].month);
    loadPeriod(months[0].key);
  };
  $('selMonth').onchange=function(){
    var y=parseInt($('selYear').value,10), mm=parseInt(this.value,10);
    var p=byYear[y].filter(function(x){ return x.month===mm; })[0];
    if(p) loadPeriod(p.key);
  };
}

function applyBootstrap(res){
  BOOT=res;
  if($('inpQuery')) $('inpQuery').value=res.gmailQuery||'';
  /* Settings sadece yetkili hesaplarda gorunur — asil kontrol Code.gs'te
     (requireAdmin_), bu yalniz gereksiz bir butonu gizleyen UX katmani. */
  $('btnSettings').hidden=!res.isAdmin;
}
function noPeriodYet(){
  $('view').innerHTML='<div class="notice">'+esc(t('noPeriodYet'))+'</div>';
  splashHide();
}
/**
 * Acilis.
 *
 * HIZLI YOL: sunucu (doGet) bootstrap'i ve hazir snapshot'i sayfaya gomdugu
 * icin burada hicbir google.script.run turu yapilmiyor — ekran dogrudan
 * ciziliyor. Eskiden burasi 8 ardisik sunucu turu yapiyordu ve acilis
 * ekraninda 30-60 sn bekleniyordu.
 *
 * YEDEK YOL: gomulu paket yoksa (onizleme, ya da snapshot henuz uretilmemis
 * bir donem) eski cagri sirasi aynen calisir.
 */
function boot(){
  var pre=(typeof PRELOAD!=='undefined')?PRELOAD:null;
  if(pre&&!pre.error&&pre.boot&&!pre.boot.error){
    applyBootstrap(pre.boot);
    if(!pre.boot.periods.length){ noPeriodYet(); return; }
    buildPeriodSelects(pre.boot.periods[0].key);
    if(pre.snapshot){ useSnapshot(pre.snapshot); return; }
    loadPeriod(pre.boot.periods[0].key);
    return;
  }
  if(pre&&pre.error){
    $('view').innerHTML='<div class="notice err">'+esc(pre.error)+'</div>';
    splashHide(); return;
  }
  if(!hasServer()){ splashHide(); return; }

  splashSet(24,'loadingData');
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){
        $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Could not load start-up data')+'</div>';
        splashHide(); return;
      }
      applyBootstrap(res);
      if(!res.periods.length){ noPeriodYet(); return; }
      buildPeriodSelects(res.periods[0].key);
      loadPeriod(res.periods[0].key);
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
      splashHide();
    })
    .getBootstrap();
}

/* ---------- theme (docs/koyu-mod.md) ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark-mode',dark);
  $('btnTheme').setAttribute('aria-pressed',String(dark));
  $('btnThemeIcon').innerHTML=dark?ICON_SUN:ICON_MOON;   // ikon hedef durumu gosterir
  try{ localStorage.setItem('roDashTheme',dark?'dark':'light'); }catch(e){}
}
function initTheme(){
  var saved=null; try{ saved=localStorage.getItem('roDashTheme'); }catch(e){}
  var dark=saved?saved==='dark'
    :(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(!!dark);
  $('btnTheme').onclick=function(){ applyTheme(!document.body.classList.contains('dark-mode')); };
}

/* ---------- panels ---------- */
function logS(m){ $('settingsLog').textContent=m; }
/**
 * Yeni kaydedilen bir donemin snapshot'ini hemen kurar.
 * Bu yapilmazsa o donemi ilk acan kullanici parcali okuma yolunu (ve uzun
 * beklemeyi) ustlenir; burada bekleyen kisi zaten yonetici.
 */
function buildSnapshotFor(key, done){
  logS('Building snapshot for '+key+'… (reading 48 sheets, this takes a moment)');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error) logS('Snapshot could not be built: '+((r&&r.error)||'unknown'));
      else logS(r.message);
      done();
    })
    .withFailureHandler(function(e){ logS('Snapshot build failed: '+((e&&e.message)||e)); done(); })
    .uiRefreshPeriod(key);
}
function initPanels(){
  $('glossSearch').oninput=function(){ fillGlossary(null,this.value); };
  $('btnGloss').onclick=function(){ openGloss(null); };
  $('btnCloseGloss').onclick=function(){ $('dlgGloss').close(); };
  $('btnSettings').onclick=function(){ $('dlgSettings').showModal(); };
  $('btnCloseSettings').onclick=function(){ $('dlgSettings').close(); };
  $('btnScan').onclick=function(){
    logS('Scanning Gmail…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Scan failed','error'); return; }
        var lines=(r.found||[]).map(function(f){ return (f.isNew?'NEW      ':'existing ')+f.key+'  '+f.name; });
        logS(r.threadCount+' email threads scanned.\n'+
             (lines.length?lines.join('\n'):'No new period found.')+
             ((r.errors||[]).length?'\n\nSkipped:\n'+r.errors.join('\n'):''));
        showToast(r.threadCount+' threads scanned — '+(lines.length||0)+' period(s) found','success');
        var fresh=(r.found||[]).filter(function(f){ return f.isNew; })[0];
        if(fresh) buildSnapshotFor(fresh.key, function(){ boot(); });
        else boot();
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Server error: '+m); showToast('Server error: '+m,'error'); })
      .uiScanGmail();
  };
  $('btnSaveQuery').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not save','error'); return; }
        logS('Query saved: '+r.query); showToast('Query saved','success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiSetGmailQuery($('inpQuery').value);
  };
  $('btnTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not install trigger','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiInstallTrigger();
  };
  $('btnSnapTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not install','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiInstallSnapshotTrigger();
  };
  /* Gecmis donemlerin snapshot'i yoksa kurar; ilk kez o aya bakan kullanici
     40-60 sn beklemesin diye. Tek seferde 3 donem (6 dk yurutme siniri). */
  $('btnEnsureSnaps').onclick=function(){
    logS('Building snapshots for periods that do not have one yet…');
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Failed','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiEnsureSnapshots();
  };
  $('btnAdd').onclick=function(){
    logS('Adding…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not add','error'); return; }
        logS(r.message); showToast('Period added','success'); $('inpUrl').value='';
        if(r.key) buildSnapshotFor(r.key, function(){ boot(); }); else boot();
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Server error: '+m); showToast('Server error: '+m,'error'); })
      .uiAddPeriod($('inpUrl').value);
  };
}

window.addEventListener('resize',function(){ closeFlyout(); if(DATA) render(); });
initLang(); initTheme(); initPanels(); initDrawer(); initSplash(); fillGlossary(null); boot();
</script>
