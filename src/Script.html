function openFeedback(){
  FB.type=null; FB.prio='Medium'; FB.busy=false;
  $('fbMsg').value=''; fbClearImage(); fbNote(''); buildFbPickers();
  $('btnFbSend').disabled=false; $('btnFbSend').textContent=t('send');
  $('dlgFeedback').showModal();
  $('fbMsg').focus();
}
function sendFeedback(){
  if(FB.busy) return;
  if(!FB.type){ fbNote(t('pickType'),'err'); return; }
  if(!FB.prio){ fbNote(t('pickPriority'),'err'); return; }
  var msg=$('fbMsg').value.trim();
  if(!msg){ fbNote(t('writeMessage'),'err'); $('fbMsg').focus(); return; }
  if(!hasServer()){ fbNote('Server not available.','err'); return; }

  FB.busy=true;
  $('btnFbSend').disabled=true; $('btnFbSend').textContent=t('sending');
  fbNote('');
  google.script.run
    .withSuccessHandler(function(r){
      FB.busy=false;
      $('btnFbSend').disabled=false; $('btnFbSend').textContent=t('send');
      if(!r||r.error){ fbNote((r&&r.error)||'Could not send','err'); return; }
      $('dlgFeedback').close();
      showToast(t('feedbackThanks'),'success');
      /* Kayit olup BILDIRIM gidemediyse bu sessiz kaliyordu: sunucu uyariyi
         donuyordu ama istemci okumuyordu. */
      if(r.warning) showToast(r.warning,'error');
    })
    .withFailureHandler(function(e){
      FB.busy=false;
      $('btnFbSend').disabled=false; $('btnFbSend').textContent=t('send');
      fbNote('Server error: '+((e&&e.message)||e),'err');
    })
    .submitFeedback({ type:FB.type, priority:FB.prio, message:msg,
                      image:FB.image, imageName:FB.imageName });
}
function initFeedback(){
  $('btnFeedback').onclick=openFeedback;
  $('btnHelpFeedback').onclick=function(){ closeHelp(); openFeedback(); };
  $('btnFbClose').onclick=function(){ $('dlgFeedback').close(); };
  $('btnFbCancel').onclick=function(){ $('dlgFeedback').close(); };
  $('btnFbSend').onclick=sendFeedback;
  $('fbClear').onclick=function(e){ e.stopPropagation(); fbClearImage(); };

  var dz=$('fbDrop');
  dz.onclick=function(){ $('fbFile').click(); };
  dz.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('fbFile').click(); } };
  $('fbFile').onchange=function(){ fbSetImage(this.files&&this.files[0]); };
  ['dragenter','dragover'].forEach(function(ev){
    dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove('over'); });
  });
  dz.addEventListener('drop',function(e){
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) fbSetImage(f);
  });
  /* Ctrl+V: yalniz pencere acikken, panoda goruntu varsa */
  document.addEventListener('paste',function(e){
    if(!$('dlgFeedback').open) return;
    var items=(e.clipboardData&&e.clipboardData.items)||[];
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image/')===0){ fbSetImage(items[i].getAsFile()); e.preventDefault(); return; }
    }
  });
}

/* ---------- toast (docs/bilesenler.md — showToast) ---------- */
function showToast(msg,type){
  var el=document.createElement('div');
  el.className='toast toast-'+(type||'info');
  el.setAttribute('role',type==='error'?'alert':'status');
  el.setAttribute('aria-live',type==='error'?'assertive':'polite');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300);
  },2700);
}

/* ---------- snapshot cozme ----------
   Sunucu olculeri yer kazanmak icin sabit sirali DIZI olarak yaziyor
   (Snapshot.gs "PAKETLEME"). Burada eski obje sekline geri cevriliyor,
   boylece arayuzun geri kalani snapshot'tan mi parcali okumadan mi geldigini
   hic bilmiyor. Alan sirasi Snapshot.gs MEASURE_FIELDS ile AYNI olmali. */
var MEASURE_FIELDS=['count','turnover','ytdCount','ytdTurnover','planYtdCount','planYtdTurnover'];
function unpackMeasure(a){
  var m=emptyM();
  if(!a) return m;
  for(var i=0;i<MEASURE_FIELDS.length;i++) m[MEASURE_FIELDS[i]]=a[i]||0;
  return m;
}
function unpackSite(p){
  var blocks=(p.bl||[]).map(function(b){
    var byType={};
    ['P1','P10','TTM'].forEach(function(t){ byType[t]=unpackMeasure(b.y&&b.y[t]); });
    return { customer:b.c, status:b.s, byType:byType, total:unpackMeasure(b.t) };
  });
  var total=emptyM();
  blocks.forEach(function(b){ addM(total,b.total); });
  return {
    ro:p.ro, site:p.site, key:p.key, sheet:p.sheet, month:p.month, status:p.status,
    headcount:p.hc||0,
    budgetCount:p.bc, budgetYTDCount:p.by, budgetTurnover:p.bt,
    /* Gerceklesen: Bolum 3 "Launch Done" (M€) ve Bolum 4 "Real Launches"
       (adet). Manuel raporun kullandigi kaynak bunlar. */
    launchDoneTurnover:p.ld||null, realCountSheet:p.rc||null,
    /* Budget YTD cirosu "LS OI <yil>" sayfasindan (M€). Yoksa undefined
       kalir ve detaydan hesaplanan degere dusulur. */
    budgetYtdOI:(typeof p.bq==='number')?p.bq:null,
    detail:{blocks:blocks,total:total},
    /* agir yari sonra gelir (prefetchDetails) */
    indicators:{}, hrRoles:[], topProjects:[], warnings:[], mismatch:[]
  };
}
/** Snapshot -> DATA. Acilista hicbir sunucu turu yapilmadan cagrilir. */
function useSnapshot(snap){
  splashSet(96,'rendering');
  DATA={ period:snap.period, reportMonth:snap.reportMonth,
         sites:(snap.sites||[]).map(unpackSite),
         missingSites:snap.missingSites||[], unknownSheets:snap.unknownSheets||[],
         builtAt:snap.builtAt||null, hasDetails:false };
  NAV={level:'ro',expandedRo:null,ro:null,siteIdx:null};
  F.ro='ALL'; F.site='ALL'; F.q=''; if($('inpSearch')) $('inpSearch').value='';
  buildFilters(); render(); splashHide();
  prefetchDetails(snap.period.key);
}
/** Agir yari: ilk boyamadan SONRA, arka planda. Kullanici beklemez. */
function prefetchDetails(key){
  if(!hasServer()) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error||!res.details) return;
      mergeDetails(res.details);
    })
    /* Detay gelmezse ekran calismaya devam eder; yalniz TOPS/ekip bos kalir. */
    .withFailureHandler(function(){})
    .getPeriodDetails(key);
}
function mergeDetails(list){
  if(!DATA) return;
  var byKey={};
  list.forEach(function(d){ byKey[d.key]=d; });
  DATA.sites.forEach(function(st){
    var d=byKey[st.key]; if(!d) return;
    st.indicators=d.indicators||{}; st.hrRoles=d.hrRoles||[];
    st.topProjects=d.topProjects||[]; st.warnings=d.warnings||[]; st.mismatch=d.mismatch||[];
  });
  DATA.hasDetails=true;
  renderUserChip();          // kisi bir site'in HR listesinde bulunabilir
  /* Yalniz detayin gorundugu ekranlarda yeniden ciz — kullanici RO listesinde
     gezinirken ekranin altindan kaymasi rahatsiz edici olurdu. */
  if(NAV.level==='site'||F.ro!=='ALL') render();
}
/** Veri tazelik damgasi (ust seritte). */
function renderStamp(){
  var el=$('dataStamp'); if(!el) return;
  if(!DATA||!DATA.builtAt){ el.hidden=true; return; }
  var d=new Date(DATA.builtAt);
  if(isNaN(d.getTime())){ el.hidden=true; return; }
  var mins=Math.round((Date.now()-d.getTime())/60000);
  var rel=mins<2?t('justNow')
        :(mins<60?mins+' '+t('minutesAgo')
        :Math.round(mins/60)+' '+t('hoursAgo'));
  var abs=d.toLocaleString(LOCALE,{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
  el.hidden=false;
  el.innerHTML='<span class="stamp-dot" aria-hidden="true"></span>'+
    esc(t('dataAsOf'))+' <b>'+esc(abs)+'</b> <i>('+esc(rel)+')</i>'+
    (BOOT&&BOOT.isAdmin?'<button type="button" id="btnRefreshData">'+ICON_REFRESH+
      esc(t('refreshData'))+'</button>':'');
  var rb=$('btnRefreshData');
  if(rb) rb.onclick=refreshDataNow;
}
function refreshDataNow(){
  if(!hasServer()||!DATA) return;
  var rb=$('btnRefreshData');
  if(rb){ rb.disabled=true; rb.innerHTML=ICON_REFRESH+esc(t('refreshing')); }
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ showToast((r&&r.error)||'Refresh failed','error'); renderStamp(); return; }
      showToast(r.message||'Refreshed','success');
      reloadPeriod(DATA.period.key);
    })
    .withFailureHandler(function(e){
      showToast('Server error: '+((e&&e.message)||e),'error'); renderStamp();
    })
    .uiRefreshPeriod(DATA.period.key);
}
function hasServer(){
  return typeof google!=='undefined'&&google.script&&google.script.run;
}

/* ---------- loading ----------
   48 sayfa tek cagrida okunurken Apps Script zaman asimina girip HTTP 502
   veriyordu ve ilerleme cubugu tek bir degerde donuyordu. Artik once ucuz bir
   meta cagrisi yapiliyor, sonra sayfalar CHUNK_SIZE'lik parcalar halinde
   sirayla cekiliyor — her parca sonrasi ilerleme gercek ilerlemeyi gosteriyor. */
var CHUNK_SIZE=8;
/**
 * Donem yukleme. ONCE hazir snapshot denenir (tek hizli cagri); yalniz o donem
 * icin henuz snapshot uretilmemisse eski parca parca okuma yoluna dusulur.
 * Parcali yol artik istisna: ayda bir, yeni dosya kayda girdiginde.
 */
function loadPeriod(key){
  if(!hasServer()){ loadPeriodChunked(key); return; }
  splashSet(40,'readingPeriod');
  $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+'</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.snapshot){ useSnapshot(res.snapshot); return; }
      if(res&&res.error){
        $('view').innerHTML='<div class="notice err">'+esc(res.error)+'</div>';
        splashHide(); return;
      }
      loadPeriodChunked(key);          // needsBuild
    })
    .withFailureHandler(function(){ loadPeriodChunked(key); })
    .getPeriodSnapshot(key);
}
/** Yenile sonrasi: acilis ekranini gostermeden ayni donemi tekrar cek. */
function reloadPeriod(key){
  if(!hasServer()) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.snapshot){
        var keepNav={level:NAV.level,expandedRo:NAV.expandedRo,ro:NAV.ro,siteIdx:NAV.siteIdx};
        var keepF={ro:F.ro,site:F.site,q:F.q};
        useSnapshot(res.snapshot);
        NAV=keepNav; F.ro=keepF.ro; F.site=keepF.site; F.q=keepF.q;
        if($('inpSearch')) $('inpSearch').value=F.q;
        buildRoSiteSelects(); render();
      }
    })
    .withFailureHandler(function(){})
    .getPeriodSnapshot(key);
}
function loadPeriodChunked(key){
  splashSet(30,'readingPeriod');
  $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+'</div>';
  google.script.run
    .withSuccessHandler(function(meta){
      if(!meta||meta.error){
        $('view').innerHTML='<div class="notice err">'+esc(meta&&meta.error||'Unknown error')+'</div>';
        splashHide(); return;
      }
      loadChunks(key,meta);
    })
    .withFailureHandler(function(err){ loadFailed(err); })
    .getPeriodMeta(key);
}
function loadFailed(err){
  var m=(err&&err.message)||String(err||'');
  $('view').innerHTML='<div class="notice err">Server error: '+esc(m)+'</div>';
  splashHide();
}
function loadChunks(key,meta){
  var total=meta.total||0, collected=[], from=0;
  if(!total){ finishLoad(key,meta,[]); return; }
  function next(){
    if(from>=total){ finishLoad(key,meta,collected); return; }
    var to=Math.min(total,from+CHUNK_SIZE);
    $('splashStage').textContent=t('readingPeriod')+'  '+from+'–'+to+' / '+total;
    $('view').innerHTML='<div class="spinner" role="status">'+esc(t('readingPeriod'))+
      ' '+from+'–'+to+' / '+total+'</div>';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||res.error){
          $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Unknown error')+'</div>';
          splashHide(); return;
        }
        collected=collected.concat(res.sites||[]);
        from=res.to||to;
        splashSet(30+Math.round(62*from/total));
        next();
      })
      .withFailureHandler(function(err){ loadFailed(err); })
      .getPeriodChunk(key,from,to,false);
  }
  next();
}
/* Parcalar birlestikten sonraki son gecis: ayni site'in birden cok ayi varsa
   en guncelini tut, sonra raporlama ayinin gerisinde kalanlari isaretle.
   (Eskiden sunucuda yapiliyordu; parcali okumada butun ancak burada olusuyor.) */
function finishLoad(key,meta,sites){
  splashSet(94,'rendering');
  var seen={};
  sites.forEach(function(s){
    var k=s.key||s.sheet;
    var prev=seen[k];
    if(!prev||((s.month||0)>(prev.month||0))) seen[k]=s;
  });
  var out=[]; for(var k in seen){ if(seen.hasOwnProperty(k)) out.push(seen[k]); }
  var maxMonth=0;
  out.forEach(function(s){ if(s.month>maxMonth) maxMonth=s.month; });
  out.forEach(function(s){
    if(s.month&&s.month<maxMonth&&s.status==='ok') s.status='behind-schedule';
  });
  DATA={ period:meta.period, reportMonth:maxMonth, sites:out,
         missingSites:meta.missingSites||[], unknownSheets:meta.unknownSheets||[],
         builtAt:new Date().toISOString(), hasDetails:true };
  NAV={level:'ro',expandedRo:null,ro:null,siteIdx:null};
  F.ro='ALL'; F.site='ALL'; F.q=''; if($('inpSearch')) $('inpSearch').value='';
  buildFilters(); render(); splashHide();
}
/* Ay adi secili dile gore yerellestirilir; sunucu etiketi yalniz yedek. */
function monthName(m){
  try{ return cap(new Date(2000,(m||1)-1,1).toLocaleDateString(LOCALE,{month:'long'})); }
  catch(e){ return String(m); }
}
/* Donem etiketi kapsadigi AYLARI soyler: iki ay tek raporda toplandiysa
   ("BEKASI_07+08") secicide "August" yazmak Temmuz'u kayip gosteriyordu. */
function monthNameOf(p){
  var ms=(p&&p.months&&p.months.length)?p.months.slice().sort(function(a,b){return a-b;}):null;
  if(!ms) return monthName(p&&p.month);
  if(ms.length===1) return monthName(ms[0]);
  if(ms.length===2) return monthName(ms[0])+' & '+monthName(ms[1]);
  return monthName(ms[0])+' — '+monthName(ms[ms.length-1]);
}
function buildPeriodSelects(defaultKey){
  var byYear={};
  BOOT.periods.forEach(function(p){ (byYear[p.year]=byYear[p.year]||[]).push(p); });
  var years=Object.keys(byYear).map(Number).sort(function(a,b){ return b-a; });
  var def=BOOT.periods.filter(function(p){ return p.key===defaultKey; })[0]||BOOT.periods[0];

  $('selYear').innerHTML=years.map(function(y){
    return '<option value="'+y+'"'+(y===def.year?' selected':'')+'>'+y+'</option>';
  }).join('');
  function renderMonths(year,selMonth){
    var months=byYear[year].slice().sort(function(a,b){ return a.month-b.month; });
    $('selMonth').innerHTML=months.map(function(p){
      return '<option value="'+p.month+'"'+(p.month===selMonth?' selected':'')+'>'+esc(monthNameOf(p))+'</option>';
    }).join('');
  }
  renderMonths(def.year,def.month);
  $('selYear').onchange=function(){
    var y=parseInt(this.value,10);
    var months=byYear[y].slice().sort(function(a,b){ return b.month-a.month; });
    renderMonths(y,months[0].month);
    loadPeriod(months[0].key);
  };
  $('selMonth').onchange=function(){
    var y=parseInt($('selYear').value,10), mm=parseInt(this.value,10);
    var p=byYear[y].filter(function(x){ return x.month===mm; })[0];
    if(p) loadPeriod(p.key);
  };
}

  /* Ayarlar herkese gorunur; icerideki eylemler yoneticiye ozel
     (applySettingsPerms). */
  $('btnSettings').hidden=false;
  SET.readOnly=!res.isAdmin;
  bellRefresh();
  renderUserChip();
}
function noPeriodYet(){
  $('view').innerHTML='<div class="notice">'+esc(t('noPeriodYet'))+'</div>';
  splashHide();
}
/**
 * Acilis.
 *
 * HIZLI YOL: sunucu (doGet) bootstrap'i ve hazir snapshot'i sayfaya gomdugu
 * icin burada hicbir google.script.run turu yapilmiyor — ekran dogrudan
 * ciziliyor. Eskiden burasi 8 ardisik sunucu turu yapiyordu ve acilis
 * ekraninda 30-60 sn bekleniyordu.
 *
 * YEDEK YOL: gomulu paket yoksa (onizleme, ya da snapshot henuz uretilmemis
 * bir donem) eski cagri sirasi aynen calisir.
 */
function boot(){
  var pre=(typeof PRELOAD!=='undefined')?PRELOAD:null;
  if(pre&&!pre.error&&pre.boot&&!pre.boot.error){
    applyBootstrap(pre.boot);
    if(!pre.boot.periods.length){ noPeriodYet(); return; }
    buildPeriodSelects(pre.boot.periods[0].key);
    if(pre.snapshot){ useSnapshot(pre.snapshot); return; }
    loadPeriod(pre.boot.periods[0].key);
    return;
  }
  if(pre&&pre.error){
    $('view').innerHTML='<div class="notice err">'+esc(pre.error)+'</div>';
    splashHide(); return;
  }
  if(!hasServer()){ splashHide(); return; }

  splashSet(24,'loadingData');
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){
        $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Could not load start-up data')+'</div>';
        splashHide(); return;
      }
      applyBootstrap(res);
      if(!res.periods.length){ noPeriodYet(); return; }
      buildPeriodSelects(res.periods[0].key);
      loadPeriod(res.periods[0].key);
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
      splashHide();
    })
    .getBootstrap();
}

/* ---------- theme (docs/koyu-mod.md) ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark-mode',dark);
  $('btnTheme').setAttribute('aria-pressed',String(dark));
  $('btnThemeIcon').innerHTML=dark?ICON_SUN:ICON_MOON;   // ikon hedef durumu gosterir
  try{ localStorage.setItem('roDashTheme',dark?'dark':'light'); }catch(e){}
}
function initTheme(){
  var saved=null; try{ saved=localStorage.getItem('roDashTheme'); }catch(e){}
  var dark=saved?saved==='dark'
    :(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(!!dark);
  $('btnTheme').onclick=function(){ applyTheme(!document.body.classList.contains('dark-mode')); };
}

/* ---------- panels ---------- */
function logS(m){
  var el=$('settingsLog');
  el.textContent=m||'';
  el.hidden=!m;              /* bos kutu eksik bir sey varmis gibi duruyor */
}
/**
 * Yeni kaydedilen bir donemin snapshot'ini hemen kurar.
 * Bu yapilmazsa o donemi ilk acan kullanici parcali okuma yolunu (ve uzun
 * beklemeyi) ustlenir; burada bekleyen kisi zaten yonetici.
 */
/* ---------- Ayarlar: kayitli donemler ----------
   Panelde yalniz "ekle" vardi. Yanlis dosya eklendiginde (ornek: Agustos
   icin aylik rapor yerine baska bir dosyanin linki) donemi kaldirmanin tek
   yolu Apps Script editoru idi. Liste hangi ayin hangi dosyadan geldigini
   ve KAC SITE TANINDIGINI gosteriyor -- yanlis dosya oradan hemen belli
   oluyor (48 yerine 1). */
/* ================== PARSER DENETIMI ==================
 * "Sayilar yanlis geliyor" tespitini "su hucre yanlis okunuyor" tespitine
 * cevirmek icin. Her ozet deger, okundugu HUCRE ADRESI ve ham icerigiyle;
 * gerceklesen toplamlar ise toplami olusturan TUM proje satirlariyla
 * gosteriliyor -- hangi satirin neden sayilip sayilmadigi gorunsun.
 */
var AUD={sites:[],i:0,last:null};

/* Denetim EKRANDA ACIK olan donemi okur: baska bir donemi denetlemek,
   kullanicinin bakmadigi sayilari tartismak olurdu. */
function audPeriodKey(){
  return (DATA&&DATA.period&&DATA.period.key)||
         (BOOT&&BOOT.periods&&BOOT.periods[0]&&BOOT.periods[0].key)||'';
}

function audLog(m){ var el=$('auditLog'); el.textContent=m||''; el.hidden=!m; }

function audNum(v,unit){
  if(v==null) return '<span class="aud-na">n/a</span>';
  return (unit==='M€')?(m2(v)+' <i>M€</i>'):(nf(v)+' <i>'+esc(t('projects'))+'</i>');
}

function audCellsHtml(cells){
  if(!cells||!cells.length) return '<span class="aud-na">computed, not a single cell</span>';
  return cells.map(function(c){
    return '<span class="aud-cell" title="'+esc(c.ctx)+'"><b>'+esc(c.a1)+'</b> '+
           esc(c.raw===''?'(empty)':c.raw)+(c.note?' <em>'+esc(c.note)+'</em>':'')+'</span>';
  }).join('');
}

function audRender(r){
  if(!r||r.error){ $('audBody').innerHTML='<div class="ib-empty">'+esc((r&&r.error)||'unknown')+'</div>'; return; }
  AUD.last=r;
  var s=r.site;
  var h='<div class="aud-head">'+
    '<b>'+esc(s.ro)+' · '+esc(s.site)+'</b>'+
    '<span>sheet <code>'+esc(s.sheet)+'</code> · month '+esc(s.month)+'/'+esc(s.year)+
    ' · status '+esc(s.status)+'</span>'+
    '<span>'+esc(s.period)+'</span>'+
  '</div>';

  /* Panodaki degerler FILTRESIZ okunuyor (TOTAL, NEW+REMAN). Filtre acikken
     ekrandaki sayi farkli olur; bu not olmadan "tutmuyor" sanilir. */
  h+='<p class="aud-note">Values below are unfiltered: row <b>TOTAL</b>, '+
     '<b>NEW + REMAN</b> — the same thing the dashboard shows when no filter is set.</p>';

  h+='<table class="aud-t"><thead><tr><th>Value</th><th>Number</th>'+
     '<th>Where it comes from</th><th>Cells read</th></tr></thead><tbody>';
  (r.summary||[]).forEach(function(x){
    h+='<tr><td>'+esc(x.label)+'</td>'+
       '<td class="aud-v">'+audNum(x.value,x.unit)+'</td>'+
       '<td class="aud-src">'+esc(x.source)+'</td>'+
       '<td>'+audCellsHtml(x.cells)+'</td></tr>';
  });
  h+='</tbody></table>';

  var c=r.cross||{};
  var diff=(c.sheetReal==null)?null:(c.parsedReal-c.sheetReal);
  h+='<div class="aud-cross'+(diff?' bad':'')+'">'+
     '<b>Cross-check</b> — the sheet\'s own <i>Real Launches</i> column says '+
     (c.sheetReal==null?'n/a':nf(c.sheetReal))+', counted from the detail blocks: '+
     nf(c.parsedReal)+
     (diff?' → <b>difference '+(diff>0?'+':'')+nf(diff)+'</b>':' → match')+
     '<div>'+audCellsHtml(c.cells)+'</div></div>';

  h+='<table class="aud-t"><thead><tr><th>Detail block</th><th>Rows</th>'+
     '<th>Projects</th><th>Turnover k€</th><th>Real YTD</th><th>Real k€</th>'+
     '<th>Plan YTD k€</th></tr></thead><tbody>';
  (r.blocks||[]).forEach(function(b){
    h+='<tr><td>'+esc(b.block)+'</td><td>'+nf(b.rows)+'</td><td>'+nf(b.count)+'</td>'+
       '<td>'+nf(Math.round(b.turnover))+'</td><td>'+nf(b.ytdCount)+'</td>'+
       '<td>'+nf(Math.round(b.ytdTurnover))+'</td>'+
       '<td>'+nf(Math.round(b.planYtdTurnover))+'</td></tr>';
  });
  h+='</tbody></table>';

  h+='<div class="aud-sub">Every project row the parser read'+
     (r.rowsCut?' (first '+nf(r.rows.length)+' of '+nf(r.rowsTotal)+')':'')+
     ' — <b>Real YTD</b> marks the rows counted into Real launches.</div>';
  h+='<div class="aud-scroll"><table class="aud-t rows"><thead><tr>'+
     '<th>Row</th><th>Block</th><th>Project</th><th>Type</th>'+
     '<th>Plan date</th><th>Real date</th><th>k€</th><th>Real YTD</th><th>Plan YTD</th>'+
     '</tr></thead><tbody>';
  (r.rows||[]).forEach(function(x){
    h+='<tr'+(x.inRealYtd?' class="in"':'')+'>'+
       '<td>'+esc(x.row)+'</td><td>'+esc(x.block)+'</td>'+
       '<td>'+esc(x.model||'')+'</td><td>'+esc(x.type||'')+'</td>'+
       '<td>'+esc(x.planRaw||'')+(x.planMonth?' <i>→'+x.planMonth+'</i>':'')+'</td>'+
       '<td>'+esc(x.realRaw||'')+(x.realMonth?' <i>→'+x.realMonth+'</i>':'')+'</td>'+
       '<td>'+nf(Math.round(x.turnover))+'</td>'+
       '<td>'+(x.inRealYtd?'✓':'')+'</td><td>'+(x.inPlanYtd?'✓':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';

  if((r.warnings||[]).length){
    h+='<div class="aud-warn"><b>Parser warnings</b><ul>'+
       r.warnings.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('')+'</ul></div>';
  }
  $('audBody').innerHTML=h;
}

function audLoad(){
  var it=AUD.sites[AUD.i]; if(!it) return;
  $('selAudSite').value=it.key;
  $('audBody').innerHTML='<div class="ib-empty">Reading '+esc(it.site)+'…</div>';
  audLog('');
  google.script.run
    .withSuccessHandler(audRender)
    .withFailureHandler(function(e){
      $('audBody').innerHTML='<div class="ib-empty">'+esc((e&&e.message)||'error')+'</div>'; })
    .auditSite(audPeriodKey(), it.key);
}

function audStep(d){
  AUD.i=Math.max(0,Math.min(AUD.sites.length-1,AUD.i+d));
  audLoad();
}

/* Tabloyu duz metin olarak: spreadsheet'in yanina koyup satir satir
   karsilastirmak icin. */
function audText(){
  var r=AUD.last; if(!r) return '';
  var L=[];
  L.push(r.site.ro+' · '+r.site.site+'  (sheet '+r.site.sheet+', '+r.site.month+'/'+r.site.year+')');
  L.push(r.site.period);
  L.push('unfiltered: row TOTAL, NEW + REMAN');
  L.push('');
  (r.summary||[]).forEach(function(x){
    var v=(x.value==null)?'n/a':(x.unit==='M€'?m2(x.value)+' M€':nf(x.value)+' projects');
    L.push(x.label+': '+v);
    L.push('   from: '+x.source);
    (x.cells||[]).forEach(function(c){ L.push('   cell '+c.a1+' = "'+c.raw+'"'+(c.note?' ('+c.note+')':'')); });
  });
  var c=r.cross||{};
  L.push('');
  L.push('cross-check — sheet Real Launches: '+(c.sheetReal==null?'n/a':c.sheetReal)+
         ' / counted from detail: '+c.parsedReal);
  L.push('');
  L.push('block                 rows  proj   k€    realYTD  real k€  planYTD k€');
  (r.blocks||[]).forEach(function(b){
    L.push(pad(b.block,21)+pad(b.rows,6)+pad(b.count,6)+pad(Math.round(b.turnover),7)+
           pad(b.ytdCount,8)+pad(Math.round(b.ytdTurnover),9)+Math.round(b.planYtdTurnover));
  });
  L.push('');
  L.push('row  block                 project                        type  plan      real      k€     realYTD');
  (r.rows||[]).forEach(function(x){
    L.push(pad(x.row,5)+pad(x.block,22)+pad(String(x.model||'').slice(0,29),31)+
           pad(x.type||'',6)+pad(x.planRaw||'',10)+pad(x.realRaw||'',10)+
           pad(Math.round(x.turnover),7)+(x.inRealYtd?'YES':''));
  });
  if((r.warnings||[]).length){ L.push(''); L.push('warnings:'); r.warnings.forEach(function(w){ L.push(' - '+w); }); }
  return L.join('\n');
  function pad(v,n){ var s=String(v==null?'':v); while(s.length<n) s+=' '; return s; }
}

  $('audBody').innerHTML='<div class="ib-empty">Loading site list…</div>';

/* ---- Ayarlar: herkes GORUR, yalniz yonetici DEGISTIRIR ----
 * Once bu panel yoneticiden baskasina hic gosterilmiyordu; "hangi ay hangi
 * dosyadan geliyor, bu donem kac site tanidi" bilgisi kimse tarafindan
 * gorulemiyordu. Artik panel herkese acik, eylemler yoneticiye kapali.
 *
 * Bu yalniz GORUNURLUK katmani: uiScanGmail / uiAddPeriod / uiRemovePeriod /
 * uiSaveQuery ve tetikleyici kurucular sunucuda requireAdmin_ ile korunuyor,
 * buradaki gizleme kaldirilsa bile yetkisiz cagri reddedilir.
 */
var SET={readOnly:!(window.BOOT&&BOOT.isAdmin)};

function applySettingsPerms(){
  var ro=SET.readOnly;
  /* Yonetici alanlari BLOK olarak gizlenir (data-adm): tek tek dugme
     gizlemek geriye bos satirlar birakiyordu. Yonetici olmayana kalan:
     aciklama, salt-okuma notu ve kayitli donem listesi. */
  var dlg=$('dlgSettings');
  if(dlg){
    Array.prototype.forEach.call(dlg.querySelectorAll('[data-adm]'),function(el){
      el.hidden=ro;
    });
  }
  var note=$('setRoNote'); if(note) note.hidden=!ro;
}

function renderPeriodList(rows){
  var box=$('periodList'); if(!box) return;
  if(!rows||!rows.length){ box.innerHTML='<div class="p-empty">'+esc(t('noPeriods'))+'</div>'; return; }
  box.innerHTML=rows.map(function(r){
    var n=(r.sites==null)?null:r.sites;
    var bad=(n!=null&&n<SITE_WARN_MIN);
    return '<div class="prow'+(bad?' bad':'')+'">'+
      '<div class="p-main"><b>'+esc(r.label||r.key)+'</b>'+
        '<span class="p-file">'+esc(r.name||'')+'</span></div>'+
      '<span class="p-sites'+(bad?' bad':'')+'">'+
        (n==null?'—':nf(n)+' '+esc(sitesWord(n)))+'</span>'+
      (SET.readOnly?'':
        '<button class="btn ghost p-del" type="button" data-delkey="'+esc(r.key)+'">'+
        esc(t('remove'))+'</button>')+
    '</div>';
  }).join('');
  box.querySelectorAll('[data-delkey]').forEach(function(b){
    b.onclick=function(){
      var key=b.getAttribute('data-delkey');
      if(!window.confirm(t('removeConfirm').replace('{k}',key))) return;
      logS('Removing '+key+'…');
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Failed','error'); return; }
          logS(r.message||(key+' removed')); showToast(r.message||'Removed','success');
          loadPeriodList(); boot();
        })
        .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Server error: '+m); showToast('Server error: '+m,'error'); })
        .uiRemovePeriod(key);
    };
  });
}
/* Bu esigin altinda kalan donem "yanlis dosya" olarak isaretlenir. Kayitta
   48 site var; bir avuc site tanindiysa dosya aylik rapor degildir. */
var SITE_WARN_MIN=10;
function loadPeriodList(){
  if(!hasServer()) return;
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.periods) return;
      /* Sunucu kimin ne yapabilecegini soyluyor; istemci buna gore ciziyor.
         Gercek engel yine sunucuda (requireAdmin_) -- burasi yalniz
         gorunurluk, bkz. docs/yetki-gorunumu.md. */
      if(r.readOnly!==undefined) SET.readOnly=!!r.readOnly;
      applySettingsPerms();
      renderPeriodList(r.periods);
    })
    .withFailureHandler(function(){})
    .uiListPeriods();
}
function buildSnapshotFor(key, done){
  logS('Building snapshot for '+key+'… (reading 48 sheets, this takes a moment)');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error) logS('Snapshot could not be built: '+((r&&r.error)||'unknown'));
      else {
        logS(r.message);
        /* Yanlis dosya eklendiginde bu SESSIZ kaliyordu: donem ekleniyor,
           ekran sifirlarla aciliyordu. Tanınan site sayisi dusukse uyar. */
        if(r.siteCount!=null&&r.siteCount<SITE_WARN_MIN)
          showToast(t('fewSites').replace('{n}',nf(r.siteCount)),'error');
      }
      loadPeriodList();
      done();
    })
    .withFailureHandler(function(e){ logS('Snapshot build failed: '+((e&&e.message)||e)); done(); })
    .uiRefreshPeriod(key);
}
/* ================= geri bildirim gelen kutusu =================
 * Geri bildirimleri okumak icin spreadsheet'i acmak, ekran goruntusunu
 * gormek icin de her satirin Drive baglantisini ayri sekmede aramak
 * gerekiyordu. Burada ikisi yan yana: mesaj + goruntu + karar.
 */
var IB={items:[],filter:'ALL',shots:{},sel:{}};

/* ---- ust cubuktaki zil ----
 * Yalniz yoneticide gorunur. Rozet: KARARI VERILMEMIS geri bildirim sayisi.
 * Sunucu tarafinda 2 dk onbellekli; karar yazilinca onbellek dusuyor.
 */
function bellRefresh(){
  if(!(BOOT&&BOOT.isAdmin)) return;
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.admin) return;
      var btn=$('btnBell'), el=$('bellCount'), n=r.count||0;
      btn.hidden=false;
      el.hidden=!n;
      el.textContent=n>99?'99+':String(n);
      btn.classList.toggle('has-new',!!n);
      btn.title=n?(n+' feedback waiting for a decision'):'Feedback';
    })
    .withFailureHandler(function(){})
    .feedbackBadge();
}

function ibLog(m){
  var el=$('inboxLog');
  el.textContent=m||'';
  el.hidden=!m;            /* bos kutu ekranda bir seyin eksik oldugunu dusundurtuyor */
}

function ibBadge(txt,cls){ return '<span class="ib-badge '+cls+'">'+esc(txt)+'</span>'; }

function ibItemHtml(it,i){
  var tcls=/bug/i.test(it.type)?'bug':'imp';
  var pcls=/urgent/i.test(it.priority)?'urgent':'';
  var sel=['','Reviewing','Planned','Done','Rejected'].map(function(v){
    return '<option value="'+esc(v)+'"'+(v===it.status?' selected':'')+'>'+
           esc(v||'— no decision —')+'</option>'; }).join('');
  var shot=it.shotId
    ? '<button class="ib-shot" type="button" data-shot="'+i+'">'+
      '<span class="ib-load">Loading screenshot…</span></button>'
    : '';
  return '<div class="ib-item'+(it.shotId?'':' no-shot')+
         (IB.sel[it.row]?' picked':'')+'" data-item="'+it.row+'">'+
    '<div>'+
      '<div class="ib-meta">'+
        '<label class="ib-pick"><input type="checkbox" data-pick="'+it.row+'"'+
          (IB.sel[it.row]?' checked':'')+'><span>Select</span></label>'+
        ibBadge(it.type||'—',tcls)+ibBadge(it.priority||'—',pcls)+
        '<span class="ib-id">'+esc(it.id||'')+'</span>'+
        '<span class="ib-who">'+esc(it.name||it.email||'')+
          (it.date?' · '+esc(it.date):'')+'</span>'+
      '</div>'+
      '<p class="ib-msg">'+esc(it.message)+'</p>'+
      '<div class="ib-foot">'+
        '<label class="ib-id" for="ibs'+i+'">Decision</label>'+
        '<select id="ibs'+i+'" data-row="'+it.row+'">'+sel+'</select>'+
        (it.comments?'<span class="ib-id">note: '+esc(it.comments)+'</span>':'')+
      '</div>'+
    '</div>'+shot+'</div>';
}

function ibVisible(){
  return IB.items.filter(function(it){
    if(IB.filter==='ALL') return true;
    if(IB.filter==='OPEN') return !it.status || it.status==='Reviewing';
    if(IB.filter==='SHOT') return !!it.shotId;
    return (it.type||'').toUpperCase()===IB.filter;
  });
}

function ibRenderFilters(){
  var defs=[['ALL','All'],['OPEN','Not decided'],['BUG','Bugs'],
            ['IMPROVEMENT','Improvements'],['SHOT','With screenshot']];
  $('ibFilters').innerHTML=defs.map(function(d){
    return '<button class="ib-f" type="button" data-f="'+d[0]+'" aria-pressed="'+
           (IB.filter===d[0])+'">'+esc(d[1])+'</button>'; }).join('');
  Array.prototype.forEach.call($('ibFilters').querySelectorAll('.ib-f'),function(b){
    b.onclick=function(){ IB.filter=b.getAttribute('data-f'); ibRenderFilters(); ibRenderList(); };
  });
}

function ibRenderList(){
  var list=ibVisible();
  var host=$('ibList');
  if(!list.length){ host.innerHTML='<div class="ib-empty">Nothing here yet.</div>'; return; }
  /* Indeks GORUNEN listeye gore; goruntu yuklerken bu listeden okunuyor. */
  IB.view=list;
  host.innerHTML=list.map(ibItemHtml).join('');
  Array.prototype.forEach.call(host.querySelectorAll('select[data-row]'),function(sel){
    sel.onchange=function(){ ibSetStatus(parseInt(sel.getAttribute('data-row'),10), sel.value); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('input[data-pick]'),function(cb){
    cb.onchange=function(){
      var row=parseInt(cb.getAttribute('data-pick'),10);
      if(cb.checked) IB.sel[row]=true; else delete IB.sel[row];
      var card=host.querySelector('[data-item="'+row+'"]');
      if(card) card.classList.toggle('picked',cb.checked);
      ibSyncBar();
    };
  });
  ibSyncBar();
  Array.prototype.forEach.call(host.querySelectorAll('.ib-shot'),function(btn){
    var it=IB.view[parseInt(btn.getAttribute('data-shot'),10)];
    ibLoadShot(btn,it);
  });
}

/* Goruntuler tek tek, gorundukleri anda cekiliyor: 6 MB'lik goruntuleri
   tek yanitta tasimak listeyi dakikalarca bekletirdi. */
function ibLoadShot(btn,it){
  function show(url){
    btn.innerHTML='<img alt="screenshot" src="'+url+'">';
    btn.onclick=function(){ ibZoom(url); };
  }
  if(IB.shots[it.shotId]){ show(IB.shots[it.shotId]); return; }
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ btn.innerHTML='<span class="ib-load">'+esc((r&&r.error)||'not available')+'</span>'; return; }
      IB.shots[it.shotId]=r.dataUrl; show(r.dataUrl);
    })
    .withFailureHandler(function(e){
      btn.innerHTML='<span class="ib-load">'+esc((e&&e.message)||'error')+'</span>'; })
    .feedbackShot(it.shotId);
}

function ibZoom(url){
  var d=document.createElement('div');
  d.className='ib-zoom';
  d.innerHTML='<img alt="screenshot" src="'+url+'">';
  d.onclick=function(){ d.remove(); };
  document.body.appendChild(d);
}

function ibSetStatus(row,status){
  ibLog('Saving decision…');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ ibLog('Error: '+((r&&r.error)||'unknown')); return; }
      IB.items.forEach(function(it){ if(it.row===r.row) it.status=r.status; });
      ibLog('Row '+r.row+' → '+(r.status||'(cleared)'));
      showToast('Decision saved','success');
    })
    .withFailureHandler(function(e){ ibLog('Server error: '+((e&&e.message)||e)); })
    .setFeedbackStatus(row,status);
}

/* ---- secim cubugu ve gelistirme kuyrugu ----
 * "Send" iki is yapar: (1) secilen kayitlar sayfada Planned olarak
 * isaretlenir -- karar kalici kayit olur; (2) uygulanabilir bir brif metni
 * panoya kopyalanir.
 *
 * NEDEN KOPYA: bu panodan disariya kendiliginden is akitacak bir kanal yok;
 * brif, gelistirme oturumuna YAPISTIRILMAK icin hazirlaniyor. Elle derleyip
 * yazmakla farki: tek tusla, eksiksiz ve her seferinde ayni bicimde.
 */
function ibSelCount(){ return Object.keys(IB.sel).length; }

function ibSyncBar(){
  var n=ibSelCount();
  $('ibBar').hidden=!n;
  $('ibSelN').textContent=n+(n===1?' item selected':' items selected');
}

function ibSelected(){
  return IB.items.filter(function(it){ return IB.sel[it.row]; });
}

/* Brif yapistirildigi yerde tek basina anlasilsin: kim, ne zaman, hangi
   oncelik, hangi kayit numarasi. Ekran goruntusunun BAGLANTISI yazilir ama
   goruntunun kendisi metne sigmaz -- brif bunu acikca soyluyor. */
function ibBrief(list){
  var head='RO Monthly Report - implementation queue ('+list.length+' item'+
           (list.length===1?'':'s')+', '+new Date().toISOString().slice(0,10)+')';
  var body=list.map(function(it,i){
    return (i+1)+') ['+(it.id||('row '+it.row))+'] '+(it.type||'?')+' - '+
           (it.priority||'?')+' - '+(it.name||it.email||'')+
           (it.date?' - '+it.date:'')+'\n'+
           it.message.split('\n').map(function(l){ return '   '+l; }).join('\n')+
           (it.shotLink?'\n   Screenshot: '+it.shotLink+
                        '  (open the Feedback inbox to see it)':'');
  }).join('\n\n');
  return head+'\n\n'+body+'\n\nMarked as Planned in the feedback sheet.';
}

function ibCopy(txt,doneMsg){
  var fallback=function(){
    ibLog(txt);                       /* pano kapaliysa metin yine de gorunsun */
    showToast('Clipboard blocked - the text is shown below','error');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      ibLog(doneMsg); showToast(doneMsg,'success');
    },fallback);
  } else fallback();
}

function ibQueue(){
  var list=ibSelected();
  if(!list.length) return;
  var rows=list.map(function(it){ return it.row; });
  ibLog('Sending…');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ ibLog('Error: '+((r&&r.error)||'unknown')); return; }
      var sent={};
      (r.rows||[]).forEach(function(x){ sent[x]=true; });
      IB.items.forEach(function(it){ if(sent[it.row]) it.status='Planned'; });
      IB.sel={};
      ibCopy(ibBrief(list),
             (r.rows||[]).length+' item(s) queued and copied - paste into the development chat.');
      ibRenderList();
      bellRefresh();
    })
    .withFailureHandler(function(e){ ibLog('Server error: '+((e&&e.message)||e)); })
    .queueFeedback(rows);
}

/* Duz metin dokum: gelen kutusundaki her sey tek blok halinde kopyalanir,
   baska bir yere (e-posta, not, sohbet) oldugu gibi yapistirilabilir. */
function ibCopyText(){
  var lines=ibVisible().map(function(it){
    return '--- '+(it.id||('row '+it.row))+' | '+(it.type||'?')+' | '+(it.priority||'?')+
           ' | '+(it.date||'')+' | '+(it.name||it.email||'')+
           (it.status?' | status: '+it.status:'')+'\n'+it.message+
           (it.shotLink?'\nScreenshot: '+it.shotLink:'');
  });
  ibCopy(lines.join('\n\n')||'(empty)', 'Copied '+ibVisible().length+' item(s).');
}

function openInbox(){
  IB.sel={};
  $('dlgInbox').showModal();
  ibRenderFilters();
  $('ibList').innerHTML='<div class="ib-empty">Loading…</div>';
  ibLog('');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||r.error){ $('ibList').innerHTML='<div class="ib-empty">'+esc((r&&r.error)||'unknown')+'</div>'; return; }
      IB.items=r.items||[];
      if(!r.statusCol) ibLog('No "Status" column yet — it will be created on the first decision.');
      ibRenderList();
    })
    .withFailureHandler(function(e){
      $('ibList').innerHTML='<div class="ib-empty">'+esc((e&&e.message)||'error')+'</div>'; })
    .listFeedback();
}

function initPanels(){
  $('helpSearch').oninput=function(){ fillHelp(this.value); };
  $('btnHelp').onclick=function(){ openHelp(''); };
  $('btnHelpClose').onclick=closeHelp;
  $('helpScrim').onclick=closeHelp;
  $('btnSettings').onclick=function(){
    $('dlgSettings').showModal(); applySettingsPerms(); loadPeriodList();
  };
  $('btnCloseSettings').onclick=function(){ $('dlgSettings').close(); };
  $('btnInbox').onclick=function(){ $('dlgSettings').close(); openInbox(); };
  $('btnAudit').onclick=function(){ $('dlgSettings').close(); openAudit(); };
  $('btnCloseAudit').onclick=function(){ $('dlgAudit').close(); };
  $('btnAudPrev').onclick=function(){ audStep(-1); };
  $('btnAudNext').onclick=function(){ audStep(1); };
  $('selAudSite').onchange=function(){
    for(var i=0;i<AUD.sites.length;i++) if(AUD.sites[i].key===this.value){ AUD.i=i; break; }
    audLoad();
  };
  $('btnAudCopy').onclick=function(){
    var txt=audText();
    if(!txt) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        audLog('Copied.'); showToast('Copied','success'); },function(){ audLog(txt); });
    } else audLog(txt);
  };
  $('btnBell').onclick=function(){ openInbox(); };
  $('btnCloseInbox').onclick=function(){ $('dlgInbox').close(); bellRefresh(); };
  $('btnIbCopy').onclick=ibCopyText;
  $('btnIbSend').onclick=ibQueue;
  $('btnIbNone').onclick=function(){ IB.sel={}; ibRenderList(); };
  $('btnScan').onclick=function(){
    logS('Scanning Gmail…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Scan failed','error'); return; }
        var lines=(r.found||[]).map(function(f){ return (f.isNew?'NEW      ':'existing ')+f.key+'  '+f.name; });
        logS(r.threadCount+' email threads scanned.\n'+
             (lines.length?lines.join('\n'):'No new period found.')+
             ((r.errors||[]).length?'\n\nSkipped:\n'+r.errors.join('\n'):''));
        showToast(r.threadCount+' threads scanned — '+(lines.length||0)+' period(s) found','success');
        var fresh=(r.found||[]).filter(function(f){ return f.isNew; })[0];
        if(fresh) buildSnapshotFor(fresh.key, function(){ boot(); });
        else boot();
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Server error: '+m); showToast('Server error: '+m,'error'); })
      .uiScanGmail();
  };
  $('btnSaveQuery').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not save','error'); return; }
        logS('Query saved: '+r.query); showToast('Query saved','success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiSetGmailQuery($('inpQuery').value);
  };
  $('btnTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not install trigger','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiInstallTrigger();
  };
  $('btnSnapTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not install','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiInstallSnapshotTrigger();
  };
  /* Gecmis donemlerin snapshot'i yoksa kurar; ilk kez o aya bakan kullanici
     40-60 sn beklemesin diye. Tek seferde 3 donem (6 dk yurutme siniri). */
  $('btnEnsureSnaps').onclick=function(){
    logS('Building snapshots for periods that do not have one yet…');
    google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Failed','error'); return; }
        logS(r.message); showToast(r.message,'success');
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Error: '+m); showToast('Error: '+m,'error'); })
      .uiEnsureSnapshots();
  };
  /* Geri bildirim boru hattini panelde gorunur kilar: hedef sekme, sutun
     eslesmesi, kayitli satir sayisi, son kayit ve bildirim e-postasinin
     alicisi. Once bunlarin hicbiri gorunmuyordu. */
  $('btnCheckFb').onclick=function(){
    logS('Checking feedback pipeline…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); return; }
        logS(r.message);
      })
      .withFailureHandler(function(e){ logS('Server error: '+((e&&e.message)||e)); })
      .uiCheckFeedback();
  };
  $('btnTestMail').onclick=function(){
    logS('Sending test e-mail…');
    google.script.run
      .withSuccessHandler(function(r){ logS((r&&r.message)||(r&&r.error)||'unknown'); })
      .withFailureHandler(function(e){ logS('Server error: '+((e&&e.message)||e)); })
      .uiTestMail();
  };
  $('btnAdd').onclick=function(){
    logS('Adding…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); showToast(r&&r.error||'Could not add','error'); return; }
        logS(r.message); showToast('Period added','success'); $('inpUrl').value='';
        if(r.key) buildSnapshotFor(r.key, function(){ boot(); }); else boot();
      })
      .withFailureHandler(function(e){ var m=e&&e.message||e; logS('Server error: '+m); showToast('Server error: '+m,'error'); })
      .uiAddPeriod($('inpUrl').value);
  };
}

window.addEventListener('resize',function(){ if(DATA) render(); });
initLang(); initTheme(); initPanels(); initDrawer(); initFeedback(); initSplash(); boot();
</script>
