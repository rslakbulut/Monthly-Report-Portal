<script>
/* Valeo RO Dashboard — istemci.
   Veri sozlesmesi: docs/veri-listeleme.md — success VE failure handler zorunlu,
   success icinde result.error MUTLAKA denetlenir. */

var BOOT = null, DATA = null, CHART = null;
var F = { status:'NEW', type:'ALL', customer:'ALL' };
var NAV = { level:'ro', ro:null, siteIdx:null };

/* ---------- yardimcilar ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nf(n,d){ return (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US',
  {minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function money(mEur){ return mEur==null?'—':nf(mEur,2)+' M€'; }
function signed(n){ return n==null?'—':(n>0?'+':'')+nf(n,0); }

function emptyM(){ return {count:0,turnover:0,ytdCount:0,ytdTurnover:0,planYtdCount:0,planYtdTurnover:0}; }
function addM(a,b){ for(var k in a){ a[k]+=b[k]||0; } return a; }

/* ---------- toplama ---------- */
/** Bir site'in secili filtrelere gore gerceklesen olcumu (detay bloklarindan). */
function realizedOf(site){
  var out = emptyM();
  if(!site.detail || !site.detail.blocks) return out;
  site.detail.blocks.forEach(function(b){
    if(b.status !== F.status) return;
    if(F.customer !== 'ALL' && b.customer !== F.customer) return;
    if(F.type === 'ALL'){ addM(out, b.total); }
    else if(b.byType && b.byType[F.type]){ addM(out, b.byType[F.type]); }
  });
  return out;
}
/** Ozet bloklardan butce satiri. Tip ve musteri ayni anda caprazlanamaz. */
function budgetRowKey(){
  if(F.customer !== 'ALL') return F.customer;
  if(F.type !== 'ALL') return F.type;
  return 'TOTAL';
}
function budgetOf(site){
  var k = budgetRowKey();
  var bc = site.budgetCount && site.budgetCount[k];
  var by = site.budgetYTDCount && site.budgetYTDCount[k];
  var bt = site.budgetTurnover && site.budgetTurnover[k];
  return {
    count:    bc ? bc[F.status] : null,
    ytdCount: by ? by[F.status] : null,
    turnover: bt ? bt[F.status] : null      // M€ — yalniz TOTAL/VS/OES satirlari var
  };
}
function siteMetrics(site){
  var b = budgetOf(site), r = realizedOf(site);
  return {
    budgetCount:b.count, budgetYTD:b.ytdCount, budgetTurnover:b.turnover,
    realCount:r.ytdCount, realTurnoverM:r.ytdTurnover/1000,
    planTurnoverM:r.planYtdTurnover/1000,
    portfolioCount:r.count, portfolioTurnoverM:r.turnover/1000,
    delta:(b.ytdCount==null)?null:(r.ytdCount-b.ytdCount),
    deltaTurnoverM:(r.planYtdTurnover?(r.ytdTurnover-r.planYtdTurnover)/1000:null)
  };
}
function sumMetrics(list){
  var acc={budgetCount:0,budgetYTD:0,budgetTurnover:0,realCount:0,realTurnoverM:0,
           planTurnoverM:0,portfolioTurnoverM:0,behind:0,reported:0};
  list.forEach(function(s){
    var m=siteMetrics(s);
    ['budgetCount','budgetYTD','budgetTurnover','realCount','realTurnoverM','planTurnoverM','portfolioTurnoverM']
      .forEach(function(k){ if(m[k]!=null) acc[k]+=m[k]; });
    if(m.delta!=null && m.delta<0) acc.behind++;
    if(s.status!=='no-data') acc.reported++;
  });
  acc.delta = acc.budgetYTD ? (acc.realCount-acc.budgetYTD) : (acc.realCount||0)-(acc.budgetYTD||0);
  return acc;
}
function sitesOfRo(ro){ return (DATA.sites||[]).filter(function(s){ return s.ro===ro; }); }
function hasReman(){
  return (DATA.sites||[]).some(function(s){
    return (s.detail&&s.detail.blocks||[]).some(function(b){ return b.status==='REMAN' && b.total.count>0; });
  });
}

/* ---------- cizim ---------- */
function render(){
  if(!DATA){ return; }
  if(DATA.error){ $('view').innerHTML='<div class="notice err">'+esc(DATA.error)+'</div>'; return; }
  buildStatusSeg();
  if(NAV.level==='ro') renderRoLevel();
  else if(NAV.level==='sites') renderSitesLevel();
  else renderSiteLevel();
  if(window.innerWidth<=768) document.querySelectorAll('table').forEach(function(t){ t.classList.add('m-cards'); });
}

function crumb(parts){
  $('crumb').innerHTML = parts.map(function(p,i){
    if(p.go) return '<button type="button" data-go="'+p.go+'">'+esc(p.t)+'</button>'+
                    (i<parts.length-1?'<span aria-hidden="true">›</span>':'');
    return '<b>'+esc(p.t)+'</b>';
  }).join('');
  $('crumb').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ var g=b.getAttribute('data-go');
      if(g==='ro'){ NAV={level:'ro',ro:null,siteIdx:null}; }
      else if(g==='sites'){ NAV.level='sites'; NAV.siteIdx=null; }
      render(); };
  });
}

function kpiRow(a, label){
  var pctCount = a.budgetCount ? Math.round(a.realCount/a.budgetCount*100) : null;
  var pctMoney = a.budgetTurnover ? Math.round(a.realTurnoverM/a.budgetTurnover*100) : null;
  var deltaCls = a.delta==null?'':(a.delta<0?'bad':'good');
  return '<div class="kpis">'+
    '<div class="kpi"><div class="kpi-label">Annual commitment</div>'+
      '<div class="kpi-value">'+nf(a.budgetCount)+'</div>'+
      '<div class="kpi-sub">projects · '+money(a.budgetTurnover)+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Plan to date</div>'+
      '<div class="kpi-value">'+nf(a.budgetYTD)+'</div>'+
      '<div class="kpi-sub">projects (Budget YTD)</div></div>'+
    '<div class="kpi"><div class="kpi-label">Achieved</div>'+
      '<div class="kpi-value">'+nf(a.realCount)+'</div>'+
      '<div class="kpi-sub">projects · '+money(a.realTurnoverM)+
      (pctCount!=null?' · '+pctCount+'% of the year':'')+'</div></div>'+
    '<div class="kpi '+deltaCls+'"><div class="kpi-label">Variance vs plan</div>'+
      '<div class="kpi-value">'+signed(a.delta)+'</div>'+
      '<div class="kpi-sub">'+(a.behind?a.behind+' site'+(a.behind>1?'s':'')+' behind':'no site behind')+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Reporting sites</div>'+
      '<div class="kpi-value">'+a.reported+'<span style="font-size:.55em;color:var(--text-dim)"> / '+
        BOOT.siteCount+'</span></div>'+
      '<div class="kpi-sub">'+(pctMoney!=null?pctMoney+'% of budgeted turnover':'&nbsp;')+'</div></div>'+
  '</div>';
}

function renderRoLevel(){
  crumb([{t:'All ROs'}]);
  var all = DATA.sites||[];
  var html = kpiRow(sumMetrics(all));
  html += '<div class="cards">';
  BOOT.roOrder.forEach(function(ro){
    var list = sitesOfRo(ro); if(!list.length) return;
    var a = sumMetrics(list);
    var cls = a.delta<0?'bad':'good';
    html += '<button class="card" type="button" data-ro="'+ro+'">'+
      '<h3>'+esc(ro)+' <span class="badge '+cls+'">'+signed(a.delta)+'</span></h3>'+
      '<div class="sub">'+esc(BOOT.roLabels[ro]||'')+' · '+list.length+' sites</div>'+
      '<div class="rowline"><span>Achieved / plan</span><span class="v">'+nf(a.realCount)+' / '+nf(a.budgetYTD)+'</span></div>'+
      '<div class="rowline"><span>Annual commitment</span><span class="v">'+nf(a.budgetCount)+' projects</span></div>'+
      '<div class="rowline"><span>Turnover (achieved)</span><span class="v">'+money(a.realTurnoverM)+'</span></div>'+
      '<div class="rowline"><span>Reporting</span><span class="v">'+a.reported+' / '+list.length+'</span></div>'+
      '</button>';
  });
  html += '</div>';
  html += '<div class="chartcard"><h3 style="margin:0 0 10px;font-size:15px">Plan vs achieved by RO</h3>'+
          '<div class="chart-canvas-wrap"><canvas id="roChart"></canvas></div></div>';
  html += noticeBlock();
  $('view').innerHTML = html;
  $('view').querySelectorAll('[data-ro]').forEach(function(b){
    b.onclick=function(){ NAV={level:'sites',ro:b.getAttribute('data-ro'),siteIdx:null}; render(); };
  });
  drawRoChart();
}

function renderSitesLevel(){
  crumb([{t:'All ROs',go:'ro'},{t:NAV.ro+' — '+(BOOT.roLabels[NAV.ro]||'')}]);
  var list = sitesOfRo(NAV.ro);
  var html = kpiRow(sumMetrics(list));
  var rows = list.map(function(s,i){ return {s:s,m:siteMetrics(s),i:i}; });
  rows.sort(function(a,b){                       // en geride olan en ustte
    var av=(a.m.delta==null?9999:a.m.delta), bv=(b.m.delta==null?9999:b.m.delta);
    return av-bv;
  });
  html += '<div class="tablewrap"><table><thead><tr>'+
    '<th>Site</th><th class="num">Annual</th><th class="num">Plan (YTD)</th>'+
    '<th class="num">Achieved</th><th class="num">Variance</th><th class="num">Turnover</th><th>Status</th>'+
    '</tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr data-i="'+r.i+'">'+
      '<td data-label="Site">'+esc(r.s.site)+'</td>'+
      '<td class="num" data-label="Annual">'+nf(r.m.budgetCount)+'</td>'+
      '<td class="num" data-label="Plan (YTD)">'+nf(r.m.budgetYTD)+'</td>'+
      '<td class="num" data-label="Achieved">'+nf(r.m.realCount)+'</td>'+
      '<td class="num" data-label="Variance"><span class="badge '+(r.m.delta==null?'mute':(r.m.delta<0?'bad':'good'))+'">'+
        signed(r.m.delta)+'</span></td>'+
      '<td class="num" data-label="Turnover">'+money(r.m.realTurnoverM)+'</td>'+
      '<td data-label="Status">'+statusBadge(r.s.status)+'</td></tr>';
  });
  html += '</tbody></table></div>'+noticeBlock();
  $('view').innerHTML = html;
  $('view').querySelectorAll('tr[data-i]').forEach(function(tr){
    tr.onclick=function(){ NAV.level='site'; NAV.siteIdx=parseInt(tr.getAttribute('data-i'),10); render(); };
  });
}

function statusBadge(st){
  if(st==='ok') return '<span class="badge good">OK</span>';
  if(st==='behind-schedule') return '<span class="badge warn">behind schedule</span>';
  if(st==='inconsistent') return '<span class="badge warn">inconsistent data</span>';
  if(st==='no-data') return '<span class="badge mute">no data</span>';
  return '<span class="badge mute">'+esc(st)+'</span>';
}

function renderSiteLevel(){
  var list = sitesOfRo(NAV.ro), s = list[NAV.siteIdx];
  if(!s){ NAV.level='sites'; return render(); }
  crumb([{t:'All ROs',go:'ro'},{t:NAV.ro,go:'sites'},{t:s.site}]);
  var m = siteMetrics(s);
  var html = '<div class="kpis">'+
    '<div class="kpi"><div class="kpi-label">Annual commitment</div><div class="kpi-value">'+nf(m.budgetCount)+
      '</div><div class="kpi-sub">'+money(m.budgetTurnover)+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Plan (YTD)</div><div class="kpi-value">'+nf(m.budgetYTD)+'</div></div>'+
    '<div class="kpi"><div class="kpi-label">Achieved</div><div class="kpi-value">'+nf(m.realCount)+
      '</div><div class="kpi-sub">'+money(m.realTurnoverM)+'</div></div>'+
    '<div class="kpi '+(m.delta<0?'bad':'good')+'"><div class="kpi-label">Variance</div><div class="kpi-value">'+
      signed(m.delta)+'</div><div class="kpi-sub">'+
      (m.deltaTurnoverM!=null?money(m.deltaTurnoverM)+' turnover gap':'no turnover plan')+'</div></div></div>';

  // Type x customer matrix (two independent axes, exactly as in the source sheet)
  html += '<div class="tablewrap"><table><thead><tr><th>Breakdown</th><th class="num">Portfolio count</th>'+
          '<th class="num">Achieved count</th><th class="num">Achieved turnover</th></tr></thead><tbody>';
  [['P1','Project type P1'],['P10','Project type P10'],['TTM','Project type TTM']].forEach(function(t){
    var acc=emptyM();
    (s.detail.blocks||[]).forEach(function(b){
      if(b.status!==F.status) return;
      if(b.byType&&b.byType[t[0]]) addM(acc,b.byType[t[0]]);
    });
    html+='<tr><td data-label="Breakdown">'+t[1]+'</td><td class="num" data-label="Portfolio">'+nf(acc.count)+
      '</td><td class="num" data-label="Achieved">'+nf(acc.ytdCount)+
      '</td><td class="num" data-label="Turnover">'+money(acc.ytdTurnover/1000)+'</td></tr>';
  });
  ['VS','OES'].forEach(function(c){
    var acc=emptyM();
    (s.detail.blocks||[]).forEach(function(b){
      if(b.status!==F.status || b.customer!==c) return; addM(acc,b.total);
    });
    html+='<tr><td data-label="Breakdown">Customer '+c+'</td><td class="num" data-label="Portfolio">'+nf(acc.count)+
      '</td><td class="num" data-label="Achieved">'+nf(acc.ytdCount)+
      '</td><td class="num" data-label="Turnover">'+money(acc.ytdTurnover/1000)+'</td></tr>';
  });
  html+='</tbody></table></div>';

  var ind = s.indicators||{};
  if(ind.EMI||ind.DAP||ind.RED){
    html += '<div class="chartcard"><h3 style="margin:0 0 8px;font-size:15px">Indicators</h3>';
    [['EMI','EMI'],['DAP','DAP'],['RED','RED LAUNCHES']].forEach(function(p){
      var d=ind[p[0]]; if(!d) return;
      var trail=(d.trail||[]).filter(function(x){return x.value!=null;})
                 .map(function(x){return x.label+': '+nf(x.value,2);}).join(' · ');
      html += '<div class="rowline"><span>'+p[1]+' <span style="color:var(--text-dim)">(target '+
              (d.target==null?'—':nf(d.target,2))+')</span></span><span class="v">'+(trail||'—')+'</span></div>';
    });
    html += '</div>';
  }

  if(s.mismatch&&s.mismatch.length)
    html += '<div class="notice">Cross-check mismatch — counted from detail rows vs the sheet\'s summary row: '+
            esc(s.mismatch.join(' | '))+'</div>';
  if(s.warnings&&s.warnings.length)
    html += '<div class="notice">Parsing notes ('+s.warnings.length+'): '+esc(s.warnings.slice(0,8).join(' | '))+'</div>';
  html += '<div class="notice">Source sheet: <b>'+esc(s.sheet)+'</b></div>';
  $('view').innerHTML = html;
}

function noticeBlock(){
  var out='';
  if(F.customer!=='ALL'&&F.type!=='ALL')
    out += '<div class="notice">Budget figures come from the customer row: the source sheet does not cross '+
           'project type with customer (they are two separate row axes). Achieved figures are crossed.</div>';
  var miss=(DATA.missingSites||[]).length, unk=(DATA.unknownSheets||[]).length;
  if(miss||unk){
    out += '<div class="notice">'+
      (miss?'No sheet in this period for '+miss+' site'+(miss>1?'s':'')+'. ':'')+
      (unk?unk+' sheet'+(unk>1?'s':'')+' left out — not in the mapping table ('+esc(DATA.unknownSheets.slice(0,4).join(', '))+').':'')+
      '</div>';
  }
  return out;
}

function drawRoChart(){
  var el=$('roChart'); if(!el||typeof Chart==='undefined') return;
  var labels=[],plan=[],real=[];
  BOOT.roOrder.forEach(function(ro){
    var list=sitesOfRo(ro); if(!list.length) return;
    var a=sumMetrics(list); labels.push(ro); plan.push(a.budgetYTD); real.push(a.realCount);
  });
  if(CHART) CHART.destroy();
  CHART=new Chart(el.getContext('2d'),{
    type:'bar',
    data:{labels:labels,datasets:[
      {label:'Plan (Budget YTD)',data:plan,backgroundColor:'#0057A8'},
      {label:'Achieved',data:real,backgroundColor:'#78BE20'}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{y:{beginAtZero:true,ticks:{precision:0}}},
      onClick:function(e,els){ if(els.length){ NAV={level:'sites',ro:labels[els[0].index],siteIdx:null}; render(); } }}
  });
}

/* ---------- filtreler ---------- */
function seg(container,items,current,onPick){
  container.innerHTML=items.map(function(it){
    return '<button type="button" data-v="'+it.v+'" aria-pressed="'+(it.v===current)+'">'+esc(it.t)+'</button>';
  }).join('');
  container.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ onPick(b.getAttribute('data-v')); };
  });
}
function buildStatusSeg(){
  var items=[{v:'NEW',t:'NEW'}];
  if(hasReman()) items.push({v:'REMAN',t:'REMAN'});   // yalniz veri varsa
  if(F.status==='REMAN'&&items.length===1) F.status='NEW';
  seg($('segStatus'),items,F.status,function(v){ F.status=v; render(); });
}
function buildFilters(){
  buildStatusSeg();
  seg($('segType'),[{v:'ALL',t:'All'},{v:'P1',t:'P1'},{v:'P10',t:'P10'},{v:'TTM',t:'TTM'}],F.type,
      function(v){ F.type=v; render(); });
  seg($('segCustomer'),[{v:'ALL',t:'All'},{v:'VS',t:'VS'},{v:'OES',t:'OES'}],F.customer,
      function(v){ F.customer=v; render(); });
  $('filters').hidden=false;
}

/* ---------- yukleme ---------- */
function loadPeriod(key){
  $('view').innerHTML='<div class="spinner" role="status">Reading '+esc(key)+'… scanning 48 sheets, the first load may take a moment.</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){ $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Unknown error')+'</div>'; return; }
      DATA=res; NAV={level:'ro',ro:null,siteIdx:null}; buildFilters(); render();
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
    })
    .getDashboardData(key,false);
}

function boot(){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res||res.error){ $('view').innerHTML='<div class="notice err">'+esc(res&&res.error||'Could not load start-up data')+'</div>'; return; }
      BOOT=res;
      $('inpQuery').value=res.gmailQuery||'';
      if(!res.periods.length){
        $('view').innerHTML='<div class="notice">No period registered yet. Open <b>Settings</b> and run the '+
          'Gmail scan, or add this month\'s spreadsheet link manually.</div>';
        return;
      }
      $('selPeriod').innerHTML=res.periods.map(function(p){
        return '<option value="'+p.key+'">'+esc(p.label)+'</option>'; }).join('');
      $('selPeriod').onchange=function(){ loadPeriod(this.value); };
      loadPeriod(res.periods[0].key);
    })
    .withFailureHandler(function(err){
      $('view').innerHTML='<div class="notice err">Server error: '+esc(err&&err.message||err)+'</div>';
    })
    .getBootstrap();
}

/* ---------- koyu mod (docs/koyu-mod.md) ---------- */
function applyTheme(dark){
  document.body.classList.toggle('dark-mode',dark);
  $('btnTheme').setAttribute('aria-pressed',String(dark));
  try{ localStorage.setItem('roDashTheme',dark?'dark':'light'); }catch(e){}
  if(CHART) drawRoChart();
}
function initTheme(){
  var saved=null;
  try{ saved=localStorage.getItem('roDashTheme'); }catch(e){}
  var dark = saved ? saved==='dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(!!dark);
  $('btnTheme').onclick=function(){ applyTheme(!document.body.classList.contains('dark-mode')); };
}

/* ---------- ayarlar ---------- */
function logS(msg){ $('settingsLog').textContent = msg; }
function initSettings(){
  $('btnSettings').onclick=function(){ $('dlgSettings').showModal(); };
  $('btnCloseSettings').onclick=function(){ $('dlgSettings').close(); };
  $('btnScan').onclick=function(){
    logS('Scanning Gmail…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); return; }
        var lines=(r.found||[]).map(function(f){ return (f.isNew?'NEW      ':'existing ')+f.key+'  '+f.name; });
        logS(r.threadCount+' email threads scanned.\n'+
             (lines.length?lines.join('\n'):'No new period found.')+
             ((r.errors||[]).length?'\n\nSkipped:\n'+r.errors.join('\n'):''));
        boot();
      })
      .withFailureHandler(function(e){ logS('Server error: '+(e&&e.message||e)); })
      .uiScanGmail();
  };
  $('btnSaveQuery').onclick=function(){
    google.script.run.withSuccessHandler(function(r){ logS('Query saved: '+r.query); })
      .withFailureHandler(function(e){ logS('Error: '+(e&&e.message||e)); })
      .uiSetGmailQuery($('inpQuery').value);
  };
  $('btnTrigger').onclick=function(){
    google.script.run.withSuccessHandler(function(r){ logS(r.message); })
      .withFailureHandler(function(e){ logS('Error: '+(e&&e.message||e)); })
      .uiInstallTrigger();
  };
  $('btnAdd').onclick=function(){
    logS('Adding…');
    google.script.run
      .withSuccessHandler(function(r){
        if(!r||r.error){ logS('Error: '+(r&&r.error||'unknown')); return; }
        logS(r.message); $('inpUrl').value=''; boot();
      })
      .withFailureHandler(function(e){ logS('Server error: '+(e&&e.message||e)); })
      .uiAddPeriod($('inpUrl').value);
  };
}

window.addEventListener('resize',function(){ if(DATA) render(); });
initTheme(); initSettings(); boot();
</script>
